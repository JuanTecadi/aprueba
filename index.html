<style>
/* Layout: one centered tablet column on squared notebook paper; one screen at a time, big touch targets */
:root {
  --paper: #f6f8fb;
  --grid: rgba(37, 64, 120, 0.07);
  --card: #ffffff;
  --ink: #16213a;
  --muted: #56617a;
  --line: #d9dfea;
  --sun: #ffc93c;          /* araguaney yellow: primary actions */
  --sun-ink: #2a2100;
  --sun-soft: #fff3cf;
  --ok: #1f9d55;  --ok-soft: #e3f6ea;
  --mid: #4f86e8; --mid-soft: #e4edfd;
  --low: #e0661b; --low-soft: #fdeadd;
  --none: #a3abbb; --none-soft: #eef1f6;
  --bad: #d23f3f; --bad-soft: #fde7e7;
  /* Materias: fill (identity), -t text on light surfaces, -s soft tint (palette decided 28 Oct 2026) */
  --cie: #22a6e0; --cie-t: #0a6e9c; --cie-s: #e3f4fc;
  --len: #ec5a9e; --len-t: #b3266d; --len-s: #fde6f1;
  --mat: #3236b0; --mat-t: #3236b0; --mat-s: #e7e8f8;
  --soc: #f2892a; --soc-t: #a64b00; --soc-s: #feeedd;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 18px;
  --shadow: 0 1px 0 rgba(22,33,58,.06), 0 6px 18px rgba(22,33,58,.06);
  --wm-op: .10; --mix: 38%; --band-ink: #ffffff;
  --off: #eef1f6; --off-line: #d3d9e4; --off-stripe: rgba(86,97,122,.12);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background-color: var(--g-bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--mat); outline-offset: 3px; }
.wrap { max-width: 1180px; margin: 0 auto; }
.narrow { width: 100%; max-width: 760px; margin-inline: auto; }

/* Top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px 10px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 1.6rem; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 6px; }
.brand .a { color: var(--ink); }
.brand .grade { font-size: .85rem; font-weight: 800; background: var(--sun); color: var(--sun-ink); padding: 2px 8px; border-radius: 999px; transform: translateY(-3px); }
.who { display: flex; align-items: center; gap: 10px; font-size: .95rem; color: var(--muted); min-width: 0; }
.who b { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pts { font-variant-numeric: tabular-nums; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; color: var(--ink); font-weight: 700; white-space: nowrap; }

h1, h2, h3 { font-family: var(--display); letter-spacing: -0.015em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.8rem, 4.5vw, 2.4rem); font-weight: 800; line-height: 1.1; }
h2 { font-size: 1.35rem; font-weight: 800; }
h3 { font-size: 1.1rem; font-weight: 600; }
.sub { color: var(--muted); margin: 6px 0 0; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.screen { display: flex; flex-direction: column; gap: 22px; padding-top: 8px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 0 26px; border-radius: 999px; border: 2px solid transparent; font-weight: 700; font-size: 1.1rem; }
.btn-main { background: var(--sun); color: var(--sun-ink); box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.btn-main:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
.btn-main:disabled { background: var(--none-soft); color: var(--muted); box-shadow: none; cursor: default; }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn-link { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; min-height: 44px; padding: 0 4px; font-weight: 400; font-size: 1rem; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* Login */
.login { background: var(--card); border-radius: 24px; box-shadow: var(--shadow); padding: 28px; display: flex; flex-direction: column; gap: 18px; margin-top: 4vh; }
.login label { font-weight: 700; }
.login input { width: 100%; min-height: 56px; border: 2px solid var(--line); border-radius: 14px; padding: 0 16px; background: var(--paper); font-size: 1.15rem; }
.login input:focus { border-color: var(--mat); outline: none; }
.error { color: var(--bad); font-size: .95rem; min-height: 1.4em; margin: 0; }
.note { font-size: .9rem; color: var(--muted); margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-user { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 8px 16px; min-height: 44px; }

/* Home choices */
.choice { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 16px; width: 100%; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--shadow); }
.choice:hover { border-color: var(--ink); }
.choice .ic { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 1.3rem; background: var(--none-soft); color: var(--ink); }
.choice .t { font-family: var(--display); font-weight: 800; font-size: 1.25rem; display: block; }
.choice .s { color: var(--muted); font-size: .95rem; display: block; }
.choice .arrow { font-size: 1.4rem; color: var(--muted); }
.choice.hero { background: var(--sun); border-color: var(--sun); color: var(--sun-ink); }
.choice.hero .s, .choice.hero .arrow { color: var(--sun-ink); opacity: .8; }
.choice.hero .ic { background: rgba(255,255,255,.55); color: var(--sun-ink); }
.choice > span:nth-child(2) { min-width: 0; }

/* Materia tiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.tile { text-align: left; background: var(--card); border: 2px solid var(--line); border-top: 8px solid var(--mc); border-radius: var(--r); padding: 18px; min-height: 120px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; box-shadow: var(--shadow); }
.tile .t { font-family: var(--display); font-weight: 800; font-size: 1.35rem; color: var(--mt, var(--mc)); }
.tile .s { color: var(--muted); font-size: .95rem; }
.tema-btn { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; text-align: left; background: var(--card); border: 2px solid var(--line); border-left: 8px solid var(--mc); border-radius: var(--r); padding: 16px 18px; width: 100%; box-shadow: var(--shadow); }
.tema-btn .n { grid-row: span 2; font-family: var(--display); font-weight: 800; color: var(--mt, var(--mc)); font-size: 1.1rem; padding-top: 1px; }
.tema-btn .t { font-weight: 700; font-size: 1.12rem; }
.tema-btn .s { color: var(--muted); font-size: .9rem; }

/* Intro */
.intro { background: var(--card); border-radius: 24px; box-shadow: var(--shadow); padding: 30px; display: flex; flex-direction: column; gap: 20px; border-top: 10px solid var(--mc, var(--sun)); }
.badge { display: inline-flex; align-self: flex-start; font-size: .85rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mt, var(--mc, var(--ink))); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fact { background: var(--paper); border-radius: 14px; padding: 14px 16px; }
.fact b { font-family: var(--display); font-size: 1.6rem; display: block; line-height: 1.1; }
.fact span { color: var(--muted); font-size: .92rem; }

/* Question */
.qbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--none-soft); border: 2px solid var(--line); }
.dot.cur { border-color: var(--ink); background: var(--card); }
.dot.ok { background: var(--ok); border-color: var(--ok); }
.dot.no { background: var(--bad); border-color: var(--bad); }
.qcard { background: var(--card); border-radius: 24px; box-shadow: var(--shadow); padding: 26px; display: flex; flex-direction: column; gap: 20px; position: relative; }
.rate { margin-left: auto; display: flex; gap: 6px; }
.vote { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); color: var(--muted); display: grid; place-items: center; padding: 0; }
.vote.down svg { transform: rotate(180deg); }
.vote:hover { color: var(--ink); border-color: var(--muted); }
.vote.on.up { color: var(--ok); background: var(--ok-soft); border-color: var(--ok); }
.vote.on.down { color: var(--bad); background: var(--bad-soft); border-color: var(--bad); }
.qmeta { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: .88rem; color: var(--muted); }
.mtag { font-weight: 700; color: var(--mt, var(--mc)); text-transform: uppercase; letter-spacing: .06em; }
.stem { font-size: clamp(1.22rem, 2.6vw, 1.42rem); line-height: 1.4; margin: 0; font-weight: 700; }
.opts { display: flex; flex-direction: column; gap: 12px; }
.opt { display: grid; grid-template-columns: 40px 1fr 28px; align-items: center; gap: 12px; text-align: left; min-height: 64px; padding: 10px 14px; background: var(--paper); border: 2px solid var(--line); border-radius: 16px; font-size: 1.12rem; transition: border-color .12s, background .12s; }
.opt .k { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; background: var(--card); border: 2px solid var(--line); }
.opt .mk { font-weight: 800; font-size: 1.2rem; text-align: center; }
.opt > span:nth-child(2) { min-width: 0; overflow-wrap: anywhere; }
.opt:hover:not(:disabled) { border-color: var(--muted); }
.opt.sel { border-color: var(--ink); background: var(--card); }
.opt.sel .k { background: var(--ink); color: var(--card); border-color: var(--ink); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .k { background: var(--ok); border-color: var(--ok); color: #fff; }
.opt.right .mk { color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); border-color: var(--bad); color: #fff; }
.opt.wrong .mk { color: var(--bad); }
.opt:disabled { cursor: default; }
.opt.dim { opacity: .55; }
.verdict { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.1rem; }
.verdict.ok { color: var(--ok); }
.verdict.no { color: var(--muted); font-weight: 400; font-size: 1rem; }
.plus { font-family: var(--display); font-weight: 800; background: var(--sun); color: var(--sun-ink); border-radius: 999px; padding: 2px 12px; animation: pop .5s ease-out; }
@keyframes pop { 0% { transform: scale(.4); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
.fb { background: var(--sun-soft); border-radius: 16px; padding: 16px 18px; }
.fb h3 { font-size: .85rem; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 4px; font-family: var(--body); font-weight: 700; }
.fb p { margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
.confirm { background: var(--card); border: 2px solid var(--low); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.confirm p { margin: 0; }
.nw { white-space: nowrap; }

/* Results */
.score { background: var(--card); border-radius: 24px; box-shadow: var(--shadow); padding: 28px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.big { font-family: var(--display); font-weight: 800; font-size: clamp(3rem, 10vw, 4.5rem); line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.big small { font-size: .35em; color: var(--muted); letter-spacing: 0; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.list li { display: grid; grid-template-columns: 32px 1fr; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; align-items: start; }
.list .m { font-weight: 800; font-size: 1.1rem; text-align: center; }
.list .m.ok { color: var(--ok); } .list .m.no { color: var(--bad); }
.list .q { font-size: .98rem; min-width: 0; }
.list .q small { display: block; color: var(--muted); font-size: .85rem; }

/* Progress map */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab { border: 2px solid var(--line); background: var(--card); border-radius: 999px; min-height: 44px; padding: 0 18px; font-weight: 700; color: var(--muted); }
.tab[aria-selected="true"] { border-color: var(--mc); color: var(--mt, var(--mc)); background: var(--card); box-shadow: inset 0 -3px 0 var(--mc); }
.map { background: var(--card); border-radius: 26px; box-shadow: var(--shadow); padding: 26px; display: flex; flex-direction: column; gap: 20px; }
.maphead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.maphead .gr { color: var(--muted); font-size: .95rem; }
.sumline { color: var(--muted); margin: 6px 0 0; font-variant-numeric: tabular-nums; }
.stackbar { display: flex; gap: 4px; height: 14px; }
.stackbar i { display: block; height: 100%; border-radius: 99px; min-width: 6px; }
.temagrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.tcard { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.tcard .tt { display: flex; align-items: center; gap: 10px; }
.tcard .num { flex: none; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--c); color: var(--k); font-family: var(--display); font-weight: 800; }
.tcard .tn { font-family: var(--display); font-weight: 800; font-size: 1.12rem; line-height: 1.2; flex: 1; min-width: 0; }
.tcard .tp { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .9rem; white-space: nowrap; }
.sbars { display: flex; flex-direction: column; gap: 8px; }
.sbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 44px; padding: 8px 14px; border-radius: 12px; background: var(--c); color: var(--k); }
.sbar .sn { font-weight: 700; font-size: .95rem; line-height: 1.25; min-width: 0; }
.sbar .sp { font-variant-numeric: tabular-nums; font-size: .9rem; font-weight: 700; white-space: nowrap; }
.mbar { height: 14px; border-radius: 99px; background: var(--none-soft); overflow: hidden; }
.mbar i { display: block; height: 100%; border-radius: 99px; background: var(--c); }
/* Not started: no fill, dashed outline, muted text */
[data-ns] { background: transparent !important; color: var(--muted) !important; border: 2px dashed var(--line) !important; }
/* Whole-grade map: four Materia areas coloured by level, each with one block per Tema */
.quad { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.carea { text-align: left; border-radius: 22px; padding: 18px; min-height: 160px; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; background: var(--c); color: var(--k); border: 2px solid transparent; }
.carea .top { display: flex; flex-direction: column; gap: 8px; }
.carea .top::before { content: ""; width: 40px; height: 6px; border-radius: 3px; background: var(--mc); }
.carea .kn { font-family: var(--display); font-weight: 800; font-size: 1.5rem; line-height: 1.1; }
.trail { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.trail span { aspect-ratio: 1; max-width: 100%; border-radius: 10px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; background: var(--c); color: var(--k); border: 2px solid var(--card); }
.trail span[data-ns] { background: var(--card) !important; }
/* Materia map: one row per Tema, its three Subtemas as large chips */
.tlist { display: flex; flex-direction: column; gap: 18px; }
.trow { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 6px 12px; align-items: start; }
.trow .num { grid-row: span 3; flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--c); color: var(--k); font-family: var(--display); font-weight: 800; border: 2px solid transparent; }
.trow .tn { font-family: var(--display); font-weight: 800; font-size: 1.12rem; line-height: 1.2; padding-top: 4px; min-width: 0; }
.chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cchip { border-radius: 12px; padding: 10px 12px; min-height: 64px; display: flex; flex-direction: column; justify-content: center; gap: 2px; background: var(--c); color: var(--k); border: 2px solid transparent; min-width: 0; overflow-wrap: anywhere; }
.cchip b { font-size: .95rem; line-height: 1.2; }
.cchip small { font-size: .85rem; font-variant-numeric: tabular-nums; opacity: .9; }
.trow .btn { justify-self: start; min-height: 48px; font-size: 1rem; }
@media (max-width: 560px) { .chips { grid-template-columns: minmax(0, 1fr); } .carea { min-height: 140px; padding: 14px; } .carea .kn { font-size: 1.25rem; } }
.tcard .btn { min-height: 48px; font-size: 1rem; align-self: flex-start; }
@media (max-width: 520px) {
  body { font-size: 17px; }
  .tiles, .facts { grid-template-columns: minmax(0, 1fr); }
  .qcard, .intro, .score, .login { padding: 20px; }
  .choice { grid-template-columns: 44px 1fr auto; padding: 14px 16px; }
  .choice .ic { width: 44px; height: 44px; font-size: 1.05rem; }
}
/* Materia icons: always next to the Materia name */
.ic { width: var(--s, 22px); height: var(--s, 22px); flex: none; display: inline-block; vertical-align: middle; }
.mbadge { width: var(--b, 44px); height: var(--b, 44px); border-radius: calc(var(--b, 44px) * .3); background: var(--mc); color: #fff; display: inline-grid; place-items: center; flex: none; }
.mbadge .ic { --s: calc(var(--b, 44px) * .6); }
.tile { justify-content: flex-start !important; }
.tile .mbadge { margin-bottom: 4px; }
.tile .s { margin-top: auto; }
.titlerow { display: flex; align-items: center; gap: 14px; }
.titlerow .mbadge { --b: 52px; }
.mtag { display: inline-flex; align-items: center; gap: 6px; }
.mtag .ic { --s: 20px; }
.badge { align-items: center; gap: 8px; }
.badge .mbadge { --b: 36px; }
.tab { display: inline-flex; align-items: center; gap: 6px; }
.tab .ic { --s: 20px; color: var(--mt, var(--mc)); }
.carea .top { flex-direction: row !important; align-items: center; justify-content: flex-start; gap: 10px !important; padding: 0; }
.carea .top::before { display: none; }
.carea .mbadge { --b: 40px; }
.list .q small .ic { --s: 16px; color: var(--mt); margin-right: 4px; vertical-align: -3px; }
#app > .screen, .top { position: relative; z-index: 1; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ===== Navigation and question screen (decided 28 Oct 2026). Landscape first: wide >= 960 px, medium 600-959, narrow < 600 ===== */
body.tinted { background-color: var(--sft); }
/* Main menu */
.home { display: grid; gap: 14px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.hero { grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; text-align: left; background: var(--sun); color: var(--sun-ink); border: 0; border-radius: 22px; padding: 22px 26px; min-height: 104px; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.hero:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
.hero .n { width: 60px; height: 60px; border-radius: 18px; background: rgba(255,255,255,.55); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 1.3rem; flex: none; }
.hero b, .prog b { font-family: var(--display); font-weight: 800; display: block; }
.hero b { font-size: 1.5rem; } .hero .s { opacity: .8; display: block; }
.arr { margin-left: auto; font-size: 1.6rem; opacity: .7; }
.mbtn { display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; gap: 18px; text-align: left; background: var(--sft); border: 2px solid color-mix(in srgb, var(--mc) var(--mix), var(--card)); border-radius: 22px; padding: 18px; min-height: 168px; }

/* ===================== v0.3 foundations (8 Nov 2026) =====================
   «Colour outside, calm inside»: navigation screens on the deep grade colour (inside a Materia, the deep Materia tone),
   reading screens on the soft Materia tint. No notebook grid, no watermark, no dark mode. */
:root {
  /* Grade identity: 5to = Médanos de Coro (dunes). Only 5to is built; 4to and 6to pills are in logo v2. */
  --g-bg: #1B2A55; --g-rail: #121D3D; --g-land1: #22336A; --g-land2: #2A3D78; --g-pill: #2E4A9A;
  /* Deep Materia tones for Materia screens (Ciencias from the mockup; the other three with the same darkening and contrast checks) */
  --cie-d: #0A4E70; --cie-r: #083B55; --cie-l1: #0C5A80; --cie-l2: #106690;
  --len-d: #811B4E; --len-r: #61153B; --len-l1: #931F5A; --len-l2: #A62365;
  --mat-d: #23267A; --mat-r: #1A1C5B; --mat-l1: #292C8F; --mat-l2: #2E32A3;
  --soc-d: #763600; --soc-r: #5A2900; --soc-l1: #883D00; --soc-l2: #9A4500;
  --mat-tile: #5559D6;     /* Matemáticas tile on the navy main page: lighter so it stands out like the other three */
  --on-dark: #FFFFFF; --on-dark-2: #DCE3F5; --rail-ink: #AEB9DA; --glass: rgba(255,255,255,.12);
  --sec-line: #C9CFDB; --muted2: #5B6478;
  /* Surface in use (set by render()) */
  --bg: var(--g-bg); --rail-bg: var(--g-rail); --l1: var(--g-land1); --l2: var(--g-land2);
}
body { background: var(--bg); padding: 0; }
body.tinted { background: var(--bg); }   /* replaces the v0.2 tinted page */
body.s-read, body.tinted.s-read { background: var(--sft, #F3F5F9); }
.land { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
.land .l1 { fill: var(--l1); } .land .l2 { fill: var(--l2); }
body.s-read .land { display: none; }
.wmp { display: none !important; }   /* no watermark (8 Nov 2026) */

/* Shell: rail on the left (bottom bar on phones), then the stage: information area on top, interaction area below */
.shell { position: relative; z-index: 1; min-height: 100vh; }
.rail { position: fixed; left: 0; top: 0; bottom: 0; width: 88px; z-index: 5; background: var(--rail-bg);
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: calc(16px + env(safe-area-inset-top, 0px)) 0 14px; }
.rail[hidden] { display: none; }
.rail .badge { width: 48px; height: 48px; margin-bottom: 18px; }
.rail .ri { width: 74px; height: 64px; border: 0; border-radius: 14px; background: transparent; color: var(--rail-ink);

<script>
(() => {

  const logo = (dark = true) => { const g = encodeURIComponent(CFG.grado), alt = esc(t('textos.marca') + ' ' + CFG.grado);

  // Rotating lines (Aprueba – Textos): one line at random from a group, never the same as the last one shown.
  // Each line carries its mood. No personal data in these lines.
  const lastLine = {};
  const say = key => {
    const list = key.split('.').reduce((o, k) => o && o[k], T);
    if (!Array.isArray(list) || !list.length) return { animo: 'neutral', texto: '' };
    let i = Math.floor(Math.random() * list.length);
    if (list.length > 1 && i === lastLine[key]) i = (i + 1 + Math.floor(Math.random() * (list.length - 1))) % list.length;

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

     Email and password with Supabase. The parent signs up (required tick box, stored as adult_confirmed);
     no email confirmation during the test. The nickname is chosen after the first login:
     unique ignoring capitals and accents, 2 to 20 characters (checked again by the database). */
  const SUPABASE_URL = 'https://ctvaqvzvhxpyjwtpuycn.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_qa_L6c8kfiYHiht7E7tT9Q_i3MFqALs';   // publishable key: the access rules protect the data

  const noNet = () => { const e = new Error('offline'); e.offline = true; return e; };

    const c = client(); if (!c) throw noNet();

  // Leaderboard switch (4 Nov 2026): the same switch on the Tabla de posiciones page and in Configuración.

  async function setEnTabla(on) {

  async function enterAs(user) {   // after login, sign-up or a session saved on this device

  // The student's own Pruebas (with their answers) and thumbs; the access rules return only this account's rows
  async function loadHistory() {
    const c = client();
    const { data, error } = await c.from('pruebas')
      .select('id,tipo,materia,tema,started_at,finished_at,duracion_seg,n_correctas,puntos,answers(question_id,posicion,opcion,correcta,tiempo_ms)')
      .order('finished_at', { ascending: true });
    if (error) throw error;
    const saved = (data || []).map(x => ({
      id: x.id, tipo: x.tipo, materia: x.materia, tema: x.tema, inicio: x.started_at, fin: x.finished_at,
      duracionSeg: x.duracion_seg, correctas: x.n_correctas, puntos: x.puntos,
      respuestas: (x.answers || []).slice().sort((a, b) => a.posicion - b.posicion)
        .map(a => ({ id: a.question_id, correcta: a.correcta, opcion: a.opcion, ms: a.tiempo_ms }))
    }));
    const ids = new Set(saved.map(x => x.id));
    const waiting = load(keyPend(state.uid), []).filter(w => !ids.has(w.record.id));
    save(keyPend(state.uid), waiting);
    memoryData[state.uid] = { pruebas: saved.concat(waiting.map(w => w.record)) };
    const r = await c.from('ratings').select('question_id,valor');
    votes = {}; for (const v of (r.data || [])) votes[v.question_id] = v.valor;
  }
  // Send the Pruebas waiting on this device, oldest first; a retry of the same Prueba is ignored by the database
  let sending = false;
  async function sendPending() {
    if (sending || !state.uid) return;
    const uid = state.uid, c = client(); if (!c) return;
    sending = true;
    try {
      for (const w of load(keyPend(uid), [])) {
        const { error } = await c.rpc('save_prueba', { p: w.payload });
        if (error) break;
        save(keyPend(uid), load(keyPend(uid), []).filter(x => x.record.id !== w.record.id));
      }
    } catch (e) { /* no connection: try again later */ }
    finally { sending = false; }
  }
  const newId = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
    : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, ch => { const r = Math.random() * 16 | 0; return (ch === 'x' ? r : (r & 3 | 8)).toString(16); });
  // Returns null when saved, or the text key of the message to show
  // extra: other columns saved in the same update (the nickname screen saves the leaderboard switch with it, 8 Nov 2026)
  async function saveNickname(name, extra = {}) {
    name = name.trim();
    if ([...name].length < 2 || [...name].length > 20) return 'textos.apodoAyuda';
    try {
      const c = client(); if (!c) return 'textos.errorConexion';

  async function signOut() {

    memoryData = {}; tablaCache = {};

  /* ---------- draw a prueba (TST-01 to TST-05) ---------- */
  function pool(tipo, mid, tid) {
    return BANK.questions.filter(q => tipo === 'grado' || (q.materia === mid && (tipo === 'materia' || q.tema === tid)));
  }
  function draw(tipo, mid, tid) {
    const n = CFG.preguntasPorPrueba, used = new Set(), picked = [];
    for (const q of shuffle(pool(tipo, mid, tid))) {
      if (q.cluster && used.has(q.cluster)) continue;          // TST-04
      picked.push(q); if (q.cluster) used.add(q.cluster);
      if (picked.length === n) break;
    }
    return picked.map(q => {
      const idx = q.options.map((_, i) => i);
      const order = q.order === 'Fixed' ? idx : shuffle(idx);  // TST-03, MET-08 (Fixed is pre-sorted ascending)
      return { id: q.id, order, chosen: null, checked: false, ms: 0 };
    });
  }
  const Q = id => BANK.questions.find(q => q.id === id);

  /* ---------- performance levels for the progress map ----------
     Settings: points, "answer that counts", level limits and colours.
     Each question counts once (its latest or best answer).
     The map shows no points (4 Nov 2026). */
  function perf() {
    const ok = {};   // question id -> counts as correct (true/false)
    for (const p of userData().pruebas) for (const r of p.respuestas) {   // pruebas are stored in time order
      if (!Q(r.id)) continue;
      ok[r.id] = CFG.respuestaQueCuenta === 'mejor' ? (ok[r.id] || r.correcta) : r.correcta;
    }
    const s = {};
    for (const q of BANK.questions) for (const k of [q.materia, q.materia + '|' + q.tema, q.materia + '|' + q.subtema]) {
      s[k] = s[k] || { c: 0, n: 0, a: 0 };
      s[k].n++; if (ok[q.id]) s[k].c++; if (q.id in ok) s[k].a++;
    }
    return s;
  }
  function level(x) {
    const pct = x && x.n ? x.c / x.n : 0;   // level = questions answered correctly ÷ questions
    let n = 1;
    CFG.niveles.forEach((l, i) => { if (pct >= l.desde) n = i + 1; });
    return n;
  }
  const levelColor = n => CFG.niveles[n - 1].color;
  const levelInk = n => n >= 4 ? '#ffffff' : '#10301c';   // readable text on light and dark greens
  /* ---------- reviewer ratings (thumbs up / down per question) ----------
     Since v0.2 step 4: one row per account and question in Supabase (table ratings); tapping again removes it. */
  let votes = {};                              // { questionId: 1 | -1 } for this account, loaded after login
  async function vote(qid, v) {
    const now = votes[qid] === v ? 0 : v;      // tap again to remove the rating
    if (now) votes[qid] = now; else delete votes[qid];
    render();
    try {
      const c = client(); if (!c || !state.uid) return;
      if (now) await c.from('ratings').upsert({ student_id: state.uid, question_id: qid, valor: now, updated_at: new Date().toISOString() }, { onConflict: 'student_id,question_id' });
      else await c.from('ratings').delete().eq('student_id', state.uid).eq('question_id', qid);
    } catch (e) { /* no connection: the thumb shows on screen but is not saved */ }
  }
  // Points reward practice (4 Nov 2026): every correct answer, repeats included. The saved total plus, during a
  // Prueba, the points of the answers given so far; an abandoned Prueba is never saved, so the total returns.
  const savedPoints = () => userData().pruebas.reduce((a, p) => a + p.puntos, 0);
  const livePoints = () => {
    const P = state.prueba; if (state.view !== 'pregunta' || !P) return 0;
    const done = P.items.filter(x => x.checked), c = done.filter(x => x.chosen === Q(x.id).correct).length;
    return pts(c, done.length);
  };
  const totalPoints = () => savedPoints() + livePoints();

  /* ---------- sound effects (decided 28 Oct 2026) ----------
     Three short sounds generated in the browser (no files): correct = "Marimba" (two warm notes, C to G),
     wrong = "Toc suave" (muffled low knock), click = "Tic" (tiny dry tick).
     On/off is remembered on this device; the starting state and the volume come from the settings.
     No sound on the login screen. Sound never carries meaning alone (green ✓ and red ✗ stay). */
  const KEY_SOUND = 'aprueba.v01.sonido';
  const sound = { ctx: null, out: null };
  const soundOn = () => { const v = load(KEY_SOUND, null); return v === null ? CFG.sonidoInicial === 'activado' : v === 'on'; };
  function audio() {
    if (!sound.ctx) {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      sound.ctx = new C(); sound.out = sound.ctx.createGain();
      sound.out.gain.value = 0.6 * CFG.volumenSonido * CFG.volumenSonido;   // same curve as the sound picker page
      sound.out.connect(sound.ctx.destination);
    }
    if (sound.ctx.state === 'suspended') sound.ctx.resume();
    return sound.ctx;
  }
  function tone(o) {   // one note: wave type, frequency (or [from, to] glide), start offset, length, peak, optional low-pass
    const c = sound.ctx, at = c.currentTime + 0.01 + (o.at || 0);
    const osc = c.createOscillator(), g = c.createGain(); osc.type = o.type || 'sine';
    if (Array.isArray(o.f)) { osc.frequency.setValueAtTime(o.f[0], at); osc.frequency.exponentialRampToValueAtTime(o.f[1], at + (o.glide || o.dur)); }
    else osc.frequency.setValueAtTime(o.f, at);
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(o.g, at + (o.atk || 0.006)); g.gain.exponentialRampToValueAtTime(0.0001, at + o.dur);
    let end = g; if (o.lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; g.connect(f); end = f; }
    osc.connect(g); end.connect(sound.out); osc.start(at); osc.stop(at + o.dur + 0.02);
  }
  function tick() {
    const c = sound.ctx, at = c.currentTime + 0.01, len = Math.ceil(c.sampleRate * 0.025);
    const b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const s = c.createBufferSource(); s.buffer = b;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2600; f.Q.value = 1.5;
    const g = c.createGain(); g.gain.value = 0.7;
    s.connect(f); f.connect(g); g.connect(sound.out); s.start(at);
  }
  const SFX = {
    correcta: () => { tone({ type: 'triangle', f: 523, dur: .14, g: .5, lp: 2200 }); tone({ f: 2092, dur: .05, g: .06 }); tone({ type: 'triangle', f: 784, at: .09, dur: .19, g: .55, lp: 2200 }); tone({ f: 3136, at: .09, dur: .05, g: .05 }); },
    incorrecta: () => tone({ type: 'triangle', f: [240, 190], dur: .18, g: .55, lp: 1100 }),
    clic: tick
  };
  function sfx(name) {
    if (!state.user || !CFG || !soundOn()) return;
    try { if (audio()) SFX[name](); } catch (e) { /* no sound on this device: keep going */ }
  }
  const SPEAKER = '<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke="none"/>';
  const soundIcon = on => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">${SPEAKER}${on ? '<path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a7.8 7.8 0 0 1 0 11"/>' : '<path d="m16 9.5 5 5"/><path d="m21 9.5-5 5"/>'}</svg>`;
  function toggleSound() {
    const on = !soundOn(); save(KEY_SOUND, on ? 'on' : 'off');
    renderTop(); if (on) sfx('clic');   // a tick confirms that sound is back on
  }

  /* ---------- shell (v0.3, 8 Nov 2026): rail and information area ----------
     Rail: Pruebas, Progreso, Tabla, Ayuda and, at the bottom, the gear (Configuración); the selected item has a yellow pill.
     Hidden before login, on the nickname screen and during a Prueba (question screen). Bottom bar on phones (CSS).
     Information area: the screen's back link, title and context on the left (set by each view with head()),
     the sound button and the points chip (opens the Tabla) on the right. */
  const RAIL = [['home', 'railPruebas', 'PRU'], ['progreso', 'railProgreso', 'PRO'], ['tabla', 'railTabla', 'TAB'], ['ayuda', 'railAyuda', 'AYU']];
  const railOf = v => ({ materia: 'home', intro: 'home', resultado: 'home', respuestas: 'home' })[v] || v;
  const rail = document.getElementById('rail');
  function renderRail() {
    const show = !!state.user && !['login', 'apodo', 'pregunta'].includes(state.view);
    document.body.classList.toggle('has-rail', show);
    if (!show) { rail.hidden = true; rail.innerHTML = ''; return; }
    const sel = railOf(state.view);
    const item = ([v, key, ic], cls = '') => `<button class="ri${cls}${sel === v ? ' on' : ''}" data-rail="${v}"${sel === v ? ' aria-current="page"' : ''}>${micon(ic)}<span>${esc(t('textos.' + key))}</span></button>`;

      + RAIL.map(x => item(x)).join('') + item(['config', 'railConfiguracion', 'CFG'], ' cfg');
    rail.querySelectorAll('[data-rail]').forEach(b => b.onclick = () => leaveTo(b.dataset.rail));

  // Each view describes its information area: { back: [id, textKey, action], icon: html, title: text, pill: true, extra: html }
  let HEAD = null;
  const head = h => { HEAD = h; };
  function renderTop() {
    if (!state.user) { top.innerHTML = ''; top.hidden = true; return; }   // login and nickname: no information area
    const on = soundOn(), lbl = esc(t(on ? 'textos.sonidoSilenciar' : 'textos.sonidoActivar'));
    const total = totalPoints(), anim = state.ptsAnim; state.ptsAnim = null;
    const shown = anim ? anim.from : total, h = HEAD || {};
    top.innerHTML = `<div class="ttl">`
      + (h.back ? `<button class="b-back" id="${h.back[0]}"><span class="ar" aria-hidden="true">‹</span>${esc(t(h.back[1]))}</button>` : '')
      + (h.icon || h.title ? `<span class="tt">${h.icon || ''}${h.title ? `<h1>${esc(h.title)}</h1>` : ''}</span>` : '') + (h.pill ? `<span class="gpill">${esc(CFG.grado)}</span>` : '') + (h.extra || '')
      + `</div><div class="tools">`
      + `<button class="snd ${on ? '' : 'off'}" id="snd" aria-pressed="${on}" aria-label="${lbl}" title="${lbl}">${soundIcon(on)}</button>`
      + `<button class="pts" id="ptsbtn" aria-label="${esc(t('textos.verTabla', { p: total }))}">${micon('TAB')}<span class="n">${esc(t('textos.puntosTotales', { n: shown }))}</span></button></div>`;
    document.getElementById('snd').onclick = toggleSound;
    document.getElementById('ptsbtn').onclick = () => leaveTo('tabla');
    if (h.back && h.back[2]) document.getElementById(h.back[0]).onclick = h.back[2];   // step 3: the view gives the back action
    top.hidden = false;
    if (anim) countUp(anim.from, anim.to);
  }
  // The total counts up with a short pop (under half a second, brief yellow highlight) when an answer is correct.
  function countUp(from, to) {
    const b = document.getElementById('ptsbtn'), n = b && b.querySelector('.n'); if (!n) return;
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const put = v => { n.textContent = t('textos.puntosTotales', { n: v }); };
    b.classList.add('pop');
    setTimeout(() => { b.classList.add('fade'); b.classList.remove('pop'); }, 450);
    if (reduce) { put(to); return; }
    const t0 = performance.now(), dur = 400;
    const step = now => { const k = Math.min(1, (now - t0) / dur); put(Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)))); if (k < 1 && n.isConnected) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  // From the top bar during a Prueba: the same confirmation as «Salir» first (the answers and points are not saved)
  function leaveTo(view) {
    const P = state.prueba;

    go(view);
  }

  // Tema slots 1..temasPorMateria: the included Temas are active, the others show as "Tema N" (not active yet)
  const temaSlots = m => Array.from({ length: Math.max(CFG.temasPorMateria, m.temas.length) }, (_, i) => ({ n: i + 1, tema: m.temas.find(x => temaNum(x.id) === i + 1) || null }));

  // Materia screen (v0.3, 8 Nov 2026): deep Materia background; information area with «‹ Volver», the Materia icon and
  // name and the grade pill. The line and the yellow «Todo [Materia]» tile, then 12 white Tema tiles (4 × 3):
  // the Tema icon (or the number in the icon slot until that Materia's icons are drawn), the name, «Tema N».
  // Temas not active yet: a translucent tile with «Tema N» only, not tappable.
  function viewMateria() {
    const m = materia(state.materia);
    head({ back: ['back', 'textos.volver', () => go('home')], icon: `<span class="tic2">${micon(m.id)}</span>`, title: m.name, pill: true });
    const tiles = temaSlots(m).map(({ n, tema: x }) => x
      ? `<button class="ttile" data-t="${x.id}"><span class="tslot">${temaIcon(m.id, x.id) || `<span class="tnum" aria-hidden="true">${n}</span>`}</span><b class="tn">${esc(x.name)}</b><span class="tno">${esc(t('textos.temaN', { n }))}</span></button>`
      : `<div class="ttile off" aria-disabled="true"><span class="tno">${esc(t('textos.temaN', { n }))}</span></div>`).join('');
    app.innerHTML = `
      <section class="page mpage" style="--mt:var(--${m.id.toLowerCase()}-t)">

          <button class="mtodo" id="all">${micon(m.id)}<span>${esc(t('textos.todosLosTemas', { materia: m.name }))}</span></button></div>
        <div class="ttiles">${tiles}</div>
      </section>`;
    document.getElementById('all').onclick = () => go('intro', { pick: { tipo: 'materia', mid: m.id } });
    app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => go('intro', { pick: { tipo: 'tema', mid: m.id, tid: b.dataset.t } }));

  function pickLabels(pick) {
    if (pick.tipo === 'grado') return { title: t('textos.introGrado'), sub: t('textos.introGradoSub') };
    const m = materia(pick.mid);
    if (pick.tipo === 'materia') return { title: t('textos.introMateria', { materia: m.name }), sub: t('textos.introMateriaSub', { materia: m.name }) };
    return { title: t('textos.introTema', { tema: tema(pick.mid, pick.tid).name }), sub: t('textos.introTemaSub', { materia: m.name, n: temaNum(pick.tid) }) };
  }
  // The icon of the tile that launched the Prueba travels with it (8 Nov 2026): intro band, question chip, result band.
  // Todo 5to: the four-colour “+”; Todo [Materia]: the Materia icon; one Tema: its icon (or its number until drawn).
  const launchIcon = pick => pick.tipo === 'grado' ? micon('ALL') : pick.tipo === 'materia' ? micon(pick.mid)
    : temaIcon(pick.mid, pick.tid) || `<span class="tnum" aria-hidden="true">${temaNum(pick.tid)}</span>`;
  // Card colours: band (--bc, --bi), label and chip (--lc, --cs). Whole grade: yellow band, grade-pill blue label.
  const cardStyle = pick => {
    if (pick.tipo === 'grado') return '--bc:var(--sun);--bi:var(--ink);--lc:var(--g-pill);--cs:#E9EEF8';
    const k = pick.mid.toLowerCase(); return `--bc:var(--${k}-t);--lc:var(--${k}-t);--cs:var(--${k}-s)`;
  };
  // Animations only when the card arrives (not on a re-render or on the way back from «Mis respuestas»)
  let prevView = null;

  // Prueba intro: a game card (8 Nov 2026). Band with the launching icon; label, title, two chips, the instruction,
  // «¡Empezar!» across the card. «‹ Volver» in the information area. No mascot, no visible timer.
  function viewIntro() {
    const p = state.pick, L = pickLabels(p);

    app.innerHTML = `
      <section class="page cpage">
        <div class="gcard${prevView !== 'intro' ? ' deal' : ''}" style="${cardStyle(p)}">
          <div class="gband" aria-hidden="true">${launchIcon(p)}</div>

            <h2>${esc(L.title)}</h2>
            <div class="gchips"><span class="gchip">${esc(t('textos.introPreguntas', { n: CFG.preguntasPorPrueba }))}</span><span class="gchip y">${esc(t('textos.introPuntos', { p: CFG.puntosPorCorrecta }))}</span></div>
            <p class="ginst">${esc(t('textos.introInstruccion'))}</p>
            <span class="grow"></span>
            <button class="b b-pri wide" id="start">${esc(t('textos.empezar'))}</button>
          </div>
        </div>
      </section>`;
    document.getElementById('start').onclick = () => {
      go('pregunta', { prueba: { ...p, inicio: new Date().toISOString(), t0: Date.now(), qStart: Date.now(), i: 0, items: draw(p.tipo, p.mid, p.tid), quit: false } });
    };
  }

  // Question (8 Nov 2026): one centred card on the soft tint of the question's Materia. Band: Materia icon,
  // «Materia · Tema», thumbs. Stem, 2 × 2 options (one column on phones). After the first tap the answer locks and the
  // feedback grows below the options (the options never move): fixed verdict, «+10», «Explicación», «Continuar».
  // Information area (rail hidden): «‹ Salir», the dots, a chip with the launching icon; sound and points on the right.
  const THUMB = d => d > 0 ? '<path d="M7 11v9H4v-9zM7 11l4-7c1.5 0 2.5 1 2.5 2.5V10H19a2 2 0 0 1 2 2.3l-1.2 6A2 2 0 0 1 17.8 20H7"/>'
    : '<path d="M17 13V4h3v9zM17 13l-4 7c-1.5 0-2.5-1-2.5-2.5V14H5a2 2 0 0 1-2-2.3l1.2-6A2 2 0 0 1 6.2 4H17"/>';
  function viewPregunta() {
    const P = state.prueba, it = P.items[P.i], q = Q(it.id), n = P.items.length;
    const m = materia(q.materia), k = m.id.toLowerCase(), x = tema(q.materia, q.tema);
    const dots = P.items.map((d, j) => `<span class="dt${j === P.i && !d.checked ? ' cur' : ''}${d.checked ? (d.chosen === Q(d.id).correct ? ' ok' : ' no') : ''}"></span>`).join('');
    const chipTxt = P.tipo === 'grado' ? t('textos.tipoGrado') : P.tipo === 'materia' ? t('textos.todosLosTemas', { materia: materia(P.mid).name }) : t('textos.temaN', { n: temaNum(P.tid) });
    const chipIc = P.tipo === 'tema' ? (temaIcon(P.mid, P.tid) || micon(P.mid)) : launchIcon(P);
    const chipMt = P.tipo === 'grado' ? 'var(--ink)' : `var(--${P.mid.toLowerCase()}-t)`;
    head({ back: ['quit', 'textos.salir', () => { P.quit = true; P.quitTo = null; render(); }],
      extra: `<span class="qmeta3"><div class="dots3" role="img" aria-label="${esc(t('textos.preguntaDe', { i: P.i + 1, n }))}">${dots}</div><span class="pchip" style="--mt:${chipMt}">${chipIc}${esc(chipTxt)}</span></span>` });
    const right = it.checked && it.chosen === q.correct;
    const opts = it.order.map(oi => {
      let cls = 'qo', mk = '';
      if (it.checked) {
        if (oi === q.correct) { cls += ' right'; mk = '✓'; }
        else if (oi === it.chosen) { cls += ' wrong'; mk = '✗'; }
        else cls += ' dim';
      }
      return `<button class="${cls}" data-o="${oi}" ${it.checked ? 'disabled' : ''} aria-pressed="${oi === it.chosen}"><span>${fmt(q.options[oi])}</span><span class="mk" aria-hidden="true">${mk}</span></button>`;
    }).join('');
    const vote3 = d => { const on = votes[q.id] === d, l = esc(t(d > 0 ? 'textos.votoArriba' : 'textos.votoAbajo'));
      return `<button class="vote3" data-v="${d}" aria-pressed="${on}" aria-label="${l}" title="${l}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${THUMB(d)}</svg></button>`; };
    const plus = right ? CFG.puntosPorCorrecta : it.checked ? CFG.puntosPorIncorrecta : 0;
    app.innerHTML = `
      <section class="qpage" style="--mt:var(--${k}-t);--sft:var(--${k}-s)">
        <article class="qcard3" style="--bc:var(--${k}-t)">
          <div class="qband">${micon(m.id)}<span class="qloc">${esc(m.name)} · ${esc(x ? x.name : q.tema)}</span><span class="rate3">${vote3(1)}${vote3(-1)}</span></div>
          <div class="qbody3">
            <p class="qstem">${fmt(q.stem)}</p>
            <div class="qopts" role="group">${opts}</div>
            ${it.checked ? `<div class="qfb" id="fb">
              <div class="qverd ${right ? 'ok' : 'no'}" role="status"><span><span aria-hidden="true">${right ? '✓' : '✗'}</span> ${esc(t(right ? 'textos.correcto' : 'textos.incorrecto'))}</span>${plus ? `<span class="plus3">${esc(t('textos.masPuntos', { p: plus }))}</span>` : ''}</div>
              <p class="qlbl">${esc(t('textos.explicacion'))}</p>
              <p class="qexp">${fmt(q.feedback)}</p>
              <div class="actions"><button class="b b-pri" id="next">${esc(t(P.i === n - 1 ? 'textos.verResultado' : 'textos.siguiente'))}</button></div>
            </div>` : ''}
          </div>
        </article>
      </section>
      ${P.quit ? `<div class="qconfirm"><div class="box" role="alertdialog" aria-modal="true" aria-labelledby="qc-t"><p id="qc-t">${esc(t('textos.salirPregunta'))}</p>
        <div class="actions"><button class="b b-sec" id="quit-yes">${esc(t('textos.salirSi'))}</button><button class="b b-pri" id="quit-no">${esc(t('textos.salirNo'))}</button></div></div></div>` : ''}`;
    app.querySelectorAll('[data-v]').forEach(b => b.onclick = () => vote(q.id, +b.dataset.v));
    app.querySelectorAll('[data-o]').forEach(b => b.onclick = () => {
      if (it.checked) return;
      const before = totalPoints();
      it.chosen = +b.dataset.o; it.checked = true; it.checkedAt = Date.now(); it.answeredAt = new Date().toISOString(); it.ms = Date.now() - P.qStart;
      sfx(it.chosen === q.correct ? 'correcta' : 'incorrecta');
      // 4 Nov 2026: the top bar adds the points at the same moment the option turns green (no extra sound)
      const after = totalPoints(); if (after !== before) state.ptsAnim = { from: before, to: after };
      render();
      // Phones and portrait: if the feedback ends below the screen, bring it up (on a tablet in landscape it fits)
      const fb = document.getElementById('fb');
      if (fb && fb.getBoundingClientRect().bottom > innerHeight) {
        const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        fb.scrollIntoView({ block: 'end', behavior: reduce ? 'auto' : 'smooth' });
      }
    });
    const $ = id => document.getElementById(id);
    if ($('next')) $('next').onclick = advance;
    if ($('quit-no')) $('quit-no').onclick = () => { P.quit = false; P.quitTo = null; render(); };
    if ($('quit-yes')) $('quit-yes').onclick = () => go(P.quitTo || 'home', { prueba: null });
    if ($('quit-no')) $('quit-no').focus();
  }

  function finish() {
    const P = state.prueba;
    // The option chosen is saved as its code from the master workbook (K = correct, D1-D3), not its position or text
    const respuestas = P.items.map(x => { const q = Q(x.id); return { id: x.id, correcta: x.chosen === q.correct, opcion: q.codes[x.chosen], ms: x.ms, at: x.answeredAt }; });
    const correctas = respuestas.filter(r => r.correcta).length;
    const record = {
      id: newId(), tipo: P.tipo, materia: P.mid || null, tema: P.tid || null,
      inicio: P.inicio, fin: new Date().toISOString(), duracionSeg: Math.round((Date.now() - P.t0) / 1000),
      correctas, puntos: pts(correctas, respuestas.length), respuestas
    };
    // Temas that reach the top level for the first time with this Prueba (with "Mejor", a level never goes down)
    const top5 = CFG.niveles.length, before = perf();
    userData().pruebas.push(record);
    const payload = { id: record.id, tipo: record.tipo, materia: record.materia, tema: record.tema,
      started_at: record.inicio, finished_at: record.fin, duracion_seg: record.duracionSeg,
      n_preguntas: respuestas.length, n_correctas: correctas, puntos: record.puntos,
      answers: respuestas.map((r, k) => ({ question_id: r.id, posicion: k + 1, opcion: r.opcion, correcta: r.correcta, tiempo_ms: r.ms, answered_at: r.at })) };
    save(keyPend(state.uid), load(keyPend(state.uid), []).concat([{ record, payload }]));
    sendPending();
    const after = perf(), nuevoNivel5 = [];
    for (const m of BANK.materias) for (const x of m.temas) {
      const k = m.id + '|' + x.id;
      if (level(before[k]) < top5 && level(after[k]) >= top5) nuevoNivel5.push(x.name);
    }
    // The message (app's voice, 8 Nov 2026): one line from the band of the result, chosen once here; a Tema reaching
    // «Dominado» for the first time uses «nivel5» instead. The chivo: «Festejo» from mascotaFelizDesde or with nivel5.
    const share = correctas / respuestas.length;
    const band = share >= CFG.mascotaFelizDesde ? 'feliz' : share >= CFG.mensajeAltoDesde ? 'alto' : share >= CFG.mensajeMedioDesde ? 'medio' : 'bajo';
    const mensaje = nuevoNivel5.length ? t('textos.nivel5', { tema: nuevoNivel5[0] }) : say('textos.resumen.' + band).texto;
    const festejo = band === 'feliz' || nuevoNivel5.length > 0;
    go('resultado', { resultado: record, nuevoNivel5, mensaje, festejo, prueba: null });
  }

  // End of Prueba (8 Nov 2026): the back of the card. Band with the launching icon; label, «¡Terminaste la prueba!»,
  // the score, «+N puntos», the message with no label; «Mis respuestas» and «Otra prueba». The chivo beside the card.
  // Time is recorded, not shown.
  const pickOf = R => ({ tipo: R.tipo, mid: R.materia, tid: R.tema });
  function resultLabel(R) {
    if (R.tipo === 'grado') return t('textos.introGrado');
    const m = materia(R.materia);
    if (R.tipo === 'materia') return t('textos.introMateria', { materia: m.name });
    const x = tema(R.materia, R.tema);
    return t('textos.introTemaSub', { materia: m.name, n: temaNum(R.tema) }) + (x ? ' · ' + x.name : '');
  }
  function viewResultado() {
    const R = state.resultado, n = R.respuestas.length;
    head({});
    app.innerHTML = `
      <section class="page rpage"><div class="rwrap">
        <div class="gcard${prevView === 'pregunta' ? ' flip' : ''}" style="${cardStyle(pickOf(R))}">
          <div class="gband sm" aria-hidden="true">${launchIcon(pickOf(R))}</div>
          <div class="gbody">
            <p class="glbl">${esc(resultLabel(R))}</p>
            <h2>${esc(t('textos.resultadoTitulo'))}</h2>
            <div class="score3"><span class="sbig">${esc(t('textos.resultadoCorrectas', { c: R.correctas, n }))}</span><span class="gchip">${esc(t('textos.resultadoPuntos', { p: R.puntos }))}</span></div>
            <p class="ssub">${esc(t('textos.resultadoCorrectasSub'))}</p>
            ${state.mensaje ? `<p class="smsg">${esc(state.mensaje)}</p>` : ''}
            <span class="grow"></span>
            <div class="gacts"><button class="b b-sec" id="mis">${esc(t('textos.misRespuestas'))}</button><button class="b b-pri" id="again">${esc(t('textos.otraPrueba'))}</button></div>
          </div>
        </div>
        <img class="rchivo" src="img/chivo-${state.festejo ? 'festejo' : 'saludo'}.svg" alt="" aria-hidden="true">
      </div></section>`;
    document.getElementById('again').onclick = () => go('intro', { pick: pickOf(R) });
    document.getElementById('mis').onclick = () => go('respuestas');
  }

  // «Mis respuestas» (8 Nov 2026): its own screen, on the calm tint. Ten rows, all closed: number, ✓/✗, the stem on
  // one line. Location line: only the parts that change within that type of Prueba (no Subtema). An open row: the full
  // stem, «Respuesta correcta» with the correct option (every row), «Explicación». One row open at a time.
  function locLine(R, q) {
    const x = tema(q.materia, q.tema), tn = esc(x ? x.name : q.tema);
    if (R.tipo === 'grado') return `${micon(q.materia)}<span>${esc(materia(q.materia).name)} › ${tn}</span>`;
    if (R.tipo === 'materia') return `<span>${esc(t('textos.temaN', { n: temaNum(q.tema) }))} · ${tn}</span>`;
    return '';
  }
  function viewRespuestas() {
    const R = state.resultado;
    if (!R) return go('home');
    head({ back: ['back', 'textos.volver', () => go('resultado')], title: t('textos.misRespuestas'), pill: true });
    const rows = R.respuestas.map((r, k) => {
      const q = Q(r.id); if (!q) return '';
      const mk = r.correcta ? '<span class="mk ok" aria-hidden="true">✓</span>' : '<span class="mk no2" aria-hidden="true">✗</span>';
      const loc = locLine(R, q);
      return `<li style="--mt:var(--${q.materia.toLowerCase()}-t)">
        <button class="rrow" data-row="${k}" aria-expanded="false" aria-controls="ar-${k}"><span class="no">${k + 1}</span>${mk}<span class="rst"><span class="sr">${esc(t(r.correcta ? 'textos.correcto' : 'textos.incorrecto'))} </span>${fmt(q.stem)}</span><span class="chev" aria-hidden="true">›</span>${loc ? `<span class="rloc">${loc}</span>` : ''}</button>
        <div class="ropen" id="ar-${k}" hidden>
          <p class="qlbl">${esc(t('textos.respuestaCorrecta'))}</p>
          <div class="rans"><span class="mk ok" aria-hidden="true">✓</span> ${fmt(q.options[q.correct])}</div>
          <p class="qlbl">${esc(t('textos.explicacion'))}</p>
          <p class="qexp">${fmt(q.feedback)}</p>
        </div></li>`;
    }).join('');
    app.innerHTML = `<section class="apage"><ol class="rlist">${rows}</ol></section>`;
    // Only one row open at a time; no row opens by itself; no re-render, so the scroll stays put
    app.querySelectorAll('.rrow').forEach(b => b.onclick = () => {
      const open = b.getAttribute('aria-expanded') === 'true';
      app.querySelectorAll('.rrow').forEach(o => { o.setAttribute('aria-expanded', 'false'); document.getElementById(o.getAttribute('aria-controls')).hidden = true; });
      if (!open) { b.setAttribute('aria-expanded', 'true'); document.getElementById(b.getAttribute('aria-controls')).hidden = false; }
    });
  }

  // Mi progreso (30 Oct 2026): "Mapa de conocimientos". Each Tema fills like a glass in its Materia colour:
  // level n of 5 fills n × 20% (thresholds in the settings). Not started: dashed outline. Coming Temas: grey.
  const mapTabs = cur => `<div class="tabs" role="tablist">
      <button class="tab" role="tab" data-mat="ALL" style="--mc:var(--ink)" aria-selected="${cur === 'ALL'}">${esc(t('textos.mapaTodoTab'))}</button>
      ${BANK.materias.map(x => `<button class="tab" role="tab" data-mat="${x.id}" style="--mc:${MCOLOR[x.id]}" aria-selected="${x.id === cur}">${micon(x.id)}${esc(x.name)}</button>`).join('')}</div>`;
  const started = x => !!(x && x.a);
  const glass = x => started(x) ? `glass" style="--p:${level(x) * (100 / CFG.niveles.length)}%` : 'ns2';
  const mapCoach = () => '';   // v0.3: no mascot on the maps
  const mapHead = (cur, title) => `<div class="navrow">${backBtn('back', 'textos.inicio')}</div>${mapCoach()}<div class="mapnav">${mapTabs(cur)}<h1>${esc(title)}</h1></div>`;
  const offCaption = () => `<p class="cap2"><i></i>${esc(t('textos.mapaInactivos'))}</p>`;

  function viewMapaTodo(S) {
    const areas = BANK.materias.map(m => {
      const sq = temaSlots(m).map(({ n, tema: x }) => x
        ? `<span class="sq ${glass(S[m.id + '|' + x.id])}"><span><em>${n}</em>${esc(x.name)}</span></span>`
        : `<span class="sq soon2"><em>${n}</em></span>`).join('');
      const sm = S[m.id], share = sm && sm.n ? Math.round(sm.c / sm.n * 100) : 0;
      return `<button class="area2" data-go="${m.id}" style="--mc:${MCOLOR[m.id]}" aria-label="${esc(m.name)}">
          <span class="ahd">${micon(m.id)}<b>${esc(m.name)}</b><span class="abar" aria-hidden="true"><i style="width:${share}%"></i></span></span>
          <span class="tsq">${sq}</span></button>`;
    }).join('');
    app.innerHTML = `
      <section class="screen">
        ${mapHead('ALL', t('textos.mapaTodoTitulo'))}
        <div class="quad2">${areas}</div>
        ${offCaption()}
      </section>`;
    app.querySelectorAll('[data-mat]').forEach(b => b.onclick = () => { state.mapMateria = b.dataset.mat; render(); });
    app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { state.mapMateria = b.dataset.go; render(); window.scrollTo(0, 0); });
    document.getElementById('back').onclick = () => go('home');
  }

  // One Materia: a card per Tema with its three Subtemas, each row filling from the left. No points on the map (4 Nov 2026):
  // points belong to practice and the leaderboard; the fill alone shows mastery.
  function viewProgreso() {
    const S = perf();
    if (!state.mapMateria) state.mapMateria = 'ALL';
    if (state.mapMateria === 'ALL') return viewMapaTodo(S);
    const m = materia(state.mapMateria);
    const cards = temaSlots(m).map(({ n, tema: x }) => {
      if (!x) return `<article class="tc2 soonc"><div class="hd"><em>${n}</em><b>${esc(t('textos.temaN', { n }))}</b></div></article>`;
      const subs = x.subtemas.map(s => { const ss = S[m.id + '|' + s.id];
        return `<div class="srow ${glass(ss)}"><b>${esc(s.name)}</b></div>`; }).join('');
      return `<article class="tc2"><div class="hd"><em>${n}</em><b>${esc(x.name)}</b></div>${subs}</article>`;
    }).join('');
    app.innerHTML = `
      <section class="screen" style="--mc:${MCOLOR[m.id]}">
        ${mapHead(m.id, t('textos.mapaTitulo', { materia: m.name }))}
        <div class="tcg">${cards}</div>
        ${offCaption()}
      </section>`;
    app.querySelectorAll('[data-mat]').forEach(b => b.onclick = () => { state.mapMateria = b.dataset.mat; render(); });
    document.getElementById('back').onclick = () => go('home');
  }

  /* ---------- Tabla de posiciones (v0.2 step 5, defined 4 Nov 2026) ----------
     Score = points (every correct answer, repeats included). Only students who opted in appear; the database
     function tabla_posiciones returns only rank, nickname and points. Views: this week (default), this month,
     always; whole grade or one Materia. Weeks Monday to Sunday in Venezuela time (settings). No Profe Ariel here. */
  let tablaCache = {};
  const TPER = [['semana', 'textos.tablaSemana'], ['mes', 'textos.tablaMes'], ['siempre', 'textos.tablaSiempre']];
  async function loadTabla(key, per, mat) {
    tablaCache[key] = { loading: true };
    try {
      const c = client(); if (!c) throw noNet();
      const { data, error } = await c.rpc('tabla_posiciones', { p_periodo: per, p_materia: mat, p_top_n: CFG.tablaTop,
        p_inicio_semana: CFG.inicioSemana, p_zona: CFG.zonaHoraria, p_pts_correcta: CFG.puntosPorCorrecta });
      if (error) throw error;
      tablaCache[key] = { rows: data || [] };
    } catch (e) { tablaCache[key] = { error: true }; }
    if (state.view === 'tabla') render();
  }
  // Weeks in the settings' time zone: the date (YYYY-MM-DD) of the first day of the week a moment falls in
  const weekKey = d => {
    const [y, m, dd] = new Intl.DateTimeFormat('en-CA', { timeZone: CFG.zonaHoraria, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d).split('-').map(Number);
    const u = new Date(Date.UTC(y, m - 1, dd)), dow = u.getUTCDay();
    u.setUTCDate(u.getUTCDate() - (CFG.inicioSemana === 'domingo' ? dow : (dow + 6) % 7));
    return u.toISOString().slice(0, 10);
  };
  const addDays = (k, n) => { const u = new Date(k + 'T00:00:00Z'); u.setUTCDate(u.getUTCDate() + n); return u.toISOString().slice(0, 10); };
  // «Tu progreso»: the student's own points and Pruebas per week, from the Pruebas already loaded after login
  function semanas() {
    const cur = weekKey(new Date()), by = {};
    for (const p of userData().pruebas) { const k = weekKey(new Date(p.fin)); (by[k] = by[k] || { p: 0, n: 0 }); by[k].p += p.puntos; by[k].n++; }
    return Array.from({ length: CFG.progresoSemanas }, (_, i) => { const k = addDays(cur, -7 * (CFG.progresoSemanas - 1 - i)); return { k, cur: k === cur, ...(by[k] || { p: 0, n: 0 }) }; });
  }
  // Week label: the date the week starts, day above month (fits eight bars on a phone)
  const dayMonth = k => { const d = new Date(k + 'T00:00:00Z'), f = o => new Intl.DateTimeFormat('es-VE', { ...o, timeZone: 'UTC' }).format(d).replace('.', '');
    return `<b>${f({ day: 'numeric' })}</b>${esc(f({ month: 'short' }))}`; };

  function viewTabla() {
    const per = state.tPer || 'semana', mat = state.tMat || null, key = per + '|' + (mat || 'ALL');
    const T0 = tablaCache[key];
    if (!T0) loadTabla(key, per, mat);
    const rows = T0 && T0.rows;
    let list;
    if (!T0 || T0.loading) list = `<ol class="board" aria-busy="true">${'<li class="ph"><span class="rk"></span><span class="nk">&nbsp;</span><span class="pp"></span></li>'.repeat(3)}</ol>`;
    else if (T0.error) list = `<p class="error">${esc(t('textos.errorConexion'))}</p>`;
    else {
      const ranked = rows.filter(r => r.rango !== null && !(r.soy_yo && rows.indexOf(r) >= CFG.tablaTop));
      const own = rows.filter(r => r.soy_yo && (r.rango === null || rows.indexOf(r) >= CFG.tablaTop));
      const li = r => `<li class="${r.soy_yo ? 'me2' : ''}"><span class="rk">${r.rango === null ? '–' : r.rango}</span><span class="nk">${esc(r.soy_yo ? t('textos.tablaTu', { apodo: r.apodo }) : r.apodo)}</span><span class="pp">${esc(t('textos.puntosTotales', { n: r.puntos }))}</span></li>`;
      list = (ranked.length ? '' : `<p class="tnote">${esc(t('textos.tablaVacia'))}</p>`)
        + (rows.length ? `<ol class="board">${ranked.map(li).join('')}${own.length && ranked.length ? '<li class="gap" aria-hidden="true">⋮</li>' : ''}${own.map(li).join('')}</ol>` : '');
    }
    const W = semanas(), maxP = Math.max(1, ...W.map(w => w.p)), last = W[W.length - 1], prev = W[W.length - 2];
    const bars = W.map(w => `<div class="wk ${w.cur ? 'cur' : ''}"><span class="bv">${w.p}</span><i style="height:${Math.round(w.p / maxP * 100)}%"></i>`
      + `<span class="wl">${w.cur ? `<b>${esc(t('textos.progresoSemanaActual'))}</b>&nbsp;` : dayMonth(w.k)}</span><span class="wp">${w.n}</span></div>`).join('');
    app.innerHTML = `
      <section class="screen">
        <div class="navrow">${backBtn('back', 'textos.volver')}</div>
        <h1>${esc(t('textos.tablaTitulo'))}</h1>
        <div class="tgrid">
          <div class="pcard">
            ${tablaSwitch(null)}
            <div class="tabs ttabs" role="tablist">${TPER.map(([k, l]) => `<button class="tab" role="tab" data-per="${k}" aria-selected="${k === per}">${esc(t(l))}</button>`).join('')}</div>
            <div class="tabs" role="tablist">
              <button class="tab" role="tab" data-tm="ALL" style="--mc:var(--ink)" aria-selected="${!mat}">${esc(t('textos.tipoGrado'))}</button>
              ${BANK.materias.map(x => `<button class="tab" role="tab" data-tm="${x.id}" style="--mc:${MCOLOR[x.id]}" aria-selected="${x.id === mat}">${micon(x.id)}${esc(x.name)}</button>`).join('')}</div>
            ${list}
            ${per === 'semana' ? `<p class="tnote">${esc(t('textos.tablaReinicio'))}</p>` : ''}
          </div>
          <div class="pcard prog2">
            <h2>${esc(t('textos.progresoTitulo'))}</h2>
            <div class="nums"><div><b>${last.p}</b><span>${esc(t('textos.progresoEstaSemana'))}</span></div><div><b>${prev.p}</b><span>${esc(t('textos.progresoSemanaPasada'))}</span></div></div>
            <div class="bars" role="img" aria-label="${esc(t('textos.progresoNota'))}">${bars}</div>
            <p class="tnote">${esc(t('textos.progresoNota'))}</p>
          </div>
        </div>
      </section>`;
    document.getElementById('back').onclick = () => go('home');
    app.querySelectorAll('[data-per]').forEach(b => b.onclick = () => { state.tPer = b.dataset.per; render(); });
    app.querySelectorAll('[data-tm]').forEach(b => b.onclick = () => { state.tMat = b.dataset.tm === 'ALL' ? null : b.dataset.tm; render(); });
    bindSwitch();
  }

  const VIEWS = { tabla: viewTabla, login: viewLogin, apodo: viewApodo, config: viewConfig, ayuda: viewAyuda, home: viewHome, materia: viewMateria, intro: viewIntro, pregunta: viewPregunta, resultado: viewResultado, respuestas: viewRespuestas, progreso: viewProgreso };
  function render() {
    if (!state.uid) state.view = 'login';                                  // not signed in
    else if (!state.user && state.view !== 'login') state.view = 'apodo';  // signed in, no nickname yet
    if (!VIEWS[state.view]) state.view = 'home';
    if ((state.view === 'resultado' || state.view === 'respuestas') && !state.resultado) state.view = 'home';
    if (state.view === 'pregunta' && !state.prueba) state.view = 'home';
    if (state.view === 'intro' && !state.pick) state.view = 'home';
    // Surfaces (8 Nov 2026): reading screens on the soft Materia tint; inside a Materia the deep Materia tone;
    // every other screen on the deep grade colour. The landscape shows on the deep surfaces only.
    const v = state.view;
    const read = v === 'pregunta' && state.prueba ? Q(state.prueba.items[state.prueba.i].id).materia
      : v === 'respuestas' && state.resultado ? (state.resultado.materia || 'ALL') : null;
    const deep = v === 'materia' ? state.materia : v === 'intro' && state.pick ? state.pick.mid || null
      : v === 'resultado' && state.resultado ? state.resultado.materia || null
      : v === 'progreso' && state.mapMateria && state.mapMateria !== 'ALL' ? state.mapMateria : null;
    document.body.classList.toggle('s-login', v === 'login');   // full-bleed split screen
    document.body.classList.toggle('s-read', !!read);
    document.body.classList.toggle('tinted', !!(read || deep));
    const tone = read && read !== 'ALL' ? read : deep;
    document.body.setAttribute('style', (tone ? '--mc:' + MCOLOR[tone] + ';' : '') + (deep ? MDEEP(deep) : ''));
    HEAD = null;
    VIEWS[v]();
    prevView = v;
    renderRail();
    renderTop();
  }

  /* ---------- after answering, the next tap anywhere moves on ----------
     Nothing advances by itself: the student must tap or click.
     Buttons and links keep their own action (thumbs, Salir, Continuar).
     The tap that answered the question never counts as the next tap. */
  function advance() {
    const P = state.prueba; if (!P) return;
    if (P.i === P.items.length - 1) finish();
    else { P.i++; P.qStart = Date.now(); go('pregunta'); }
  }
  document.addEventListener('click', e => {
    if (state.view !== 'pregunta' || !state.prueba || state.prueba.quit) return;
    const it = state.prueba.items[state.prueba.i];
    if (!it.checked || Date.now() - (it.checkedAt || 0) < 350) return;
    if (e.target.closest('button, a, input')) return;
    sfx('clic'); advance();
  });
  // Click sound for every button (tiles, Continuar, tabs, thumbs, Salir…). Answer options play their own sound;
  // the speaker button plays its own tick when sound is turned back on.
  document.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || b.disabled || b.matches('.qo, #snd')) return;
    sfx('clic');
  }, true);

  /* ---------- start ---------- */
  async function start(saved) {
    try {
      const get = f => fetch(f).then(r => { if (!r.ok) throw new Error(f); return r.json(); });
      const [b, tx, aj] = await Promise.all([get('questions.json'), get('textos.json'), get('ajustes.json')]);
      CFG = aj; T = tx;
      // Temas included (settings): keep only those Temas and their questions
      const inc = new Set(aj.temasIncluidos);
      b.materias.forEach(m => { m.temas = m.temas.filter(x => inc.has(x.id)); });
      b.questions = b.questions.filter(q => inc.has(q.tema));
      BANK = b;
    } catch (e) {
      document.getElementById('loading').textContent = 'No se pudieron cargar las preguntas. Revisa tu conexión y vuelve a abrir la página.';
      return;
    }
    // A session saved on this device goes straight in (login is remembered)
    try {
      const c = client();
      const { data } = c ? await c.auth.getSession() : { data: null };
      if (data && data.session && data.session.user) { await enterAs(data.session.user); return; }
    } catch (e) { /* no connection or no saved session: show the login */ }
    render();
  }
  start();
})();
</script>
</body>
