<style>
/* Base styles from v0.1 and v0.2 that v0.3 still uses: colour tokens, type, icons and a few shared pieces.
   The unused v0.2 rules were removed in v0.3 step 5 (8 Nov 2026). */
:root {
  --paper: #f6f8fb;
  --card: #ffffff;
  --ink: #16213a;
  --muted: #56617a;
  --line: #d9dfea;
  --sun: #ffc93c;          /* araguaney yellow: primary actions */
  --sun-ink: #2a2100;
  --ok: #1f9d55;
  --bad: #d23f3f;
  --cie: #22a6e0; --cie-t: #0a6e9c; --cie-s: #e3f4fc;
  --len: #ec5a9e; --len-t: #b3266d; --len-s: #fde6f1;
  --mat: #3236b0; --mat-t: #3236b0; --mat-s: #e7e8f8;
  --soc: #f2892a; --soc-t: #a64b00; --soc-s: #feeedd;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background-color: var(--g-bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--mat); outline-offset: 3px; }
.pts { font-variant-numeric: tabular-nums; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; color: var(--ink); font-weight: 700; white-space: nowrap; }
h1, h2, h3 { font-family: var(--display); letter-spacing: -0.015em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.8rem, 4.5vw, 2.4rem); font-weight: 800; line-height: 1.1; }
h2 { font-size: 1.35rem; font-weight: 800; }
h3 { font-size: 1.1rem; font-weight: 600; }
.sub { color: var(--muted); margin: 6px 0 0; }
.error { color: var(--bad); font-size: .95rem; min-height: 1.4em; margin: 0; }
.note { font-size: .9rem; color: var(--muted); margin: 0; }
.badge { display: inline-flex; align-self: flex-start; font-size: .85rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mt, var(--mc, var(--ink))); }
.actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
.nw { white-space: nowrap; }
[data-ns] { background: transparent !important; color: var(--muted) !important; border: 2px dashed var(--line) !important; }
@media (max-width: 520px) {
  body { font-size: 17px; }
}
.ic { width: var(--s, 22px); height: var(--s, 22px); flex: none; display: inline-block; vertical-align: middle; }
.mbadge { width: var(--b, 44px); height: var(--b, 44px); border-radius: calc(var(--b, 44px) * .3); background: var(--mc); color: #fff; display: inline-grid; place-items: center; flex: none; }
.mbadge .ic { --s: calc(var(--b, 44px) * .6); }
.badge { align-items: center; gap: 8px; }
.badge .mbadge { --b: 36px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
body.tinted { background-color: var(--sft); }
.logo { display: block; height: 44px; width: auto; max-width: 100%; }
@media (max-width: 599px) {
  .logo { height: 34px; }
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.snd { position: relative; flex: none; width: 36px; height: 36px; padding: 0; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--muted); display: grid; place-items: center; }
.snd::before { content: ""; position: absolute; inset: -10px; }
.snd:hover { color: var(--ink); border-color: var(--muted); }
.snd svg { width: 20px; height: 20px; }
.snd.off { color: var(--muted); opacity: .75; }
@media (max-width: 599px) { .snd { width: 32px; height: 32px; } .snd::before { inset: -12px; } }
.flabel { font-weight: 700; margin-bottom: -6px; }
.field { width: 100%; min-height: 56px; border: 2px solid var(--line); border-radius: 14px; padding: 0 16px; background: var(--paper); font-size: 1.15rem; }
.field:focus { border-color: var(--mat); outline: none; }
.check { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; min-height: 56px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 14px; background: var(--paper); cursor: pointer; line-height: 1.35; }
.check input { width: 26px; height: 26px; margin: 0; accent-color: var(--mat); }
.okmsg { color: var(--ok); font-weight: 700; }
.me, .pts { position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-weight: 700; padding: 0 12px; min-width: 0; }
.me::before, .pts::before { content: ""; position: absolute; inset: -8px -4px; }
.me .ic { --s: 20px; color: var(--muted); }
.me:hover, .pts:hover { border-color: var(--muted); }
.pts .ic { --s: 20px; color: var(--ink); }
.pts .n { font-variant-numeric: tabular-nums; }
.pts.pop { animation: ptspop .45s ease-out; background: var(--sun); border-color: var(--sun); color: var(--sun-ink); }
.pts.pop .ic { color: var(--sun-ink); }
.pts.fade { transition: background-color .5s, border-color .5s, color .5s; }
@keyframes ptspop { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
@media (max-width: 599px) {  .me { padding: 0; width: 40px; justify-content: center; } .pts { padding: 0 10px; } }
.mk.ok { color: var(--ok); } .mk.no2 { color: var(--bad); }
#swerr:empty { display: none; }
/* ===================== v0.3 foundations (8 Nov 2026) =====================
   «Colour outside, calm inside»: navigation screens on the deep grade colour (inside a Materia, the deep Materia tone),
   reading screens on the soft Materia tint. No notebook grid, no watermark, no dark mode. */
:root {
  /* Grade identity: 5to = Médanos de Coro (dunes). Only 5to is built; 4to and 6to pills are in logo v2. */
  --g-bg: #1B2A55; --g-rail: #121D3D; --g-land1: #22336A; --g-land2: #2A3D78; --g-pill: #2E4A9A;
  /* Deep Materia tones for Materia screens (Ciencias from the mockup; the other three with the same darkening and contrast checks) */
  --cie-d: #0A4E70; --cie-r: #083B55; --cie-l1: #0C5A80; --cie-l2: #106690;
  --len-d: #811B4E; --len-r: #61153B; --len-l1: #931F5A; --len-l2: #A62365;
  --mat-d: #23267A; --mat-r: #1A1C5B; --mat-l1: #292C8F; --mat-l2: #2E32A3;
  --soc-d: #763600; --soc-r: #5A2900; --soc-l1: #883D00; --soc-l2: #9A4500;
  --mat-tile: #5559D6;     /* Matemáticas tile on the navy main page: lighter so it stands out like the other three */
  --on-dark: #FFFFFF; --on-dark-2: #DCE3F5; --rail-ink: #AEB9DA; --glass: rgba(255,255,255,.12);
  --sec-line: #C9CFDB; --muted2: #5B6478;
  /* Surface in use (set by render()) */
  --bg: var(--g-bg); --rail-bg: var(--g-rail); --l1: var(--g-land1); --l2: var(--g-land2);
}
body { background: var(--bg); padding: 0; }
body.tinted { background: var(--bg); }   /* replaces the v0.2 tinted page */
body.s-read, body.tinted.s-read { background: var(--sft, #F3F5F9); }
.land { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
.land .l1 { fill: var(--l1); } .land .l2 { fill: var(--l2); }
body.s-read .land { display: none; }
.wmp { display: none !important; }   /* no watermark (8 Nov 2026) */

/* Shell: rail on the left (bottom bar on phones), then the stage: information area on top, interaction area below */
.shell { position: relative; z-index: 1; min-height: 100vh; }
.rail { position: fixed; left: 0; top: 0; bottom: 0; width: 88px; z-index: 5; background: var(--rail-bg);
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: calc(16px + env(safe-area-inset-top, 0px)) 0 14px; }
.rail[hidden] { display: none; }
.rail .badge { width: 48px; height: 48px; margin-bottom: 18px; }
.rail .ri { width: 74px; height: 64px; border: 0; border-radius: 14px; background: transparent; color: var(--rail-ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0;
  font-size: 11px; font-weight: 700; line-height: 1.1; }
.rail .ri .ic { width: 26px; height: 26px; stroke-width: 2; }
.rail .ri.on { background: var(--sun); color: var(--ink); }
.rail .ri.cfg { margin-top: auto; font-size: 10px; }
.stage { padding: calc(18px + env(safe-area-inset-top, 0px)) max(32px, env(safe-area-inset-right, 0px)) 40px 32px; max-width: 1180px; margin: 0 auto; }
body.has-rail .stage { margin-left: 88px; max-width: none; }
@media (min-width: 1268px) { body.has-rail .stage { padding-right: calc(100vw - 88px - 1092px); } }

/* Information area: back link, title and context on the left; sound and points on the right */
.info { display: flex; align-items: center; gap: 12px; min-height: 48px; margin-bottom: 6px; color: var(--on-dark); }
.info[hidden] { display: none; }
.info .ttl { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
.info h1 { font-family: var(--display); font-weight: 800; font-size: 28px; letter-spacing: -0.3px; margin: 0; color: inherit; line-height: 1.15; }
.info .ttl .ic { width: 30px; height: 30px; stroke-width: 2; flex: none; }
.gpill { background: var(--g-pill); color: #fff; border-radius: 999px; padding: 3px 12px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.info .tools { display: flex; align-items: center; gap: 12px; margin-left: auto; }
.info .snd, .info .pts { height: 44px; border: 0; border-radius: 999px; background: var(--glass); color: var(--on-dark); position: relative;
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
.info .snd { width: 44px; padding: 0; }
.info .snd svg { width: 20px; height: 20px; }
.info .pts { gap: 8px; padding: 0 16px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.info .pts .ic { width: 18px; height: 18px; stroke-width: 2; }
.info .snd::before, .info .pts::before { content: ""; position: absolute; inset: -6px; }   /* 56 px touch area */
.info .pts.pop { background: var(--sun); color: var(--ink); transform: scale(1.08); }
.info .pts.fade { transition: background .3s, color .3s, transform .3s; }
body.s-read .info { color: var(--ink); }
body.s-read .info .snd, body.s-read .info .pts { background: rgba(22,33,58,.07); color: var(--ink); }

/* Buttons (8 Nov 2026): primary yellow, secondary white with an outline, compact back link, one segmented control */
.b { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 56px; min-width: 200px; padding: 0 28px;
  border-radius: 999px; border: 0; font-weight: 700; font-size: 18px; text-decoration: none; }
.b-pri { background: var(--sun); color: var(--ink); }
.b-pri:active { transform: translateY(1px); }
.b-pri:disabled { background: #E3E7EF; color: var(--muted2); cursor: default; }
.b-sec { background: #fff; color: var(--ink); border: 1.5px solid var(--sec-line); }
.b-sec.on-dark { background: transparent; color: var(--on-dark); border-color: rgba(255,255,255,.4); height: 48px; min-width: 0; padding: 0 20px; font-size: 15px; position: relative; }
.b-sec.on-dark::before { content: ""; position: absolute; inset: -5px 0; }   /* step 5: 56 px touch area, same look */
.actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.b-back { position: relative; display: inline-flex; align-items: center; gap: 4px; height: 44px; padding: 0 12px 0 4px; border: 0; background: none;
  color: inherit; font-weight: 700; font-size: 16px; white-space: nowrap; }
.b-back::before { content: ""; position: absolute; inset: -6px 0; }   /* small to look at, 56 px to tap */
.b-back .ar { font-size: 1.35em; line-height: 1; margin-top: -2px; }
.seg { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--glass); }
.seg button { height: 48px; padding: 0 18px; border: 0; border-radius: 999px; background: transparent; color: var(--on-dark); font-weight: 700; font-size: 15px; position: relative; }
.seg button::before { content: ""; position: absolute; inset: -4px 0; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); }
body.s-read .seg { background: rgba(22,33,58,.07); } body.s-read .seg button { color: var(--ink); }
.ic.todo { stroke: none; }

/* Phones: the rail becomes a bottom bar (hidden during a Prueba, like the rail) */
@media (max-width: 599px) {
  .rail { top: auto; right: 0; width: auto; height: calc(64px + env(safe-area-inset-bottom, 0px)); flex-direction: row; justify-content: space-around;
    padding: 0 4px env(safe-area-inset-bottom, 0px); gap: 0; }
  .rail .badge { display: none; }
  .rail .ri { width: auto; flex: 1; height: 56px; margin: 4px 2px; }
  .rail .ri.cfg { margin-top: 4px; }
  .stage, body.has-rail .stage { margin-left: 0; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 24px; }
  body.has-rail .stage { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .info h1 { font-size: 22px; }
  .info .pts .lbl { display: none; }
  .b { width: 100%; min-width: 0; }
  .actions { flex-direction: column-reverse; }
}
@media (min-width: 600px) and (max-width: 959px) { .stage, body.has-rail .stage { padding-left: 24px; padding-right: 24px; } }

/* ===================== v0.3 step 2 (8 Nov 2026): login, nickname, Pruebas, Ayuda, Configuración ===================== */
.flabel { font-size: 15px; font-weight: 700; color: var(--ink); }
.field { height: 56px; min-height: 0; border: 1.5px solid var(--sec-line); border-radius: 12px; padding: 0 14px; font-size: 17px; font-family: inherit; color: var(--ink); background: #fff; width: 100%; box-sizing: border-box; }
.field:focus { outline: 3px solid rgba(46,74,154,.35); outline-offset: 1px; border-color: var(--g-pill); }
.b.wide { width: 100%; min-width: 0; }
.b-link { position: relative; align-self: center; height: 44px; border: 0; background: none; color: var(--ink); font-weight: 700; font-size: 16px; text-decoration: underline; text-underline-offset: 3px; padding: 0 12px; }
.b-link::before { content: ""; position: absolute; inset: -6px 0; }
.note { margin: 0; font-size: 14px; line-height: 1.45; color: var(--muted2); }
.error { margin: 0; font-size: 15px; font-weight: 700; color: #B42323; }
.error:empty, .okmsg:empty { display: none; }
.okmsg { margin: 0; font-size: 15px; font-weight: 700; color: #17713D; }
.check { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; line-height: 1.45; color: var(--ink); }
.check input { width: 24px; height: 24px; margin: 0; flex: none; accent-color: var(--g-pill); }
/* The switch (one style): 56 × 32, green when on; touch area 56 px */
.tg { position: relative; width: 56px; height: 32px; border-radius: 16px; border: 0; padding: 0; flex: none; background: #B8C0D0; transition: background .15s; }
.tg::before { content: ""; position: absolute; inset: -12px -4px; }
.tg span { position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; }
.tg[aria-checked="true"] { background: #1F9D55; }
.tg[aria-checked="true"] span { left: 28px; }
.tg:disabled { opacity: .6; }
@media (prefers-reduced-motion: reduce) { .tg, .tg span { transition: none; } }

/* Login: brand panel on the left, form card on the right; no rail, no information area */
body.s-login { background: #F3F4F6; }
body.s-login .land { display: none; }
body.s-login .stage { padding: 0; max-width: none; margin: 0; }
.lgn { display: grid; grid-template-columns: minmax(0, 1fr) 520px; min-height: 100vh; }
.lbrand { position: relative; overflow: hidden; background: var(--g-bg); padding: calc(56px + env(safe-area-inset-top, 0px)) 48px 56px; display: flex; flex-direction: column; gap: 18px; color: #fff; }
.lbrand .bland { position: absolute; inset: 0; width: 100%; height: 100%; }
.lbrand .bland .l1 { fill: var(--g-land1); } .lbrand .bland .l2 { fill: var(--g-land2); }
.lbrand .logo { position: relative; height: 84px; align-self: flex-start; }
.lbrand .lema { position: relative; margin: 24px 0 0; font-family: var(--display); font-weight: 800; font-size: 48px; line-height: 1.05; }
.lbrand .apoyo { position: relative; margin: 0; max-width: 400px; font-size: 19px; line-height: 1.5; color: var(--on-dark-2); }
.lbrand .chivo { position: absolute; right: 40px; bottom: 24px; height: min(400px, 48vh); }
.lside { display: flex; align-items: center; justify-content: center; padding: 40px; }
.lcard { width: 420px; max-width: 100%; background: #fff; border-radius: 24px; padding: 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 2px 10px rgba(22,33,58,.06); }
.lcard h1 { margin: 0 0 6px; font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1.1; color: var(--ink); }
.lcard .b-pri { margin-top: 8px; }
.lcard .divider { height: 1px; background: #E3E6EE; margin: 8px 0; }
.lcard .pv { margin: 0; font-size: 15px; color: var(--muted2); text-align: center; }
@media (min-width: 600px) and (max-width: 959px) {
  .lgn { grid-template-columns: minmax(0, 1fr) 440px; }
  .lbrand { padding: 48px 32px; }
  .lbrand .logo { height: 64px; }
  .lbrand .lema { font-size: 38px; }
  .lbrand .apoyo { font-size: 17px; }
  .lbrand .chivo { right: 24px; height: min(320px, 36vh); }
  .lside { padding: 24px; }
}
@media (max-width: 599px) {
  .lgn { grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .lcard { width: 100%; }
  .lbrand { padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 22px; gap: 8px; }
  .lbrand .logo { height: 48px; }
  .lbrand .lema { margin: 6px 0 0; font-size: 28px; }
  .lbrand .apoyo, .lbrand .chivo { display: none; }
  .lside { padding: 16px 16px 32px; }
  .lcard { padding: 24px 20px; }
  .lcard h1 { font-size: 26px; }
}

/* Nickname: one card on the grade background, the chivo beside it */
.apodo { min-height: calc(100vh - 58px); display: flex; align-items: center; justify-content: center; gap: 40px; }
.ncard { width: 480px; max-width: 100%; background: #fff; border-radius: 24px; padding: 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; }
.ncard .lchip { align-self: flex-start; background: var(--g-bg); border-radius: 12px; padding: 8px 12px; line-height: 0; }
.ncard .lchip .logo { height: 44px; }
.ncard h1 { margin: 8px 0 0; font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1.15; color: var(--ink); }
.swbox { display: flex; align-items: center; gap: 14px; background: #F4F6FA; border-radius: 14px; padding: 14px 16px; margin-top: 6px; }
.swbox .txt, .crow .txt { flex: 1; min-width: 0; }
.swbox b, .crow b { display: block; font-size: 16px; color: var(--ink); }
.swbox small, .crow small { display: block; margin-top: 4px; font-size: 14px; line-height: 1.4; color: var(--muted2); }
.ncard .actions { margin-top: 8px; }
.apodo .chivo { height: 420px; }
@media (min-width: 600px) and (max-width: 959px) { .apodo .chivo { height: 300px; } .apodo { gap: 20px; } }
@media (max-width: 599px) {
  .apodo { min-height: 0; display: block; }
  .ncard { padding: 24px 20px; }
  .ncard h1 { font-size: 26px; }
  .apodo .chivo { display: none; }
}

/* Information area on phones: the grade pill is left out (the grade is in Configuración), so the title, sound and points fit */
@media (max-width: 599px) { .info .gpill { display: none; } }
.info .pts .ic { color: inherit; stroke: currentColor; }

/* Pages after login: the content sits under the information area */
.page { color: var(--on-dark); }
.page .lead { margin: 0; font-size: 19px; line-height: 1.45; color: var(--on-dark-2); }
.pcard2 { width: 620px; max-width: 100%; background: #fff; color: var(--ink); border-radius: 22px; padding: 26px 32px; box-sizing: border-box; }
.pcard2 h2 { margin: 0 0 10px; font-family: var(--display); font-weight: 800; font-size: 26px; }

/* Main page «Pruebas»: four Materia tiles, then «Todo 5to» across the full width; the chivo in the corner */
.hpage .hgrid { display: flex; flex-direction: column; align-items: flex-start; gap: 16px; margin-top: 28px; margin-right: 246px; position: relative; z-index: 1; }
.htiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; width: 100%; }
.mtile { height: 200px; border: 0; border-radius: 22px; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 8px;
  font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.1; }
.mtile .ic { width: 60px; height: 60px; stroke-width: 1.8; }
.mtile.m-CIE { background: var(--cie-t); } .mtile.m-LEN { background: var(--len-t); }
.mtile.m-MAT { background: var(--mat-tile); } .mtile.m-SOC { background: var(--soc-t); }
.gtile { grid-column: 1 / -1; height: 150px; border: 0; border-radius: 22px; background: var(--sun); color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 18px;
  font-family: var(--display); font-weight: 800; font-size: 28px; }
.gtile .ic { width: 56px; height: 56px; }
.mtile:active, .gtile:active { transform: translateY(1px); }
.hpage .deco { position: fixed; right: 28px; bottom: 26px; height: min(330px, 40vh); z-index: 0; pointer-events: none; }
@media (min-width: 600px) and (max-width: 959px) {
  .hpage .hgrid { margin-right: 0; }
  .mtile { height: 170px; font-size: 20px; }
  .hpage .deco { height: min(300px, 26vh); }
}
@media (max-width: 599px) {
  .page .lead { font-size: 17px; }
  .hpage .hgrid { margin: 20px 0 0; gap: 12px; }
  .htiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .mtile { height: 132px; font-size: 19px; gap: 10px; }
  .mtile .ic { width: 48px; height: 48px; }
  .gtile { height: 100px; font-size: 24px; }
  .gtile .ic { width: 44px; height: 44px; }
  .hpage .b-sec.on-dark { width: auto; }
  .hpage .deco { display: none; }
}

/* Ayuda: one card with five lines, the chivo «Pensando» beside it */
.ayuda { display: flex; align-items: flex-end; gap: 24px; margin-top: 18px; }
.ayuda .pcard2 { padding-bottom: 14px; }
.alist { list-style: none; margin: 0; padding: 0; }
.alist li { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid #E3E6EE; font-size: 18px; line-height: 1.45; }
.alist .aic { width: 44px; height: 44px; border-radius: 12px; background: #E9EEF8; color: var(--g-pill); display: flex; align-items: center; justify-content: center; flex: none; }
.alist .aic .ic { width: 24px; height: 24px; stroke-width: 2; }
.ayuda .chivo { height: 360px; flex: none; }
@media (min-width: 600px) and (max-width: 959px) { .ayuda .pcard2 { flex: 1; } .ayuda .chivo { height: 240px; } }
@media (max-width: 599px) { .ayuda { margin-top: 8px; } .ayuda .pcard2 { padding: 20px 18px 8px; } .alist li { font-size: 17px; } .ayuda .chivo { display: none; } }

/* Configuración: one card with sections */
.page > .cfgcard { margin-top: 18px; display: flex; flex-direction: column; gap: 16px; padding: 28px 32px; }
.cfgcard form { display: flex; flex-direction: column; gap: 10px; }
.cfgcard .sec { margin: 0; font-size: 13px; font-weight: 700; color: var(--muted2); letter-spacing: .5px; text-transform: uppercase; }
.cfgcard .frow { display: flex; gap: 10px; align-items: center; }
.cfgcard .frow .field { flex: 1; min-width: 0; }
.cfgcard .b-sec { min-width: 140px; }
.cfgcard .line { height: 1px; background: #E3E6EE; }
.crow { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.crow > b { flex: 1; font-size: 17px; }
.crow .txt b { font-size: 17px; }
.crow .email { flex: 1; min-width: 0; font-size: 17px; overflow-wrap: anywhere; }
@media (max-width: 599px) {
  .page > .cfgcard { padding: 20px 18px; margin-top: 8px; }
  .cfgcard .frow, .crow:last-child { flex-wrap: wrap; }
  .cfgcard .frow .b-sec, .crow:last-child .b-sec { width: 100%; }
}

/* ===================== v0.3 step 3 (8 Nov 2026): Materia, Prueba intro, question, result card, «Mis respuestas» ===================== */
/* Information area: extra pieces (question dots and the Prueba-type chip) */
.info .tt { display: flex; align-items: center; gap: 12px; min-width: 0; }
.info .tt > .tic2 { display: flex; color: inherit; }
/* Phones: with a back link, the icon and title take their own line under it (step 3) */
@media (max-width: 599px) { .info { flex-wrap: wrap; row-gap: 6px; } .info .ttl { display: contents; } .info .tt { flex: 1 1 0; } .info .tools { order: 2; } .info .b-back + .tt { order: 3; flex-basis: 100%; } }
body.s-read .info .snd, body.s-read .info .pts { background: #fff; }
body.s-read .rail { background: color-mix(in srgb, var(--sft, #F3F5F9) 92%, #16213A); }
body.s-read .rail .ri { color: #47506A; } body.s-read .rail .ri.on { color: var(--ink); }

/* Materia screen: the line and the yellow «Todo [Materia]» tile, then 12 white Tema tiles (4 × 3) */
.mpage .mhead3 { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 12px 0; }
.mpage .mhead3 p { margin: 0; font-size: 18px; color: rgba(255,255,255,.88); }
.mtodo { height: 64px; padding: 0 26px; border: 0; border-radius: 18px; background: var(--sun); color: var(--ink); display: flex; align-items: center; gap: 12px; flex: none;
  font-family: var(--display); font-weight: 800; font-size: 20px; }
.mtodo .ic { width: 30px; height: 30px; stroke-width: 2; }
.ttiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.ttile { height: 182px; border: 0; border-radius: 18px; background: #fff; color: var(--ink); padding: 18px 20px; box-sizing: border-box; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; }
.ttile .tslot { height: 58px; display: flex; align-items: center; color: var(--mt); }
.ttile .tslot .ic { width: 58px; height: 58px; stroke-width: 1.7; }
.ttile .tslot .tnum { font-family: var(--display); font-weight: 800; font-size: 48px; line-height: 1; }
.ttile .tn { flex: 1; font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.15; hyphens: auto; }
.ttile .tno { font-size: 14px; font-weight: 700; color: var(--muted2); }
.ttile.off { background: rgba(255,255,255,.1); justify-content: flex-end; }
.ttile.off .tno { color: rgba(255,255,255,.6); }
button.ttile:active, .mtodo:active { transform: translateY(1px); }
@media (min-width: 600px) and (max-width: 959px) { .ttiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } .ttile { height: 176px; padding: 16px; } .ttile .tn { font-size: 20px; } }
@media (max-width: 599px) {
  .mpage .mhead3 { flex-direction: column; align-items: stretch; margin-top: 4px; }
  .mpage .mhead3 p { font-size: 17px; }
  .mtodo { justify-content: center; }
  .ttiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .ttile { height: 150px; padding: 14px; }
  .ttile .tslot { height: 44px; } .ttile .tslot .ic { width: 44px; height: 44px; } .ttile .tslot .tnum { font-size: 38px; }
  .ttile .tn { font-size: 17px; }
  .ttile .tno { font-size: 13px; }
}

/* The game card (intro, and its back: the result). --bc = band colour, --bi = band ink, --lc = label colour */
.gcard { width: 440px; max-width: 100%; min-height: 560px; background: #fff; color: var(--ink); border-radius: 26px; overflow: hidden; display: flex; flex-direction: column; box-sizing: border-box; flex: none; }
.gband { height: 150px; flex: none; background: var(--bc); color: var(--bi, #fff); display: flex; align-items: center; justify-content: center; }
.gband .ic { width: 72px; height: 72px; stroke-width: 1.6; }
.gband .tnum { font-family: var(--display); font-weight: 800; font-size: 64px; line-height: 1; }
.gband.sm { height: 110px; } .gband.sm .ic { width: 56px; height: 56px; } .gband.sm .tnum { font-size: 52px; }
.gbody { flex: 1; padding: 26px 30px 30px; display: flex; flex-direction: column; gap: 12px; }
.glbl { margin: 0; font-size: 14px; font-weight: 700; color: var(--lc); letter-spacing: .5px; text-transform: uppercase; }
.gbody h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1.05; }
.gchips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.gchip { border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 14px; background: var(--cs); color: var(--lc); }
.gchip.y { background: #FFF3CC; color: #6B4E00; }
.ginst { margin: 6px 0 0; font-size: 18px; line-height: 1.5; color: #39425A; }
.gbody .grow { flex: 1; }
.cpage { display: flex; justify-content: center; margin-top: 18px; }
.gcard.deal { animation: deal .26s ease-out both; }
@keyframes deal { from { transform: translateY(28px) rotate(-2deg); opacity: 0; } to { transform: none; opacity: 1; } }
.gcard.flip { animation: flip .28s ease-out both; }
@keyframes flip { from { transform: perspective(900px) rotateY(-90deg); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .gcard.deal, .gcard.flip { animation: none; } }

/* Result: the back of the card, the chivo beside it */
.rpage .rwrap { display: flex; justify-content: center; align-items: flex-end; gap: 24px; margin-top: 18px; padding-left: 160px; }
.rpage .gbody { gap: 8px; padding-top: 24px; }
.rpage .gbody h2 { font-size: 28px; }
.score3 { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; margin-top: 8px; }
.score3 .sbig { font-family: var(--display); font-weight: 800; font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.score3 .gchip { background: var(--sun); color: var(--ink); font-size: 17px; }
.ssub { margin: 0; font-size: 16px; color: var(--muted2); }
.smsg { margin: 12px 0 0; font-size: 18px; line-height: 1.5; color: #39425A; }
.gacts { display: flex; gap: 10px; }
.gacts .b { flex: 1; min-width: 0; padding: 0 12px; }
.rpage .rchivo { height: 300px; flex: none; }
@media (min-width: 600px) and (max-width: 959px) { .rpage .rwrap { padding-left: 0; } .rpage .rchivo { height: 220px; } }
@media (max-width: 599px) {
  .cpage, .rpage .rwrap { margin-top: 8px; padding-left: 0; }
  .gcard { width: 100%; min-height: 0; }
  .gband { height: 120px; } .gband .ic { width: 60px; height: 60px; } .gband.sm { height: 96px; }
  .gbody { padding: 22px 20px 22px; }
  .gbody h2 { font-size: 30px; }
  .gbody .grow { flex: none; height: 12px; }
  .score3 .sbig { font-size: 54px; }
  .gacts { flex-direction: column-reverse; }
  .gacts .b { flex: none; width: 100%; }
  .rpage .rchivo { display: none; }
}

/* Question: one centred card on the soft Materia tint; feedback grows below the options */
.dots3 { display: flex; gap: 6px; align-items: center; flex: none; background: #fff; border-radius: 999px; padding: 7px 10px; }   /* 9 Nov 2026: a white pill in the band */
.dots3 .dt { width: 12px; height: 12px; border-radius: 50%; box-sizing: border-box; background: #fff; border: 1.5px solid color-mix(in srgb, var(--mt, #5B6478) 30%, #fff); }
.dots3 .dt.cur { border: 3px solid var(--mt); }
.dots3 .dt.ok { background: #1F9D55; border-color: #1F9D55; }
.dots3 .dt.no { background: #D23F3F; border-color: #D23F3F; }
.qpage { margin-top: 14px; }
.qcard3 { width: 780px; max-width: 100%; margin: 0 auto; background: #fff; border-radius: 22px; overflow: hidden; color: var(--ink); }
.qband { background: var(--bc); color: #fff; min-height: 52px; display: flex; flex-wrap: wrap; align-items: center; column-gap: 12px; row-gap: 8px; padding: 0 26px; font-weight: 700; font-size: 15px; }   /* 9 Nov 2026: same side margin as the card body */
.qband .qhd { display: flex; align-items: center; gap: 10px; flex: 1 1 220px; min-width: 0; }
.qband .qhd > .ic { width: 20px; height: 20px; stroke-width: 2; flex: none; }
.qband .qloc { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 9 Nov 2026: «‹ Salir», sound and points aligned with the edges of the question card */
body.v-preg .info { width: 780px; max-width: 100%; margin-left: auto; margin-right: auto; }
/* 9 Nov 2026: thumbs at the bottom left of the card, always visible; «Continuar» at their right after answering */
.qfoot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; min-height: 56px; }
.qfoot .rate3 { display: flex; gap: 10px; flex: none; }
.vote3 { position: relative; width: 48px; height: 48px; border-radius: 12px; border: 1.5px solid var(--sec-line); background: #fff; color: #47506A; display: flex; align-items: center; justify-content: center; padding: 0; }
.vote3::before { content: ""; position: absolute; inset: -4px; }   /* 56 × 56 touch area, same look */
.vote3 svg { width: 22px; height: 22px; }
.vote3[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.qbody3 { padding: 22px 26px 24px; }
.qstem { margin: 0 0 18px; font-size: 22px; font-weight: 700; line-height: 1.4; }
.qopts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.qo { min-height: 64px; border-radius: 14px; padding: 10px 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 18px; line-height: 1.35; text-align: left;
  border: 1.5px solid color-mix(in srgb, var(--mt) 22%, #fff); background: color-mix(in srgb, var(--sft) 45%, #fff); color: var(--ink); }
.qo .mk { font-size: 22px; font-weight: 700; flex: none; }
.qo.right { border-color: #1F9D55; box-shadow: inset 0 0 0 1px #1F9D55; background: #E5F5EC; }   /* same border width: the options never move */
.qo.right .mk { color: #17783F; }
.qo.wrong { border-color: #D23F3F; box-shadow: inset 0 0 0 1px #D23F3F; background: #FDECEC; }
.qo.wrong .mk { color: #A32D2D; }
.qo.dim { border-color: #E3E8EF; background: #fff; color: #6B7488; }
.qo:disabled { cursor: default; }
.qfb { margin-top: 20px; background: #EAF0FB; border: 2px solid #B4C3E4; border-radius: 16px; padding: 14px 20px 16px; }   /* 9 Nov 2026: blue-grey panel, the same for every Materia */
.qfb.in { animation: qfbin .28s ease-out; }
@keyframes qfbin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .qfb.in { animation: none; } }
.qfb .qlbl { color: #2E4A9A; }
.qfb .qexp { margin: 4px 0 0; }
.qlbl { margin: 0; font-size: 13px; font-weight: 700; color: var(--mt); letter-spacing: .5px; text-transform: uppercase; }
.qexp { margin: 4px 0 14px; font-size: 18px; line-height: 1.5; }
/* «Salir» confirmation */
.qconfirm { position: fixed; inset: 0; z-index: 20; background: rgba(22,33,58,.45); display: flex; align-items: center; justify-content: center; padding: 20px; }
.qconfirm .box { width: 460px; max-width: 100%; background: #fff; border-radius: 22px; padding: 26px; box-sizing: border-box; color: var(--ink); }
.qconfirm p { margin: 0 0 18px; font-size: 18px; line-height: 1.5; font-weight: 700; }
.qconfirm .actions .b { min-width: 0; }
@media (min-width: 600px) and (max-width: 959px) { .qstem { font-size: 21px; } }
@media (max-width: 599px) {
  .dots3 { gap: 5px; }
  .qpage { margin-top: 8px; }
  .qband { padding: 10px 16px; }
  .qfoot .b-pri { flex: 1 1 auto; min-width: 0; }
  .qbody3 { padding: 18px 16px 20px; }
  .qstem { font-size: 19px; }
  .qopts { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .qo { min-height: 56px; font-size: 17px; }
  .qexp { font-size: 17px; }
}

/* «Mis respuestas»: one white card of rows on the calm tint; one row open at a time */
.apage .rlist { width: 860px; max-width: 100%; margin: 18px auto 0; background: #fff; border-radius: 22px; overflow: hidden; list-style: none; padding: 0; color: var(--ink); }
.rlist li + li { border-top: 1px solid #E3E8EF; }
.rrow { width: 100%; min-height: 56px; display: grid; grid-template-columns: 22px 20px minmax(0, 1fr) 20px; column-gap: 14px; align-items: center; padding: 10px 18px; border: 0; background: #fff; text-align: left; color: var(--ink); }
.rrow .no { font-weight: 700; color: var(--muted2); font-size: 16px; }
.rrow .mk { font-size: 20px; font-weight: 700; }
.mk.ok { color: #17783F; } .mk.no2 { color: #A32D2D; }
.rrow .rst { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rrow .chev { display: inline-block; font-size: 20px; color: #9AA3B5; transition: transform .15s; }
.rrow[aria-expanded="true"] { align-items: start; }
.rrow[aria-expanded="true"] .rst { white-space: normal; font-size: 18px; font-weight: 700; line-height: 1.4; }
.rrow[aria-expanded="true"] .chev { transform: rotate(90deg); }
.rrow .rloc { grid-column: 3; display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 13px; font-weight: 700; color: var(--mt); }
.rrow .rloc .ic { width: 16px; height: 16px; stroke-width: 2; }
.ropen { padding: 0 18px 18px 88px; display: flex; flex-direction: column; gap: 8px; }
.ropen .qlbl { margin-top: 6px; }
.ropen .rans { border: 2px solid #1F9D55; background: #E5F5EC; border-radius: 12px; padding: 10px 14px; font-size: 18px; }
.ropen .qexp { margin: 0; }
@media (prefers-reduced-motion: reduce) { .rrow .chev { transition: none; } }
@media (max-width: 599px) {
  .apage .rlist { margin-top: 8px; }
  .rrow { grid-template-columns: 20px 18px minmax(0, 1fr) 16px; column-gap: 10px; padding: 10px 14px; }
  .ropen { padding: 0 14px 16px 14px; }
}
/* ===================== v0.3 step 4 (8 Nov 2026): Progreso (maps) and Tabla ===================== */
/* Materia colour scale for the maps (8 Nov 2026): levels 1 to 4 mix the soft tint towards the text tone (6, 20, 34, 48%),
   navy text on all four (weakest 5.6:1, Matemáticas level 4); level 5 «Dominado» = the text tone with white text.
   Not started: card --ns with a dashed --nb outline; row: white with a dashed --rb outline. Same values as the mockup. */
:root {
  --cie-v1: #D6ECF6; --cie-v2: #B8D9E9; --cie-v3: #99C6DB; --cie-v4: #7BB4CE; --cie-ns: #EEF8FD; --cie-nb: #A0CADE; --cie-rb: #6CAAC7;
  --len-v1: #F9DAE9; --len-v2: #EEC0D7; --len-v3: #E4A5C4; --len-v4: #D98AB2; --len-ns: #FEF0F7; --len-nb: #E6AAC8; --len-rb: #D47CA8;
  --mat-v1: #DCDDF4; --mat-v2: #C3C4EA; --mat-v3: #A9ABE0; --mat-v4: #9093D5; --mat-ns: #F1F1FB; --mat-nb: #AFB1E2; --mat-rb: #8386D0;
  --soc-v1: #F9E4D0; --soc-v2: #ECCDB1; --soc-v3: #E0B792; --soc-v4: #D4A073; --soc-ns: #FEF5EB; --soc-nb: #E3BB98; --soc-rb: #CE9463;
}
.segrow { margin: 6px 0 14px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.segrow::-webkit-scrollbar { display: none; }
.seg button { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; flex: none; }
.seg .mdot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.lv1 { background: var(--v1); } .lv2 { background: var(--v2); } .lv3 { background: var(--v3); } .lv4 { background: var(--v4); }
.lv5 { background: var(--t); color: #fff; }

/* Todo 5to: four columns of named rows */
.mcols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.mcol { background: #fff; color: var(--ink); border-radius: 18px; padding: 12px; min-width: 0; }
.mch { width: 100%; min-height: 48px; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 0 4px; margin-bottom: 6px;
  color: var(--ink); font-size: 16px; text-align: left; position: relative; }
.mch::before { content: ""; position: absolute; inset: -4px 0; }   /* step 5: 56 px touch area, same look */
.mch b { flex: 1; min-width: 0; }
.mchi { width: 30px; height: 30px; border-radius: 9px; background: var(--t); color: #fff; display: flex; align-items: center; justify-content: center; flex: none; }
.mchi .ic { width: 18px; height: 18px; stroke-width: 2.2; }
.mch .ar2 { font-size: 22px; color: #9AA3B5; line-height: 1; }
.mrows { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.mtr { height: 35px; border-radius: 9px; display: flex; align-items: center; gap: 8px; padding: 0 10px; box-sizing: border-box;
  font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; color: var(--ink); }
.mtr b { min-width: 18px; flex: none; }
.mtr .mti { width: 18px; flex: none; display: flex; }   /* Tema icon in place of the number (8 Nov 2026) */
.mtr .mti .ic { width: 18px; height: 18px; stroke-width: 2; }
.mtr > span:not(.sr) { overflow: hidden; text-overflow: ellipsis; }
.mtr.lv5 { color: #fff; }
.mtr.lv0 { background: #fff; border: 1.5px dashed var(--rb); color: var(--t); }
.mtr.off { background: transparent; border: 1.5px solid #E3E6EE; color: #6B7385; }   /* step 5: 4.8:1 on white (was #A9B0C0, 2.2:1) */
.mkey { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; color: var(--on-dark-2); font-size: 13px; font-weight: 700; }
.mkey .gap4 { width: 18px; }
.sw4 { width: 18px; height: 18px; border-radius: 5px; display: inline-block; flex: none; }
.sw4.lv0 { border: 1.5px dashed var(--nb); box-sizing: border-box; }

/* One Materia: 12 Tema cards coloured by level */
.tcards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.tc4 { height: 140px; border-radius: 18px; padding: 14px 16px; box-sizing: border-box; display: flex; flex-direction: column; color: var(--ink); min-width: 0; }
.tch { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; min-height: 22px; }
.tch .ic { width: 18px; height: 18px; stroke-width: 2; color: var(--t); flex: none; }
.tc4.lv4 .tch .ic { color: var(--ink); }
.tc4.lv5 .tch .ic { color: #fff; }
.tch .dom { margin-left: auto; background: #fff; color: var(--t); border-radius: 999px; padding: 3px 10px; font-size: 12px; text-transform: none; letter-spacing: 0; white-space: nowrap; }
.tcn { font-size: 18px; line-height: 1.2; margin-top: 6px; flex: 1; min-height: 0; overflow: hidden; }
.tcb { display: flex; align-items: center; gap: 10px; }
.trk { flex: 1; height: 14px; border-radius: 7px; background: #fff; overflow: hidden; display: block; }
.trk i { display: block; height: 100%; border-radius: 7px; background: var(--t); }
.tcb b { font-size: 20px; min-width: 52px; text-align: right; white-space: nowrap; }
.tc4.lv5 { color: #fff; }
.tc4.lv5 .trk { background: rgba(255,255,255,.3); } .tc4.lv5 .trk i { background: #fff; }
.tc4.lv0 { background: var(--ns); border: 2px dashed var(--nb); }
.tc4.lv0 .tcno { font-size: 14px; font-weight: 700; color: var(--t); }
.tc4.off { background: transparent; border: 1.5px solid rgba(255,255,255,.25); color: rgba(255,255,255,.6); }
.mnote { margin: 12px 0 0; color: var(--on-dark-2); font-size: 14px; line-height: 1.45; }

/* Tabla */
.frow4 { display: flex; gap: 14px; }
.pcard4 { background: #fff; color: var(--ink); border-radius: 18px; padding: 14px; box-sizing: border-box; min-width: 0; }
.tgrid4 { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.brd4 { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.brd4 li { height: 52px; border-radius: 12px; display: flex; align-items: center; gap: 14px; padding: 0 16px; box-sizing: border-box; background: #F4F6FA; font-size: 16px; }
.brd4 li.me { background: #FFF3CC; box-shadow: inset 0 0 0 2px var(--sun); }
.brd4 li.gap { height: 20px; background: none; justify-content: center; color: #9AA3B5; font-weight: 700; }
.brd4 li.ph .nk { height: 14px; border-radius: 7px; background: #E3E6EE; max-width: 40%; }
.rk4 { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex: none; }
.rk4.md1 { background: var(--sun); } .rk4.md2 { background: #D5DBE6; } .rk4.md3 { background: #E8B48A; }
.brd4 .nk { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brd4 .pp { white-space: nowrap; }
.tnote4 { margin: 10px 4px 2px; font-size: 13px; line-height: 1.4; color: var(--muted2); }
.pcard4 > .tnote4:first-child { margin-top: 4px; }
.pcard4 > .error { margin: 6px 4px; }
.swcard { padding: 18px; }
.swcard .crow b { flex: 1; }
.swcard p { margin: 8px 0 0; font-size: 14px; line-height: 1.45; color: var(--muted2); }
.swcard p.error:empty { display: none; }
.pgrid4 { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; align-items: start; }
.pnums { display: grid; gap: 14px; }
.pnum { background: #fff; color: var(--ink); border-radius: 18px; padding: 20px; }
.pnum b { display: block; font-family: var(--display); font-weight: 800; font-size: 44px; line-height: 1.1; }
.pnum span { display: block; color: var(--muted2); font-size: 15px; font-weight: 700; }
.pnum.dim { background: var(--glass); color: var(--on-dark); }
.pnum.dim b { font-size: 34px; } .pnum.dim span { color: var(--on-dark-2); }
.chart4 { padding: 20px 22px; }
.chart4 h2 { margin: 0 0 14px; font-size: 16px; font-weight: 700; font-family: inherit; }
.bars4 { display: flex; align-items: stretch; gap: 8px; height: 360px; }
.wk4 { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.wk4 .wv { font-size: 14px; }
.bt4 { flex: 1; width: 100%; max-width: 56px; display: flex; align-items: flex-end; }
.bt4 i { display: block; width: 100%; border-radius: 10px 10px 4px 4px; background: #8C9BC8; }
.wk4.cur .bt4 i { background: var(--sun); }
.wk4.zero .bt4 i { height: 6px !important; background: #E3E6EE; }
.wd { display: flex; flex-direction: column; align-items: center; font-size: 13px; font-weight: 700; line-height: 1.2; }
.wd span { color: var(--muted2); font-weight: 700; }
.wn { font-size: 12px; color: var(--muted2); white-space: nowrap; }

@media (min-width: 600px) and (max-width: 959px) {
  .mcols { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tcards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .frow4 { flex-direction: column; align-items: flex-start; gap: 10px; }
  .tgrid4 { grid-template-columns: minmax(0, 1fr); }
  .pgrid4 { grid-template-columns: minmax(0, 1fr); } .pnums { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 599px) {
  .mcols { grid-template-columns: minmax(0, 1fr); }
  .tcards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tc4 { height: auto; min-height: 136px; padding: 12px; }
  .tch .dom { display: none; }
  .tc4.lv5 .tch::after { content: "✓"; margin-left: auto; }
  .tcn { font-size: 16px; margin-bottom: 8px; }
  .tcb { gap: 6px; } .tcb b { font-size: 16px; min-width: 0; }
  .segrow { margin-right: -16px; padding-right: 16px; }
  .frow4 { flex-direction: column; gap: 10px; }
  .tgrid4 { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .brd4 li { gap: 10px; padding: 0 12px; }
  .pgrid4 { grid-template-columns: minmax(0, 1fr); gap: 12px; } .pnums { grid-template-columns: 1fr 1fr; gap: 10px; }
  .pnum { padding: 14px 16px; } .pnum b { font-size: 34px; } .pnum.dim b { font-size: 28px; }
  .chart4 { padding: 16px 10px; }
  .bars4 { height: 240px; gap: 2px; }
  .wd { font-size: 12px; }
  .wn { font-size: 10px; white-space: normal; text-align: center; line-height: 1.15; overflow-wrap: anywhere; }
}
</style>

<!-- Supabase client (accounts, v0.2). Pinned version; if it cannot load, login shows the connection message. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
(() => {
  /* ---------- data ---------- */
  let BANK = null, T = null, CFG = null;
  // fill colour --mc, text colour --mt, soft tint --sft (used inside style="--mc:...")
  const MCOLOR = { CIE: 'var(--cie);--mt:var(--cie-t);--sft:var(--cie-s)', LEN: 'var(--len);--mt:var(--len-t);--sft:var(--len-s)', MAT: 'var(--mat);--mt:var(--mat-t);--sft:var(--mat-s)', SOC: 'var(--soc);--mt:var(--soc-t);--sft:var(--soc-s)' };
  // v0.3: deep Materia tone (background of Materia screens), its rail and the two landscape shades
  const MDEEP = id => { const k = id.toLowerCase(); return `--bg:var(--${k}-d);--rail-bg:var(--${k}-r);--l1:var(--${k}-l1);--l2:var(--${k}-l2)`; };
  const LETTERS = ['A', 'B', 'C', 'D'];
  // Materia icon (always shown next to the Materia name) and icon on a coloured badge
  const micon = id => `<svg class="ic${id === 'ALL' ? ' todo' : ''}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
  // Tema icon (v0.3): every active Tema of the four Materias has one since 8 Nov 2026; null for a Tema without a drawn icon (the screen then shows the number)
  const temaIcon = (mid, tid) => document.getElementById(`i-${mid}-${tid}`) ? micon(`${mid}-${tid}`) : null;
  // Watermark tile: the Materia icon twice, offset like bricks, used as a CSS mask
  const pattern = id => {
    const g = document.getElementById('i-' + id).innerHTML.replace(/currentColor/g, '#000');
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(6 6) scale(1.5)">${g}</g><g transform="translate(54 54) scale(1.5)">${g}</g></svg>`;
    return `url('data:image/svg+xml,${encodeURIComponent(svg)}')`;
  };
  const mbadge = (id, b) => `<span class="mbadge" ${b ? `style="--b:${b}px"` : ''}>${micon(id)}</span>`;
  // Logo for the grade in the settings: navy version on light backgrounds, white version in dark mode (files in img/)
  const logo = (dark = true) => { const g = encodeURIComponent(CFG.grado), alt = esc(t('textos.marca') + ' ' + CFG.grado);
    return `<img class="logo" src="img/aprueba-${g}${dark ? '-on-dark' : ''}.svg" alt="${alt}">`; };
  // Profe Ariel with a one-line speech bubble. Moods: neutral (default), reto, feliz (rare). sm = round avatar
  const coach = () => '';   // v0.3: the mascot no longer speaks (kept until steps 2 to 4 rebuild the screens that call it)
  // Rotating lines (Aprueba – Textos): one line at random from a group, never the same as the last one shown.
  // Each line carries its mood. No personal data in these lines.
  const lastLine = {};
  const say = key => {
    const list = key.split('.').reduce((o, k) => o && o[k], T);
    if (!Array.isArray(list) || !list.length) return { animo: 'neutral', texto: '' };
    let i = Math.floor(Math.random() * list.length);
    if (list.length > 1 && i === lastLine[key]) i = (i + 1 + Math.floor(Math.random() * (list.length - 1))) % list.length;
    lastLine[key] = i;
    return list[i];
  };
  const app = document.getElementById('app');
  const top = document.getElementById('top');

  // user = the nickname shown on screen; uid and email come from the account (v0.2)
  let state = { view: 'login', user: null, uid: null, email: null, materia: null, prueba: null, loginTab: 'entrar' };

  /* ---------- helpers ---------- */
  const t = (key, vars = {}) => { vars = { grado: CFG ? CFG.grado : '', ...vars };
    return String(key.split('.').reduce((o, k) => o && o[k], T) ?? key).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? ''); };
  // points from settings: correct and wrong answers (Aprueba_Ajustes.xlsx)
  const pts = (c, r) => c * CFG.puntosPorCorrecta + (r - c) * CFG.puntosPorIncorrecta;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // NOT-04: keep a mixed number (2 1/3) and number+unit together on one line
  const fmt = s => esc(s).replace(/(\d+) (\d+\/\d+)/g, '<span class="nw">$1 $2</span>');
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const materia = id => BANK.materias.find(m => m.id === id);
  const tema = (mid, tid) => materia(mid).temas.find(x => x.id === tid);
  const subtemaName = (mid, sid) => { for (const x of materia(mid).temas) for (const s of x.subtemas) if (s.id === sid) return s.name; return sid; };
  const temaNum = tid => parseInt(tid.slice(1), 10);

  /* ---------- storage ----------
     Since v0.2 step 4 the student's Pruebas, answers and thumbs are saved in Supabase and loaded after login,
     so the map and the points follow the student to any device. A Prueba that could not be sent waits on
     this device (per account) and is sent again on the next Prueba or the next login. */
  const keyPend = uid => 'aprueba.v02.pendientes.' + uid;
  const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable: keep going */ } };
  let memoryData = {};
  const userData = () => memoryData[state.uid] || (memoryData[state.uid] = { pruebas: [] });

  /* ---------- accounts (v0.2, decided 30 Oct 2026) ----------
     Email and password with Supabase. The parent signs up (required tick box, stored as adult_confirmed);
     no email confirmation during the test. The nickname is chosen after the first login:
     unique ignoring capitals and accents, 2 to 20 characters (checked again by the database). */
  const SUPABASE_URL = 'https://ctvaqvzvhxpyjwtpuycn.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_qa_L6c8kfiYHiht7E7tT9Q_i3MFqALs';   // publishable key: the access rules protect the data
  const MIN_PASS = 6;                                                     // Supabase's default minimum password length
  let sb = null;
  const client = () => sb || (window.supabase && window.supabase.createClient ? (sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)) : null);
  const noNet = () => { const e = new Error('offline'); e.offline = true; return e; };
  const isOffline = e => !e || e.offline || e.name === 'AuthRetryableFetchError' || e.status === 0 || /fetch|network|load failed/i.test(e.message || '');
  async function loadProfile(user) {
    const c = client(); if (!c) throw noNet();
    const { data, error } = await c.from('students').select('nickname,leaderboard').eq('id', user.id).maybeSingle();
    if (error) throw error;
    Object.assign(state, { uid: user.id, email: user.email, user: (data && data.nickname) || null, enTabla: !!(data && data.leaderboard) });
  }
  // Leaderboard switch (4 Nov 2026): the same switch on the Tabla de posiciones page and in Configuración.
  // New accounts start out of the board; joining or leaving takes effect at once. Returns true when saved.
  async function setEnTabla(on) {
    try {
      const c = client(); if (!c || !state.uid) return false;
      const { error } = await c.from('students').update({ leaderboard: on }).eq('id', state.uid).select('leaderboard').single();
      if (error) return false;
      state.enTabla = on; tablaCache = {}; return true;
    } catch (e) { return false; }
  }
  async function enterAs(user) {   // after login, sign-up or a session saved on this device
    await loadProfile(user);
    memoryData = {};
    await loadHistory();
    go(state.user ? 'home' : 'apodo');
    sendPending();
  }
  // The student's own Pruebas (with their answers) and thumbs; the access rules return only this account's rows
  async function loadHistory() {
    const c = client();
    const { data, error } = await c.from('pruebas')
      .select('id,tipo,materia,tema,started_at,finished_at,duracion_seg,n_correctas,puntos,answers(question_id,posicion,opcion,correcta,tiempo_ms)')
      .order('finished_at', { ascending: true });
    if (error) throw error;
    const saved = (data || []).map(x => ({
      id: x.id, tipo: x.tipo, materia: x.materia, tema: x.tema, inicio: x.started_at, fin: x.finished_at,
      duracionSeg: x.duracion_seg, correctas: x.n_correctas, puntos: x.puntos,
      respuestas: (x.answers || []).slice().sort((a, b) => a.posicion - b.posicion)
        .map(a => ({ id: a.question_id, correcta: a.correcta, opcion: a.opcion, ms: a.tiempo_ms }))
    }));
    const ids = new Set(saved.map(x => x.id));
    const waiting = load(keyPend(state.uid), []).filter(w => !ids.has(w.record.id));
    save(keyPend(state.uid), waiting);
    memoryData[state.uid] = { pruebas: saved.concat(waiting.map(w => w.record)) };
    const r = await c.from('ratings').select('question_id,valor');
    votes = {}; for (const v of (r.data || [])) votes[v.question_id] = v.valor;
  }
  // Send the Pruebas waiting on this device, oldest first; a retry of the same Prueba is ignored by the database
  let sending = false;
  async function sendPending() {
    if (sending || !state.uid) return;
    const uid = state.uid, c = client(); if (!c) return;
    sending = true;
    try {
      for (const w of load(keyPend(uid), [])) {
        const { error } = await c.rpc('save_prueba', { p: w.payload });
        if (error) break;
        save(keyPend(uid), load(keyPend(uid), []).filter(x => x.record.id !== w.record.id));
      }
    } catch (e) { /* no connection: try again later */ }
    finally { sending = false; }
  }
  const newId = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
    : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, ch => { const r = Math.random() * 16 | 0; return (ch === 'x' ? r : (r & 3 | 8)).toString(16); });
  // Returns null when saved, or the text key of the message to show
  // extra: other columns saved in the same update (the nickname screen saves the leaderboard switch with it, 8 Nov 2026)
  async function saveNickname(name, extra = {}) {
    name = name.trim();
    if ([...name].length < 2 || [...name].length > 20) return 'textos.apodoAyuda';
    try {
      const c = client(); if (!c) return 'textos.errorConexion';
      const { error } = await c.from('students').update({ nickname: name, ...extra }).eq('id', state.uid).select('nickname').single();
      if (error) return error.code === '23505' ? 'textos.apodoOcupado' : 'textos.errorConexion';
      state.user = name; if ('leaderboard' in extra) { state.enTabla = !!extra.leaderboard; tablaCache = {}; } return null;
    } catch (e) { return 'textos.errorConexion'; }
  }
  async function signOut() {
    try { const c = client(); if (c) await c.auth.signOut(); } catch (e) { /* signed out on this device anyway */ }
    memoryData = {}; tablaCache = {};
    go('login', { user: null, uid: null, email: null, prueba: null, loginTab: 'entrar' });
  }

  /* ---------- draw a prueba (TST-01 to TST-05) ---------- */
  function pool(tipo, mid, tid) {
    return BANK.questions.filter(q => tipo === 'grado' || (q.materia === mid && (tipo === 'materia' || q.tema === tid)));
  }
  function draw(tipo, mid, tid) {
    const n = CFG.preguntasPorPrueba, used = new Set(), picked = [];
    for (const q of shuffle(pool(tipo, mid, tid))) {
      if (q.cluster && used.has(q.cluster)) continue;          // TST-04
      picked.push(q); if (q.cluster) used.add(q.cluster);
      if (picked.length === n) break;
    }
    return picked.map(q => {
      const idx = q.options.map((_, i) => i);
      const order = q.order === 'Fixed' ? idx : shuffle(idx);  // TST-03, MET-08 (Fixed is pre-sorted ascending)
      return { id: q.id, order, chosen: null, checked: false, ms: 0 };
    });
  }
  const Q = id => BANK.questions.find(q => q.id === id);

  /* ---------- performance levels for the progress map ----------
     Settings: points, "answer that counts", level limits and colours.
     Each question counts once (its latest or best answer).
     The map shows no points (4 Nov 2026). */
  function perf() {
    const ok = {};   // question id -> counts as correct (true/false)
    for (const p of userData().pruebas) for (const r of p.respuestas) {   // pruebas are stored in time order
      if (!Q(r.id)) continue;
      ok[r.id] = CFG.respuestaQueCuenta === 'mejor' ? (ok[r.id] || r.correcta) : r.correcta;
    }
    const s = {};
    for (const q of BANK.questions) for (const k of [q.materia, q.materia + '|' + q.tema, q.materia + '|' + q.subtema]) {
      s[k] = s[k] || { c: 0, n: 0, a: 0 };
      s[k].n++; if (ok[q.id]) s[k].c++; if (q.id in ok) s[k].a++;
    }
    return s;
  }
  function level(x) {
    const pct = x && x.n ? x.c / x.n : 0;   // level = questions answered correctly ÷ questions
    let n = 1;
    CFG.niveles.forEach((l, i) => { if (pct >= l.desde) n = i + 1; });
    return n;
  }
  /* ---------- reviewer ratings (thumbs up / down per question) ----------
     Since v0.2 step 4: one row per account and question in Supabase (table ratings); tapping again removes it. */
  let votes = {};                              // { questionId: 1 | -1 } for this account, loaded after login
  async function vote(qid, v) {
    const now = votes[qid] === v ? 0 : v;      // tap again to remove the rating
    if (now) votes[qid] = now; else delete votes[qid];
    render();
    try {
      const c = client(); if (!c || !state.uid) return;
      if (now) await c.from('ratings').upsert({ student_id: state.uid, question_id: qid, valor: now, updated_at: new Date().toISOString() }, { onConflict: 'student_id,question_id' });
      else await c.from('ratings').delete().eq('student_id', state.uid).eq('question_id', qid);
    } catch (e) { /* no connection: the thumb shows on screen but is not saved */ }
  }
  // Points reward practice (4 Nov 2026): every correct answer, repeats included. The saved total plus, during a
  // Prueba, the points of the answers given so far; an abandoned Prueba is never saved, so the total returns.
  const savedPoints = () => userData().pruebas.reduce((a, p) => a + p.puntos, 0);
  const livePoints = () => {
    const P = state.prueba; if (state.view !== 'pregunta' || !P) return 0;
    const done = P.items.filter(x => x.checked), c = done.filter(x => x.chosen === Q(x.id).correct).length;
    return pts(c, done.length);
  };
  const totalPoints = () => savedPoints() + livePoints();

  /* ---------- sound effects (decided 28 Oct 2026) ----------
     Three short sounds generated in the browser (no files): correct = "Marimba" (two warm notes, C to G),
     wrong = "Toc suave" (muffled low knock), click = "Tic" (tiny dry tick).
     On/off is remembered on this device; the starting state and the volume come from the settings.
     No sound on the login screen. Sound never carries meaning alone (green ✓ and red ✗ stay). */
  const KEY_SOUND = 'aprueba.v01.sonido';
  const sound = { ctx: null, out: null };
  const soundOn = () => { const v = load(KEY_SOUND, null); return v === null ? CFG.sonidoInicial === 'activado' : v === 'on'; };
  function audio() {
    if (!sound.ctx) {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      sound.ctx = new C(); sound.out = sound.ctx.createGain();
      sound.out.gain.value = 0.6 * CFG.volumenSonido * CFG.volumenSonido;   // same curve as the sound picker page
      sound.out.connect(sound.ctx.destination);
    }
    if (sound.ctx.state === 'suspended') sound.ctx.resume();
    return sound.ctx;
  }
  function tone(o) {   // one note: wave type, frequency (or [from, to] glide), start offset, length, peak, optional low-pass
    const c = sound.ctx, at = c.currentTime + 0.01 + (o.at || 0);
    const osc = c.createOscillator(), g = c.createGain(); osc.type = o.type || 'sine';
    if (Array.isArray(o.f)) { osc.frequency.setValueAtTime(o.f[0], at); osc.frequency.exponentialRampToValueAtTime(o.f[1], at + (o.glide || o.dur)); }
    else osc.frequency.setValueAtTime(o.f, at);
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(o.g, at + (o.atk || 0.006)); g.gain.exponentialRampToValueAtTime(0.0001, at + o.dur);
    let end = g; if (o.lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; g.connect(f); end = f; }
    osc.connect(g); end.connect(sound.out); osc.start(at); osc.stop(at + o.dur + 0.02);
  }
  function tick() {
    const c = sound.ctx, at = c.currentTime + 0.01, len = Math.ceil(c.sampleRate * 0.025);
    const b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const s = c.createBufferSource(); s.buffer = b;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2600; f.Q.value = 1.5;
    const g = c.createGain(); g.gain.value = 0.7;
    s.connect(f); f.connect(g); g.connect(sound.out); s.start(at);
  }
  const SFX = {
    correcta: () => { tone({ type: 'triangle', f: 523, dur: .14, g: .5, lp: 2200 }); tone({ f: 2092, dur: .05, g: .06 }); tone({ type: 'triangle', f: 784, at: .09, dur: .19, g: .55, lp: 2200 }); tone({ f: 3136, at: .09, dur: .05, g: .05 }); },
    incorrecta: () => tone({ type: 'triangle', f: [240, 190], dur: .18, g: .55, lp: 1100 }),
    clic: tick
  };
  function sfx(name) {
    if (!state.user || !CFG || !soundOn()) return;
    try { if (audio()) SFX[name](); } catch (e) { /* no sound on this device: keep going */ }
  }
  const SPEAKER = '<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke="none"/>';
  const soundIcon = on => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">${SPEAKER}${on ? '<path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a7.8 7.8 0 0 1 0 11"/>' : '<path d="m16 9.5 5 5"/><path d="m21 9.5-5 5"/>'}</svg>`;
  function toggleSound() {
    const on = !soundOn(); save(KEY_SOUND, on ? 'on' : 'off');
    renderTop(); if (on) sfx('clic');   // a tick confirms that sound is back on
  }

  /* ---------- shell (v0.3, 8 Nov 2026): rail and information area ----------
     Rail: Pruebas, Progreso, Tabla, Ayuda and, at the bottom, the gear (Configuración); the selected item has a yellow pill.
     Hidden before login, on the nickname screen and during a Prueba (question screen). Bottom bar on phones (CSS).
     Information area: the screen's back link, title and context on the left (set by each view with head()),
     the sound button and the points chip (opens the Tabla) on the right. */
  const RAIL = [['home', 'railPruebas', 'PRU'], ['progreso', 'railProgreso', 'PRO'], ['tabla', 'railTabla', 'TAB'], ['ayuda', 'railAyuda', 'AYU']];
  const railOf = v => ({ materia: 'home', intro: 'home', resultado: 'home', respuestas: 'home' })[v] || v;
  const rail = document.getElementById('rail');
  function renderRail() {
    const show = !!state.user && !['login', 'apodo', 'pregunta'].includes(state.view);

  // Each view describes its information area: { back: [id, textKey, action], icon: html, title: text, pill: true, extra: html }
  let HEAD = null;
  const head = h => { HEAD = h; };
  function renderTop() {
    if (!state.user) { top.innerHTML = ''; top.hidden = true; return; }   // login and nickname: no information area
    const on = soundOn(), lbl = esc(t(on ? 'textos.sonidoSilenciar' : 'textos.sonidoActivar'));

    const shown = anim ? anim.from : total, h = HEAD || {};

      + (h.back ? `<button class="b-back" id="${h.back[0]}"><span class="ar" aria-hidden="true">‹</span>${esc(t(h.back[1]))}</button>` : '')
      + (h.icon || h.title ? `<span class="tt">${h.icon || ''}${h.title ? `<h1>${esc(h.title)}</h1>` : ''}</span>` : '') + (h.pill ? `<span class="gpill">${esc(CFG.grado)}</span>` : '') + (h.extra || '')
      + `</div><div class="tools">`
      + `<button class="snd ${on ? '' : 'off'}" id="snd" aria-pressed="${on}" aria-label="${lbl}" title="${lbl}">${soundIcon(on)}</button>`
      + `<button class="pts" id="ptsbtn" aria-label="${esc(t('textos.verTabla', { p: total }))}">${micon('TAB')}<span class="n">${esc(t('textos.puntosTotales', { n: shown }))}</span></button></div>`;
    document.getElementById('snd').onclick = toggleSound;
    document.getElementById('ptsbtn').onclick = () => leaveTo('tabla');
    if (h.back && h.back[2]) document.getElementById(h.back[0]).onclick = h.back[2];   // step 3: the view gives the back action
    top.hidden = false;
    if (anim) countUp(anim.from, anim.to);
  }
  // The total counts up with a short pop (under half a second, brief yellow highlight) when an answer is correct.
  function countUp(from, to) {
    const b = document.getElementById('ptsbtn'), n = b && b.querySelector('.n'); if (!n) return;
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const put = v => { n.textContent = t('textos.puntosTotales', { n: v }); };
    b.classList.add('pop');
    setTimeout(() => { b.classList.add('fade'); b.classList.remove('pop'); }, 450);
    if (reduce) { put(to); return; }
    const t0 = performance.now(), dur = 400;
    const step = now => { const k = Math.min(1, (now - t0) / dur); put(Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)))); if (k < 1 && n.isConnected) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  // From the top bar during a Prueba: the same confirmation as «Salir» first (the answers and points are not saved)
  function leaveTo(view) {
    const P = state.prueba;
    if (state.view === 'pregunta' && P) { P.quit = true; P.quitTo = view; render(); return; }
    go(view);
  }

  const THUMB = d => d > 0 ? '<path d="M7 11v9H4v-9zM7 11l4-7c1.5 0 2.5 1 2.5 2.5V10H19a2 2 0 0 1 2 2.3l-1.2 6A2 2 0 0 1 17.8 20H7"/>'

  function viewPregunta() {
    const P = state.prueba, it = P.items[P.i], q = Q(it.id), n = P.items.length;
    const m = materia(q.materia), k = m.id.toLowerCase(), x = tema(q.materia, q.tema);
    const dots = P.items.map((d, j) => `<span class="dt${j === P.i && !d.checked ? ' cur' : ''}${d.checked ? (d.chosen === Q(d.id).correct ? ' ok' : ' no') : ''}"></span>`).join('');
