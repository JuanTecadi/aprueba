<style>
/* Layout: one centered tablet column on squared notebook paper; one screen at a time, big touch targets */
:root {
  --paper: #f6f8fb;
  --grid: rgba(37, 64, 120, 0.07);
  --card: #ffffff;
  --ink: #16213a;
  --muted: #56617a;
  --line: #d9dfea;
  --sun: #ffc93c;          /* araguaney yellow: primary actions */
  --sun-ink: #2a2100;
  --sun-soft: #fff3cf;
  --ok: #1f9d55;  --ok-soft: #e3f6ea;
  --mid: #4f86e8; --mid-soft: #e4edfd;
  --low: #e0661b; --low-soft: #fdeadd;
  --none: #a3abbb; --none-soft: #eef1f6;
  --bad: #d23f3f; --bad-soft: #fde7e7;
  /* Materias: fill (identity), -t text on light surfaces, -s soft tint (palette decided 28 Oct 2026) */
  --cie: #22a6e0; --cie-t: #0a6e9c; --cie-s: #e3f4fc;
  --len: #ec5a9e; --len-t: #b3266d; --len-s: #fde6f1;
  --mat: #3236b0; --mat-t: #3236b0; --mat-s: #e7e8f8;
  --soc: #f2892a; --soc-t: #a64b00; --soc-s: #feeedd;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 18px;
  --shadow: 0 1px 0 rgba(22,33,58,.06), 0 6px 18px rgba(22,33,58,.06);
  --wm-op: .10; --mix: 38%; --band-ink: #ffffff;
  --off: #eef1f6; --off-line: #d3d9e4; --off-stripe: rgba(86,97,122,.12);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f1626; --grid: rgba(160, 190, 255, 0.05); --card: #18223a; --ink: #eef2fa; --muted: #a6b0c6; --line: #2c3856;
  --sun: #ffcf4d; --sun-ink: #241c00; --sun-soft: #3a3214;
  --ok: #4cc983; --ok-soft: #173a2a; --mid: #84aaff; --mid-soft: #1f2d4f; --low: #ff9150; --low-soft: #40261a;
  --none: #6f7a92; --none-soft: #232e48; --bad: #ff7676; --bad-soft: #432329;
  --cie: #3db4ea; --cie-t: #5ec4f2; --cie-s: #14303f; --len: #f06aa8; --len-t: #f590c0; --len-s: #3a1a2c; --mat: #6c70e6; --mat-t: #a3a7ff; --mat-s: #22244a; --soc: #f59a45; --soc-t: #f7aa62; --soc-s: #3a2614;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); --wm-op: .13; --mix: 45%; --band-ink: #10172a; --off: #1c2640; --off-line: #33405f; --off-stripe: rgba(166,176,198,.10); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0f1626; --grid: rgba(160, 190, 255, 0.05); --card: #18223a; --ink: #eef2fa; --muted: #a6b0c6; --line: #2c3856;
  --sun: #ffcf4d; --sun-ink: #241c00; --sun-soft: #3a3214;
  --ok: #4cc983; --ok-soft: #173a2a; --mid: #84aaff; --mid-soft: #1f2d4f; --low: #ff9150; --low-soft: #40261a;
  --none: #6f7a92; --none-soft: #232e48; --bad: #ff7676; --bad-soft: #432329;
  --cie: #3db4ea; --cie-t: #5ec4f2; --cie-s: #14303f; --len: #f06aa8; --len-t: #f590c0; --len-s: #3a1a2c; --mat: #6c70e6; --mat-t: #a3a7ff; --mat-s: #22244a; --soc: #f59a45; --soc-t: #f7aa62; --soc-s: #3a2614;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); --wm-op: .13; --mix: 45%; --band-ink: #10172a; --off: #1c2640; --off-line: #33405f; --off-stripe: rgba(166,176,198,.10); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--mat); outline-offset: 3px; }
.wrap { max-width: 1180px; margin: 0 auto; }
.narrow { width: 100%; max-width: 760px; margin-inline: auto; }

/* Top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px 10px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 1.6rem; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 6px; }
.brand .a { color: var(--ink); }
.brand .grade { font-size: .85rem; font-weight: 800; background: var(--sun); color: var(--sun-ink); padding: 2px 8px; border-radius: 999px; transform: translateY(-3px); }
.who { display: flex; align-items: center; gap: 10px; font-size: .95rem; color: var(--muted); min-width: 0; }
.who b { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pts { font-variant-numeric: tabular-nums; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; color: var(--ink); font-weight: 700; white-space: nowrap; }

h1, h2, h3 { font-family: var(--display); letter-spacing: -0.015em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.8rem, 4.5vw, 2.4rem); font-weight: 800; line-height: 1.1; }
h2 { font-size: 1.35rem; font-weight: 800; }
h3 { font-size: 1.1rem; font-weight: 600; }
.sub { color: var(--muted); margin: 6px 0 0; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.screen { display: flex; flex-direction: column; gap: 22px; padding-top: 8px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 0 26px; border-radius: 999px; border: 2px solid transparent; font-weight: 700; font-size: 1.1rem; }
.btn-main { background: var(--sun); color: var(--sun-ink); box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.btn-main:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
.btn-main:disabled { background: var(--none-soft); color: var(--muted); box-shadow: none; cursor: default; }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn-link { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; min-height: 44px; padding: 0 4px; font-weight: 400; font-size: 1rem; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* Login */
.login { background: var(--card); border-radius: 24px; box-shadow: var(--shadow); padding: 28px; display: flex; flex-direction: column; gap: 18px; margin-top: 4vh; }
.login label { font-weight: 700; }
.login input { width: 100%; min-height: 56px; border: 2px solid var(--line); border-radius: 14px; padding: 0 16px; background: var(--paper); font-size: 1.15rem; }
.login input:focus { border-color: var(--mat); outline: none; }
.error { color: var(--bad); font-size: .95rem; min-height: 1.4em; margin: 0; }
.note { font-size: .9rem; color: var(--muted); margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-user { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 8px 16px; min-height: 44px; }

/* Home choices */
.choice { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 16px; width: 100%; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--shadow); }
.choice:hover { border-color: var(--ink); }
.choice .ic { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 1.3rem; background: var(--none-soft); color: var(--ink); }
.choice .t { font-family: var(--display); font-weight: 800; font-size: 1.25rem; display: block; }
.choice .s { color: var(--muted); font-size: .95rem; display: block; }
.choice .arrow { font-size: 1.4rem; color: var(--muted); }
.choice.hero { background: var(--sun); border-color: var(--sun); color: var(--sun-ink); }
.choice.hero .s, .choice.hero .arrow { color: var(--sun-ink); opacity: .8; }
.choice.hero .ic { background: rgba(255,255,255,.55); color: var(--sun-ink); }
.choice > span:nth-child(2) { min-width: 0; }

/* Materia tiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.tile { text-align: left; background: var(--card); border: 2px solid var(--line); border-top: 8px solid var(--mc); border-radius: var(--r); padding: 18px; min-height: 120px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; box-shadow: var(--shadow); }
.tile .t { font-family: var(--display); font-weight: 800; font-size: 1.35rem; color: var(--mt, var(--mc)); }
.tile .s { color: var(--muted); font-size: .95rem; }
.tema-btn { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; text-align: left; background: var(--card); border: 2px solid var(--line); border-left: 8px solid var(--mc); border-radius: var(--r); padding: 16px 18px; width: 100%; box-shadow: var(--shadow); }
.tema-btn .n { grid-row: span 2; font-family: var(--display); font-weight: 800; color: var(--mt, var(--mc)); font-size: 1.1rem; padding-top: 1px; }
.tema-btn .t { font-weight: 700; font-size: 1.12rem; }
.tema-btn .s { color: var(--muted); font-size: .9rem; }

/* Intro */
.intro { background: var(--card); border-radius: 24px; box-shadow: var(--shadow); padding: 30px; display: flex; flex-direction: column; gap: 20px; border-top: 10px solid var(--mc, var(--sun)); }
.badge { display: inline-flex; align-self: flex-start; font-size: .85rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mt, var(--mc, var(--ink))); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fact { background: var(--paper); border-radius: 14px; padding: 14px 16px; }
.fact b { font-family: var(--display); font-size: 1.6rem; display: block; line-height: 1.1; }
.fact span { color: var(--muted); font-size: .92rem; }

/* Question */
.qbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--none-soft); border: 2px solid var(--line); }
.dot.cur { border-color: var(--ink); background: var(--card); }
.dot.ok { background: var(--ok); border-color: var(--ok); }
.dot.no { background: var(--bad); border-color: var(--bad); }
.qcard { background: var(--card); border-radius: 24px; box-shadow: var(--shadow); padding: 26px; display: flex; flex-direction: column; gap: 20px; position: relative; }
.rate { margin-left: auto; display: flex; gap: 6px; }
.vote { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); color: var(--muted); display: grid; place-items: center; padding: 0; }
.vote.down svg { transform: rotate(180deg); }
.vote:hover { color: var(--ink); border-color: var(--muted); }
.vote.on.up { color: var(--ok); background: var(--ok-soft); border-color: var(--ok); }
.vote.on.down { color: var(--bad); background: var(--bad-soft); border-color: var(--bad); }
.qmeta { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: .88rem; color: var(--muted); }
.mtag { font-weight: 700; color: var(--mt, var(--mc)); text-transform: uppercase; letter-spacing: .06em; }
.stem { font-size: clamp(1.22rem, 2.6vw, 1.42rem); line-height: 1.4; margin: 0; font-weight: 700; }
.opts { display: flex; flex-direction: column; gap: 12px; }
.opt { display: grid; grid-template-columns: 40px 1fr 28px; align-items: center; gap: 12px; text-align: left; min-height: 64px; padding: 10px 14px; background: var(--paper); border: 2px solid var(--line); border-radius: 16px; font-size: 1.12rem; transition: border-color .12s, background .12s; }
.opt .k { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; background: var(--card); border: 2px solid var(--line); }
.opt .mk { font-weight: 800; font-size: 1.2rem; text-align: center; }
.opt > span:nth-child(2) { min-width: 0; overflow-wrap: anywhere; }
.opt:hover:not(:disabled) { border-color: var(--muted); }
.opt.sel { border-color: var(--ink); background: var(--card); }
.opt.sel .k { background: var(--ink); color: var(--card); border-color: var(--ink); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .k { background: var(--ok); border-color: var(--ok); color: #fff; }
.opt.right .mk { color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); border-color: var(--bad); color: #fff; }
.opt.wrong .mk { color: var(--bad); }
.opt:disabled { cursor: default; }
.opt.dim { opacity: .55; }
.verdict { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.1rem; }
.verdict.ok { color: var(--ok); }
.verdict.no { color: var(--muted); font-weight: 400; font-size: 1rem; }
.plus { font-family: var(--display); font-weight: 800; background: var(--sun); color: var(--sun-ink); border-radius: 999px; padding: 2px 12px; animation: pop .5s ease-out; }
@keyframes pop { 0% { transform: scale(.4); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
.fb { background: var(--sun-soft); border-radius: 16px; padding: 16px 18px; }
.fb h3 { font-size: .85rem; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 4px; font-family: var(--body); font-weight: 700; }
.fb p { margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
.confirm { background: var(--card); border: 2px solid var(--low); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.confirm p { margin: 0; }
.nw { white-space: nowrap; }

/* Results */
.score { background: var(--card); border-radius: 24px; box-shadow: var(--shadow); padding: 28px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.big { font-family: var(--display); font-weight: 800; font-size: clamp(3rem, 10vw, 4.5rem); line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.big small { font-size: .35em; color: var(--muted); letter-spacing: 0; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.list li { display: grid; grid-template-columns: 32px 1fr; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; align-items: start; }
.list .m { font-weight: 800; font-size: 1.1rem; text-align: center; }
.list .m.ok { color: var(--ok); } .list .m.no { color: var(--bad); }
.list .q { font-size: .98rem; min-width: 0; }
.list .q small { display: block; color: var(--muted); font-size: .85rem; }

/* Progress map */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab { border: 2px solid var(--line); background: var(--card); border-radius: 999px; min-height: 44px; padding: 0 18px; font-weight: 700; color: var(--muted); }
.tab[aria-selected="true"] { border-color: var(--mc); color: var(--mt, var(--mc)); background: var(--card); box-shadow: inset 0 -3px 0 var(--mc); }
.map { background: var(--card); border-radius: 26px; box-shadow: var(--shadow); padding: 26px; display: flex; flex-direction: column; gap: 20px; }
.maphead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.maphead .gr { color: var(--muted); font-size: .95rem; }
.sumline { color: var(--muted); margin: 6px 0 0; font-variant-numeric: tabular-nums; }
.stackbar { display: flex; gap: 4px; height: 14px; }
.stackbar i { display: block; height: 100%; border-radius: 99px; min-width: 6px; }
.temagrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.tcard { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.tcard .tt { display: flex; align-items: center; gap: 10px; }
.tcard .num { flex: none; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--c); color: var(--k); font-family: var(--display); font-weight: 800; }
.tcard .tn { font-family: var(--display); font-weight: 800; font-size: 1.12rem; line-height: 1.2; flex: 1; min-width: 0; }
.tcard .tp { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .9rem; white-space: nowrap; }
.sbars { display: flex; flex-direction: column; gap: 8px; }
.sbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 44px; padding: 8px 14px; border-radius: 12px; background: var(--c); color: var(--k); }
.sbar .sn { font-weight: 700; font-size: .95rem; line-height: 1.25; min-width: 0; }
.sbar .sp { font-variant-numeric: tabular-nums; font-size: .9rem; font-weight: 700; white-space: nowrap; }
.mbar { height: 14px; border-radius: 99px; background: var(--none-soft); overflow: hidden; }
.mbar i { display: block; height: 100%; border-radius: 99px; background: var(--c); }
/* Not started: no fill, dashed outline, muted text */
[data-ns] { background: transparent !important; color: var(--muted) !important; border: 2px dashed var(--line) !important; }
/* Whole-grade map: four Materia areas coloured by level, each with one block per Tema */
.quad { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.carea { text-align: left; border-radius: 22px; padding: 18px; min-height: 160px; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; background: var(--c); color: var(--k); border: 2px solid transparent; }
.carea .top { display: flex; flex-direction: column; gap: 8px; }
.carea .top::before { content: ""; width: 40px; height: 6px; border-radius: 3px; background: var(--mc); }
.carea .kn { font-family: var(--display); font-weight: 800; font-size: 1.5rem; line-height: 1.1; }
.trail { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.trail span { aspect-ratio: 1; max-width: 100%; border-radius: 10px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; background: var(--c); color: var(--k); border: 2px solid var(--card); }
.trail span[data-ns] { background: var(--card) !important; }
/* Materia map: one row per Tema, its three Subtemas as large chips */
.tlist { display: flex; flex-direction: column; gap: 18px; }
.trow { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 6px 12px; align-items: start; }
.trow .num { grid-row: span 3; flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--c); color: var(--k); font-family: var(--display); font-weight: 800; border: 2px solid transparent; }
.trow .tn { font-family: var(--display); font-weight: 800; font-size: 1.12rem; line-height: 1.2; padding-top: 4px; min-width: 0; }
.chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cchip { border-radius: 12px; padding: 10px 12px; min-height: 64px; display: flex; flex-direction: column; justify-content: center; gap: 2px; background: var(--c); color: var(--k); border: 2px solid transparent; min-width: 0; overflow-wrap: anywhere; }
.cchip b { font-size: .95rem; line-height: 1.2; }
.cchip small { font-size: .85rem; font-variant-numeric: tabular-nums; opacity: .9; }
.trow .btn { justify-self: start; min-height: 48px; font-size: 1rem; }
@media (max-width: 560px) { .chips { grid-template-columns: minmax(0, 1fr); } .carea { min-height: 140px; padding: 14px; } .carea .kn { font-size: 1.25rem; } }
.tcard .btn { min-height: 48px; font-size: 1rem; align-self: flex-start; }
@media (max-width: 520px) {
  body { font-size: 17px; }
  .tiles, .facts { grid-template-columns: minmax(0, 1fr); }
  .qcard, .intro, .score, .login { padding: 20px; }
  .choice { grid-template-columns: 44px 1fr auto; padding: 14px 16px; }
  .choice .ic { width: 44px; height: 44px; font-size: 1.05rem; }
}
/* Materia icons: always next to the Materia name */
.ic { width: var(--s, 22px); height: var(--s, 22px); flex: none; display: inline-block; vertical-align: middle; }
.mbadge { width: var(--b, 44px); height: var(--b, 44px); border-radius: calc(var(--b, 44px) * .3); background: var(--mc); color: #fff; display: inline-grid; place-items: center; flex: none; }

<script>
(() => {
  /* ---------- data ---------- */
  let BANK = null, T = null, CFG = null;
  // fill colour --mc, text colour --mt, soft tint --sft (used inside style="--mc:...")
  const MCOLOR = { CIE: 'var(--cie);--mt:var(--cie-t);--sft:var(--cie-s)', LEN: 'var(--len);--mt:var(--len-t);--sft:var(--len-s)', MAT: 'var(--mat);--mt:var(--mat-t);--sft:var(--mat-s)', SOC: 'var(--soc);--mt:var(--soc-t);--sft:var(--soc-s)' };
  const LETTERS = ['A', 'B', 'C', 'D'];
  // Materia icon (always shown next to the Materia name) and icon on a coloured badge
  const micon = id => `<svg class="ic" aria-hidden="true"><use href="#i-${id}"/></svg>`;
  // Watermark tile: the Materia icon twice, offset like bricks, used as a CSS mask
  const pattern = id => {
    const g = document.getElementById('i-' + id).innerHTML.replace(/currentColor/g, '#000');
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(6 6) scale(1.5)">${g}</g><g transform="translate(54 54) scale(1.5)">${g}</g></svg>`;
    return `url('data:image/svg+xml,${encodeURIComponent(svg)}')`;
  };
  const mbadge = (id, b) => `<span class="mbadge" ${b ? `style="--b:${b}px"` : ''}>${micon(id)}</span>`;
  // Logo for the grade in the settings: navy version on light backgrounds, white version in dark mode (files in img/)
  const logo = () => { const g = encodeURIComponent(CFG.grado), alt = esc(t('textos.marca') + ' ' + CFG.grado);
    return `<img class="logo lg-l" src="img/aprueba-${g}.svg" alt="${alt}"><img class="logo lg-d" src="img/aprueba-${g}-on-dark.svg" alt="${alt}">`; };
  // Profe Ariel with a one-line speech bubble. Moods: neutral (default), reto, feliz (rare). sm = round avatar
  const coach = (mood, text, sm) => `<div class="coach${sm ? ' sm' : ''}"><img src="img/profe-ariel-${mood}${sm ? '-avatar' : ''}.svg" alt="${esc(t('textos.profe.nombre'))}"><p class="bubble">${esc(text)}</p></div>`;
  // Rotating lines (Aprueba – Textos): one line at random from a group, never the same as the last one shown.
  // Each line carries its mood. No personal data in these lines.
  const lastLine = {};
  const say = key => {
    const list = key.split('.').reduce((o, k) => o && o[k], T);
    if (!Array.isArray(list) || !list.length) return { animo: 'neutral', texto: '' };
    let i = Math.floor(Math.random() * list.length);
    if (list.length > 1 && i === lastLine[key]) i = (i + 1 + Math.floor(Math.random() * (list.length - 1))) % list.length;
    lastLine[key] = i;
    return list[i];
  };
  const app = document.getElementById('app');
  const top = document.getElementById('top');

  // user = the nickname shown on screen; uid and email come from the account (v0.2)
  let state = { view: 'login', user: null, uid: null, email: null, materia: null, prueba: null, loginTab: 'entrar' };

  /* ---------- helpers ---------- */
  const t = (key, vars = {}) => { vars = { grado: CFG ? CFG.grado : '', ...vars };
    return String(key.split('.').reduce((o, k) => o && o[k], T) ?? key).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? ''); };
  // points from settings: correct and wrong answers (Aprueba_Ajustes.xlsx)
  const pts = (c, r) => c * CFG.puntosPorCorrecta + (r - c) * CFG.puntosPorIncorrecta;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // NOT-04: keep a mixed number (2 1/3) and number+unit together on one line
  const fmt = s => esc(s).replace(/(\d+) (\d+\/\d+)/g, '<span class="nw">$1 $2</span>');
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const materia = id => BANK.materias.find(m => m.id === id);
  const tema = (mid, tid) => materia(mid).temas.find(x => x.id === tid);
  const subtemaName = (mid, sid) => { for (const x of materia(mid).temas) for (const s of x.subtemas) if (s.id === sid) return s.name; return sid; };
  const temaNum = tid => parseInt(tid.slice(1), 10);

  /* ---------- storage on this device ----------
     Progress is still kept on the device until results are saved online (v0.2 step 4),
     now per account (account id) instead of per typed username. */
  const keyData = uid => 'aprueba.v02.datos.' + uid;
  const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable: keep going */ } };
  let memoryData = {};
  const userData = () => memoryData[state.uid] || (memoryData[state.uid] = load(keyData(state.uid), { pruebas: [] }));
  const saveUserData = () => save(keyData(state.uid), userData());

  /* ---------- accounts (v0.2, decided 30 Oct 2026) ----------
     Email and password with Supabase. The parent signs up (required tick box, stored as adult_confirmed);
     no email confirmation during the test. The nickname is chosen after the first login:
     unique ignoring capitals and accents, 2 to 20 characters (checked again by the database). */
  const SUPABASE_URL = 'https://ctvaqvzvhxpyjwtpuycn.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_qa_L6c8kfiYHiht7E7tT9Q_i3MFqALs';   // publishable key: the access rules protect the data
  const MIN_PASS = 6;                                                     // Supabase's default minimum password length
  let sb = null;
  const client = () => sb || (window.supabase && window.supabase.createClient ? (sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)) : null);
  const noNet = () => { const e = new Error('offline'); e.offline = true; return e; };
  const isOffline = e => !e || e.offline || e.name === 'AuthRetryableFetchError' || e.status === 0 || /fetch|network|load failed/i.test(e.message || '');

    const c = client(); if (!c) throw noNet();
    const { data, error } = await c.from('students').select('nickname').eq('id', user.id).maybeSingle();
    if (error) throw error;

  }
  async function enterAs(user) {   // after login, sign-up or a session saved on this device
    await loadProfile(user);
    memoryData = {};
    go(state.user ? 'home' : 'apodo');
  }
  // Returns null when saved, or the text key of the message to show
  async function saveNickname(name) {
    name = name.trim();
    if ([...name].length < 2 || [...name].length > 20) return 'textos.apodoAyuda';
    try {
      const c = client(); if (!c) return 'textos.errorConexion';
      const { error } = await c.from('students').update({ nickname: name }).eq('id', state.uid).select('nickname').single();
      if (error) return error.code === '23505' ? 'textos.apodoOcupado' : 'textos.errorConexion';
      state.user = name; return null;
    } catch (e) { return 'textos.errorConexion'; }
  }
  async function signOut() {
    try { const c = client(); if (c) await c.auth.signOut(); } catch (e) { /* signed out on this device anyway */ }
    memoryData = {};
    go('login', { user: null, uid: null, email: null, prueba: null, loginTab: 'entrar' });
  }

  /* ---------- draw a prueba (TST-01 to TST-05) ---------- */
  function pool(tipo, mid, tid) {
    return BANK.questions.filter(q => tipo === 'grado' || (q.materia === mid && (tipo === 'materia' || q.tema === tid)));
  }
  function draw(tipo, mid, tid) {
    const n = CFG.preguntasPorPrueba, used = new Set(), picked = [];
    for (const q of shuffle(pool(tipo, mid, tid))) {
      if (q.cluster && used.has(q.cluster)) continue;          // TST-04
      picked.push(q); if (q.cluster) used.add(q.cluster);
      if (picked.length === n) break;
    }
    return picked.map(q => {
      const idx = q.options.map((_, i) => i);
      const order = q.order === 'Fixed' ? idx : shuffle(idx);  // TST-03, MET-08 (Fixed is pre-sorted ascending)
      return { id: q.id, order, chosen: null, checked: false, ms: 0 };
    });
  }
  const Q = id => BANK.questions.find(q => q.id === id);

  /* ---------- performance levels for the progress map ----------
     Settings: points, "answer that counts", level limits and colours.
     Each question counts once (its latest or best answer).
     Max points of a Subtema, Tema or Materia = its questions × points per correct answer. */
  function perf() {
    const ok = {};   // question id -> counts as correct (true/false)
    for (const p of userData().pruebas) for (const r of p.respuestas) {   // pruebas are stored in time order
      if (!Q(r.id)) continue;
      ok[r.id] = CFG.respuestaQueCuenta === 'mejor' ? (ok[r.id] || r.correcta) : r.correcta;
    }
    const s = {};
    for (const q of BANK.questions) for (const k of [q.materia, q.materia + '|' + q.tema, q.materia + '|' + q.subtema]) {
      s[k] = s[k] || { c: 0, n: 0, a: 0 };
      s[k].n++; if (ok[q.id]) s[k].c++; if (q.id in ok) s[k].a++;
    }
    // points shown on the map follow from correct answers: correct × points per correct answer
    for (const k in s) { s[k].p = s[k].c * CFG.puntosPorCorrecta; s[k].max = s[k].n * CFG.puntosPorCorrecta; }
    return s;
  }
  function level(x) {
    const pct = x && x.n ? x.c / x.n : 0;   // level = questions answered correctly ÷ questions
    let n = 1;
    CFG.niveles.forEach((l, i) => { if (pct >= l.desde) n = i + 1; });
    return n;
  }
  const levelColor = n => CFG.niveles[n - 1].color;
  const levelInk = n => n >= 4 ? '#ffffff' : '#10301c';   // readable text on light and dark greens
  /* ---------- reviewer ratings (thumbs up / down per question) ----------
     Kept on this device and, when the viewer is signed in to claude.ai with
     edit access, in the page's shared store (one document per reviewer). */
  const KEY_VOTES = 'aprueba.v01.valoraciones';
  let votes = load(KEY_VOTES, {});            // { questionId: 1 | -1 | 0 }
  const remote = { db: null, uid: null, writing: false, dirty: false };
  async function pushVotes() {
    if (!remote.db) return;
    if (remote.writing) { remote.dirty = true; return; }
    remote.writing = true;
    try {
      do { remote.dirty = false; await remote.db.doc('valoraciones/' + remote.uid).set({ votos: { ...votes }, actualizado: new Date().toISOString() }); }
      while (remote.dirty);
    } catch (e) { if (!e || e.code !== 'unavailable') remote.db = null; }
    finally { remote.writing = false; }
  }
  async function initRemote() {
    try {
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const uid = await user.id(); if (!uid) return;
      const snap = await db.doc('valoraciones/' + uid).get();
      const server = snap.exists ? (snap.data().votos || {}) : {};
      const merged = { ...server, ...votes };
      votes = merged; save(KEY_VOTES, votes);
      remote.db = db; remote.uid = uid;
      if (JSON.stringify(merged) !== JSON.stringify(server)) pushVotes();
    } catch (e) { /* no shared store in this view: ratings stay on this device */ }
  }
  function vote(qid, v) {
    votes[qid] = votes[qid] === v ? 0 : v;    // tap again to remove the rating
    save(KEY_VOTES, votes); pushVotes(); render();
  }
  const totalPoints = () => userData().pruebas.reduce((a, p) => a + p.puntos, 0);

  /* ---------- sound effects (decided 28 Oct 2026) ----------
     Three short sounds generated in the browser (no files): correct = "Marimba" (two warm notes, C to G),
     wrong = "Toc suave" (muffled low knock), click = "Tic" (tiny dry tick).
     On/off is remembered on this device; the starting state and the volume come from the settings.
     No sound on the login screen. Sound never carries meaning alone (green ✓ and red ✗ stay). */
  const KEY_SOUND = 'aprueba.v01.sonido';
  const sound = { ctx: null, out: null };
  const soundOn = () => { const v = load(KEY_SOUND, null); return v === null ? CFG.sonidoInicial === 'activado' : v === 'on'; };
  function audio() {
    if (!sound.ctx) {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      sound.ctx = new C(); sound.out = sound.ctx.createGain();
      sound.out.gain.value = 0.6 * CFG.volumenSonido * CFG.volumenSonido;   // same curve as the sound picker page
      sound.out.connect(sound.ctx.destination);
    }
    if (sound.ctx.state === 'suspended') sound.ctx.resume();
    return sound.ctx;
  }
  function tone(o) {   // one note: wave type, frequency (or [from, to] glide), start offset, length, peak, optional low-pass
    const c = sound.ctx, at = c.currentTime + 0.01 + (o.at || 0);
    const osc = c.createOscillator(), g = c.createGain(); osc.type = o.type || 'sine';
    if (Array.isArray(o.f)) { osc.frequency.setValueAtTime(o.f[0], at); osc.frequency.exponentialRampToValueAtTime(o.f[1], at + (o.glide || o.dur)); }
    else osc.frequency.setValueAtTime(o.f, at);
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(o.g, at + (o.atk || 0.006)); g.gain.exponentialRampToValueAtTime(0.0001, at + o.dur);
    let end = g; if (o.lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; g.connect(f); end = f; }
    osc.connect(g); end.connect(sound.out); osc.start(at); osc.stop(at + o.dur + 0.02);
  }
  function tick() {
    const c = sound.ctx, at = c.currentTime + 0.01, len = Math.ceil(c.sampleRate * 0.025);
    const b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const s = c.createBufferSource(); s.buffer = b;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2600; f.Q.value = 1.5;
    const g = c.createGain(); g.gain.value = 0.7;
    s.connect(f); f.connect(g); g.connect(sound.out); s.start(at);
  }
  const SFX = {
    correcta: () => { tone({ type: 'triangle', f: 523, dur: .14, g: .5, lp: 2200 }); tone({ f: 2092, dur: .05, g: .06 }); tone({ type: 'triangle', f: 784, at: .09, dur: .19, g: .55, lp: 2200 }); tone({ f: 3136, at: .09, dur: .05, g: .05 }); },
    incorrecta: () => tone({ type: 'triangle', f: [240, 190], dur: .18, g: .55, lp: 1100 }),
    clic: tick
  };
  function sfx(name) {
    if (!state.user || !CFG || !soundOn()) return;
    try { if (audio()) SFX[name](); } catch (e) { /* no sound on this device: keep going */ }
  }
  const SPEAKER = '<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke="none"/>';
  const soundIcon = on => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">${SPEAKER}${on ? '<path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a7.8 7.8 0 0 1 0 11"/>' : '<path d="m16 9.5 5 5"/><path d="m21 9.5-5 5"/>'}</svg>`;
  function toggleSound() {

    const P = state.prueba, it = P.items[P.i], q = Q(it.id), n = P.items.length;
    const m = materia(q.materia);
    const dots = P.items.map((x, k) => `<span class="dot ${k === P.i && !x.checked ? 'cur' : ''} ${x.checked ? (x.chosen === Q(x.id).correct ? 'ok' : 'no') : ''}"></span>`).join('');
    const right = it.checked && it.chosen === q.correct;
    // Options (30 Oct 2026): text only, no letter keys; ✓ and ✗ stay
    const opts = it.order.map(oi => {
      let cls = 'opt', mk = '';
      if (it.checked) {
        if (oi === q.correct) { cls += ' right'; mk = '✓'; }
        else if (oi === it.chosen) { cls += ' wrong'; mk = '✗'; }
        else cls += ' dim';
      } else if (oi === it.chosen) cls += ' sel';
      return `<button class="${cls}" data-o="${oi}" ${it.checked ? 'disabled' : ''} aria-pressed="${oi === it.chosen}"><span>${fmt(q.options[oi])}</span><span class="mk" aria-hidden="true">${mk}</span></button>`;
    }).join('');
    const last = P.i === n - 1;
    app.innerHTML = `
      <div class="wmp" style="--mc:${MCOLOR[q.materia]};--pat:${pattern(q.materia)}" aria-hidden="true"></div>
      <section class="screen qscreen" style="--mc:${MCOLOR[q.materia]}">
        <div class="navrow">${P.quit ? '' : backBtn('quit', 'textos.salir')}<div class="dots" role="img" aria-label="${esc(t('textos.preguntaDe', { i: P.i + 1, n }))}">${dots}</div></div>
        ${P.quit ? `
          <div class="confirm" role="alertdialog"><p>${esc(t('textos.salirPregunta'))}</p>
            <div class="row"><button class="btn btn-ghost" id="quit-yes">${esc(t('textos.salirSi'))}</button><button class="btn btn-main" id="quit-no">${esc(t('textos.salirNo'))}</button></div></div>` : ''}
        <div class="qgrid">
        <article class="qcard">
          <div class="band"><span class="mtag">${micon(m.id)}${esc(m.name)}</span><span class="tm">· ${esc(tema(q.materia, q.tema).name)}</span>
            <span class="rate"><button class="vote up ${votes[q.id] === 1 ? 'on' : ''}" data-v="1" aria-pressed="${votes[q.id] === 1}" aria-label="${esc(t('textos.votoArriba'))}" title="${esc(t('textos.votoArriba'))}"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M7 10v11H3V10h4zm2 11h8.6a2 2 0 0 0 2-1.6l1.3-7A2 2 0 0 0 19 10h-5.2l.8-3.9a1.6 1.6 0 0 0-.4-1.5L13.3 4 9 9.2V21z" fill="currentColor"/></svg></button><button class="vote down ${votes[q.id] === -1 ? 'on' : ''}" data-v="-1" aria-pressed="${votes[q.id] === -1}" aria-label="${esc(t('textos.votoAbajo'))}" title="${esc(t('textos.votoAbajo'))}"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M7 10v11H3V10h4zm2 11h8.6a2 2 0 0 0 2-1.6l1.3-7A2 2 0 0 0 19 10h-5.2l.8-3.9a1.6 1.6 0 0 0-.4-1.5L13.3 4 9 9.2V21z" fill="currentColor"/></svg></button></span></div>
          <div class="qbody">
            <p class="stem">${fmt(q.stem)}</p>
            <div class="opts" role="group">${opts}</div>
          </div>
        </article>
        ${it.checked ? `<aside class="side">
            <div class="coach q" role="status"><span class="sr">${esc(t(right ? 'textos.correcto' : 'textos.incorrecto'))}</span><img src="img/profe-ariel-${it.line.animo}.svg" alt="${esc(t('textos.profe.nombre'))}"><p class="bubble">${esc(it.line.texto)}</p>${right ? `<span class="plus">${esc(t('textos.masPuntos', { p: CFG.puntosPorCorrecta }))}</span>` : CFG.puntosPorIncorrecta ? `<span class="plus">${esc(t('textos.masPuntos', { p: CFG.puntosPorIncorrecta }))}</span>` : ''}</div>
            <div class="fb"><h3>${esc(t('textos.explicacion'))}</h3><p>${fmt(q.feedback)}</p></div>
            ${P.quit ? '' : `<button class="btn btn-main" id="next">${esc(t(last ? 'textos.verResultado' : 'textos.siguiente'))}</button>`}
          </aside>` : `<aside class="side wait">${micon(m.id)}<span>${esc(t('textos.esperaRespuesta'))}</span></aside>`}
        </div>
      </section>`;
    // Feedback appears as soon as an answer is chosen
    app.querySelectorAll('[data-v]').forEach(b => b.onclick = () => vote(q.id, +b.dataset.v));
    app.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { if (it.checked) return; it.chosen = +b.dataset.o; it.checked = true; it.checkedAt = Date.now(); it.ms = Date.now() - P.qStart; it.line = say(it.chosen === q.correct ? 'textos.profe.pregunta.correcta' : 'textos.profe.pregunta.incorrecta'); sfx(it.chosen === q.correct ? 'correcta' : 'incorrecta'); render(); });
    const $ = id => document.getElementById(id);
    if ($('next')) $('next').onclick = advance;
    if ($('quit')) $('quit').onclick = () => { P.quit = true; render(); };
    if ($('quit-no')) $('quit-no').onclick = () => { P.quit = false; render(); };
    if ($('quit-yes')) $('quit-yes').onclick = () => go('home', { prueba: null });
  }

  function finish() {
    const P = state.prueba;
    const respuestas = P.items.map(x => { const q = Q(x.id); return { id: x.id, correcta: x.chosen === q.correct, elegida: q.options[x.chosen], ms: x.ms }; });
    const correctas = respuestas.filter(r => r.correcta).length;
    const record = {
      usuario: state.user, cuenta: state.uid, tipo: P.tipo, materia: P.mid || null, tema: P.tid || null,
      inicio: P.inicio, fin: new Date().toISOString(), duracionSeg: Math.round((Date.now() - P.t0) / 1000),
      correctas, puntos: pts(correctas, respuestas.length), respuestas
    };
    // Temas that reach the top level for the first time with this Prueba (with "Mejor", a level never goes down)
    const top5 = CFG.niveles.length, before = perf();
    userData().pruebas.push(record); saveUserData();
    const after = perf(), nuevoNivel5 = [];
    for (const m of BANK.materias) for (const x of m.temas) {
      const k = m.id + '|' + x.id;
      if (level(before[k]) < top5 && level(after[k]) >= top5) nuevoNivel5.push(x.name);
    }
    // Profe Ariel's line and «Tu resumen» come from the band of the result (limits in the settings); chosen once here
    const share = correctas / respuestas.length;
    const band = share >= CFG.mascotaFelizDesde ? 'feliz' : share >= CFG.mensajeAltoDesde ? 'alto' : share >= CFG.mensajeMedioDesde ? 'medio' : 'bajo';
    const linea = nuevoNivel5.length ? { animo: 'feliz', texto: t('textos.profe.nivel5', { tema: nuevoNivel5[0] }) } : say('textos.profe.final.' + band);
    const resumen = say('textos.resumen.' + band).texto;
    go('resultado', { resultado: record, verRespuestas: false, nuevoNivel5, linea, resumen });
  }

  // End of Prueba (30 Oct 2026): one headline, points chip, Profe Ariel large, «Tu resumen», three same-size buttons. Time is recorded, not shown.
  function viewResultado() {
    const R = state.resultado, n = R.respuestas.length;
    const { animo: mood, texto: msg } = state.linea || { animo: 'neutral', texto: '' };
    app.innerHTML = `
      <section class="screen" ${R.materia ? `style="--mc:${MCOLOR[R.materia]}"` : ''}>
        <div class="ptitle"><h1>${esc(t('textos.resultadoTitulo'))}</h1></div>
        <div class="sidegrid">
          <div class="pcard endcard">
            <div class="head"><span class="big">${esc(t('textos.resultadoCorrectas', { c: R.correctas, n }))}</span><span class="chip">${esc(t('textos.resultadoPuntos', { p: R.puntos }))}</span></div>
            <p class="sub">${esc(t('textos.resultadoCorrectasSub'))}</p>
            ${state.resumen ? `<div class="resumen"><h3>${esc(t('textos.resumenTitulo'))}</h3><p>${esc(state.resumen)}</p></div>` : ''}
            <div class="row">
              <button class="btn btn-main" id="again">${esc(t('textos.otraPrueba'))}</button>
              <button class="btn btn-ghost" id="prog">${esc(t('textos.miProgreso'))}</button>
              <button class="btn btn-ghost" id="home">${esc(t('textos.inicio'))}</button>
            </div>
          </div>
          ${bigCoach(mood, msg)}
        </div>
        <div><button class="btn btn-ghost" id="toggle-ans" aria-expanded="${!!state.verRespuestas}">${esc(t(state.verRespuestas ? 'textos.ocultarRespuestas' : 'textos.verRespuestas'))}</button></div>
        ${state.verRespuestas ? `<h2>${esc(t('textos.tusRespuestas'))}</h2>
        <div class="anscard"><ol class="list">
          ${R.respuestas.map(r => { const q = Q(r.id); return `<li><span class="m ${r.correcta ? 'ok' : 'no'}">${r.correcta ? '✓' : '✗'}</span><span class="q">${fmt(q.stem)}<small style="--mt:var(--${q.materia.toLowerCase()}-t)">${micon(q.materia)}${esc(materia(q.materia).name)} · ${esc(subtemaName(q.materia, q.subtema))}</small></span></li>`; }).join('')}
        </ol></div>` : ''}
      </section>`;
    document.getElementById('again').onclick = () => go('intro', { pick: { tipo: R.tipo, mid: R.materia, tid: R.tema } });
    document.getElementById('prog').onclick = () => go('progreso');
    document.getElementById('home').onclick = () => go('home');
    document.getElementById('toggle-ans').onclick = () => { state.verRespuestas = !state.verRespuestas; render(); };
  }

  // Mi progreso (30 Oct 2026): "Mapa de conocimientos". Each Tema fills like a glass in its Materia colour:
  // level n of 5 fills n × 20% (thresholds in the settings). Not started: dashed outline. Coming Temas: grey.
  const mapTabs = cur => `<div class="tabs" role="tablist">
      <button class="tab" role="tab" data-mat="ALL" style="--mc:var(--ink)" aria-selected="${cur === 'ALL'}">${esc(t('textos.mapaTodoTab'))}</button>
      ${BANK.materias.map(x => `<button class="tab" role="tab" data-mat="${x.id}" style="--mc:${MCOLOR[x.id]}" aria-selected="${x.id === cur}">${micon(x.id)}${esc(x.name)}</button>`).join('')}</div>`;
  const started = x => !!(x && x.a);
  const glass = x => started(x) ? `glass" style="--p:${level(x) * (100 / CFG.niveles.length)}%` : 'ns2';
  const pts2 = x => started(x) ? `<small>${esc(t('textos.progresoPuntos', { n: x.p }))}</small>` : '';
  const mapCoach = () => `<div class="coach sm mapc"><img src="img/profe-ariel-neutral.svg" alt="${esc(t('textos.profe.nombre'))}"><p class="bubble">${esc(t(userData().pruebas.length ? 'textos.profe.mapa' : 'textos.profe.mapaVacio'))}</p></div>`;
  const mapHead = (cur, title) => `<div class="navrow">${backBtn('back', 'textos.inicio')}</div>${mapCoach()}<div class="mapnav">${mapTabs(cur)}<h1>${esc(title)}</h1></div>`;
  const offCaption = () => `<p class="cap2"><i></i>${esc(t('textos.mapaInactivos'))}</p>`;

  function viewMapaTodo(S) {
    const areas = BANK.materias.map(m => {
      const sq = temaSlots(m).map(({ n, tema: x }) => x
        ? `<span class="sq ${glass(S[m.id + '|' + x.id])}"><span><em>${n}</em>${esc(x.name)}</span></span>`
        : `<span class="sq soon2"><em>${n}</em></span>`).join('');
      const sm = S[m.id], share = sm && sm.n ? Math.round(sm.c / sm.n * 100) : 0;
      return `<button class="area2" data-go="${m.id}" style="--mc:${MCOLOR[m.id]}" aria-label="${esc(m.name)}">
          <span class="ahd">${micon(m.id)}<b>${esc(m.name)}</b><span class="abar" aria-hidden="true"><i style="width:${share}%"></i></span></span>
          <span class="tsq">${sq}</span></button>`;
    }).join('');
    app.innerHTML = `
      <section class="screen">
        ${mapHead('ALL', t('textos.mapaTodoTitulo'))}
        <div class="quad2">${areas}</div>
        ${offCaption()}
      </section>`;
    app.querySelectorAll('[data-mat]').forEach(b => b.onclick = () => { state.mapMateria = b.dataset.mat; render(); });
    app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { state.mapMateria = b.dataset.go; render(); window.scrollTo(0, 0); });
    document.getElementById('back').onclick = () => go('home');
  }

  // One Materia: a card per Tema with its three Subtemas, each row filling from the left; points only once started
  function viewProgreso() {
    const S = perf();
    if (!state.mapMateria) state.mapMateria = 'ALL';
    if (state.mapMateria === 'ALL') return viewMapaTodo(S);
    const m = materia(state.mapMateria);
    const cards = temaSlots(m).map(({ n, tema: x }) => {
      if (!x) return `<article class="tc2 soonc"><div class="hd"><em>${n}</em><b>${esc(t('textos.temaN', { n }))}</b></div></article>`;
      const ts = S[m.id + '|' + x.id];
      const subs = x.subtemas.map(s => { const ss = S[m.id + '|' + s.id];
        return `<div class="srow ${glass(ss)}"><b>${esc(s.name)}</b></div>`; }).join('');
      return `<article class="tc2"><div class="hd"><em>${n}</em><b>${esc(x.name)}</b>${pts2(ts)}</div>${subs}</article>`;
    }).join('');
    app.innerHTML = `
      <section class="screen" style="--mc:${MCOLOR[m.id]}">
        ${mapHead(m.id, t('textos.mapaTitulo', { materia: m.name }))}
        <div class="tcg">${cards}</div>
        ${offCaption()}
      </section>`;
    app.querySelectorAll('[data-mat]').forEach(b => b.onclick = () => { state.mapMateria = b.dataset.mat; render(); });
    document.getElementById('back').onclick = () => go('home');
  }

  const VIEWS = { login: viewLogin, apodo: viewApodo, config: viewConfig, home: viewHome, materia: viewMateria, intro: viewIntro, pregunta: viewPregunta, resultado: viewResultado, progreso: viewProgreso };
  function render() {
    if (!state.uid) state.view = 'login';                                  // not signed in
    else if (!state.user && state.view !== 'login') state.view = 'apodo';  // signed in, no nickname yet
    if (!VIEWS[state.view]) state.view = 'home';
    // Materia screen and questions take the Materia colour (tinted page)
    // (30 Oct 2026) also the Prueba intro and the end of a Prueba on one Materia or one Tema
    const tint = state.view === 'materia' ? state.materia : state.view === 'pregunta' && state.prueba ? Q(state.prueba.items[state.prueba.i].id).materia
      : state.view === 'intro' && state.pick ? state.pick.mid || null : state.view === 'resultado' && state.resultado ? state.resultado.materia : null;
    document.body.classList.toggle('tinted', !!tint);
    document.body.setAttribute('style', tint ? '--mc:' + MCOLOR[tint] : '');
    renderTop();
    VIEWS[state.view]();
  }

  /* ---------- after answering, the next tap anywhere moves on ----------
     Nothing advances by itself: the student must tap or click.
     Buttons and links keep their own action (thumbs, Salir, Continuar).
     The tap that answered the question never counts as the next tap. */
  function advance() {
    const P = state.prueba; if (!P) return;
    if (P.i === P.items.length - 1) finish();
    else { P.i++; P.qStart = Date.now(); go('pregunta'); }
  }
  document.addEventListener('click', e => {
    if (state.view !== 'pregunta' || !state.prueba || state.prueba.quit) return;
    const it = state.prueba.items[state.prueba.i];
    if (!it.checked || Date.now() - (it.checkedAt || 0) < 350) return;
    if (e.target.closest('button, a, input')) return;
    sfx('clic'); advance();
  });
  // Click sound for every button (tiles, Continuar, tabs, thumbs, Salir…). Answer options play their own sound;
  // the speaker button plays its own tick when sound is turned back on.
  document.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || b.disabled || b.matches('.opt, #snd')) return;
    sfx('clic');
  }, true);

  /* ---------- start ---------- */
  async function start(saved) {
    try {
      const get = f => fetch(f).then(r => { if (!r.ok) throw new Error(f); return r.json(); });
      const [b, tx, aj] = await Promise.all([get('questions.json'), get('textos.json'), get('ajustes.json')]);
      CFG = aj; T = tx;
      // Temas included (settings): keep only those Temas and their questions
      const inc = new Set(aj.temasIncluidos);
      b.materias.forEach(m => { m.temas = m.temas.filter(x => inc.has(x.id)); });
      b.questions = b.questions.filter(q => inc.has(q.tema));
      BANK = b;
    } catch (e) {
      document.getElementById('loading').textContent = 'No se pudieron cargar las preguntas. Revisa tu conexión y vuelve a abrir la página.';
      return;
    }
    // A session saved on this device goes straight in (login is remembered)
    try {
      const c = client();
      const { data } = c ? await c.auth.getSession() : { data: null };
      if (data && data.session && data.session.user) { await enterAs(data.session.user); return; }
    } catch (e) { /* no connection or no saved session: show the login */ }
    render();
  }
  start();
})();
</script>
</body>
</html>
