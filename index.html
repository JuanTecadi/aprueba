    head({ back: ['quit', 'textos.salir', () => { P.quit = true; P.quitTo = null; render(); }] });
    const right = it.checked && it.chosen === q.correct;
    const slide = !!it.fbNew; it.fbNew = false;   // the explanation slides in once, right after answering (not on a re-render)
    const opts = it.order.map(oi => {
      let cls = 'qo', mk = '';
      if (it.checked) {
        if (oi === q.correct) { cls += ' right'; mk = '✓'; }
        else if (oi === it.chosen) { cls += ' wrong'; mk = '✗'; }
        else cls += ' dim';
      }
      return `<button class="${cls}" data-o="${oi}" ${it.checked ? 'disabled' : ''} aria-pressed="${oi === it.chosen}"><span>${fmt(q.options[oi])}</span><span class="mk" aria-hidden="true">${mk}</span></button>`;
    }).join('');
    const vote3 = d => { const on = votes[q.id] === d, l = esc(t(d > 0 ? 'textos.votoArriba' : 'textos.votoAbajo'));
      return `<button class="vote3" data-v="${d}" aria-pressed="${on}" aria-label="${l}" title="${l}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${THUMB(d)}</svg></button>`; };
    // 9 Nov 2026: dots in a white pill at the right of the band; thumbs at the bottom left, always visible; after
    // answering, the explanation in a blue-grey panel (no visible verdict, no «+10»; the verdict is read by screen
    // readers) and «Continuar» at the right of the thumbs.
    app.innerHTML = `
      <section class="qpage" style="--mt:var(--${k}-t);--sft:var(--${k}-s)">
        <article class="qcard3" style="--bc:var(--${k}-t)">
          <div class="qband"><span class="qhd">${(x && temaIcon(m.id, x.id)) || micon(m.id)}<span class="qloc">${esc(m.name)} · ${esc(x ? x.name : q.tema)}</span></span><div class="dots3" role="img" aria-label="${esc(t('textos.preguntaDe', { i: P.i + 1, n }))}">${dots}</div></div>
          <div class="qbody3">
            <p class="qstem">${fmt(q.stem)}</p>
            <div class="qopts" role="group">${opts}</div>
            ${it.checked ? `<p class="sr" role="status">${esc(t(right ? 'textos.correcto' : 'textos.incorrecto'))}</p>
            <div class="qfb${slide ? ' in' : ''}" id="fb">
              <p class="qlbl">${esc(t('textos.explicacion'))}</p>
              <p class="qexp">${fmt(q.feedback)}</p>
            </div>` : ''}
            <div class="qfoot"><span class="rate3">${vote3(1)}${vote3(-1)}</span>${it.checked ? `<button class="b b-pri" id="next">${esc(t(P.i === n - 1 ? 'textos.verResultado' : 'textos.siguiente'))}</button>` : ''}</div>
          </div>
        </article>
      </section>
      ${P.quit ? `<div class="qconfirm"><div class="box" role="alertdialog" aria-modal="true" aria-labelledby="qc-t"><p id="qc-t">${esc(t('textos.salirPregunta'))}</p>
        <div class="actions"><button class="b b-sec" id="quit-yes">${esc(t('textos.salirSi'))}</button><button class="b b-pri" id="quit-no">${esc(t('textos.salirNo'))}</button></div></div></div>` : ''}`;
    app.querySelectorAll('[data-v]').forEach(b => b.onclick = () => vote(q.id, +b.dataset.v));
    app.querySelectorAll('[data-o]').forEach(b => b.onclick = () => {
      if (it.checked) return;
      const before = totalPoints();
      it.chosen = +b.dataset.o; it.checked = true; it.fbNew = true; it.checkedAt = Date.now(); it.answeredAt = new Date().toISOString(); it.ms = Date.now() - P.qStart;
      sfx(it.chosen === q.correct ? 'correcta' : 'incorrecta');
      // 4 Nov 2026: the top bar adds the points at the same moment the option turns green (no extra sound)
      const after = totalPoints(); if (after !== before) state.ptsAnim = { from: before, to: after };
      render();
      // Phones and portrait: if the explanation and «Continuar» end below the screen, bring them up (on a tablet in landscape it fits)
      const fb = document.querySelector('.qfoot');
      if (fb && fb.getBoundingClientRect().bottom > innerHeight) {
        const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        fb.scrollIntoView({ block: 'end', behavior: reduce ? 'auto' : 'smooth' });
      }
    });
    const $ = id => document.getElementById(id);
    if ($('next')) $('next').onclick = advance;
    if ($('quit-no')) $('quit-no').onclick = () => { P.quit = false; P.quitTo = null; render(); };
    if ($('quit-yes')) $('quit-yes').onclick = () => go(P.quitTo || 'home', { prueba: null });
    if ($('quit-no')) $('quit-no').focus();
  }

  function finish() {
    const P = state.prueba;
    // The option chosen is saved as its code from the master workbook (K = correct, D1-D3), not its position or text
    const respuestas = P.items.map(x => { const q = Q(x.id); return { id: x.id, correcta: x.chosen === q.correct, opcion: q.codes[x.chosen], ms: x.ms, at: x.answeredAt }; });
    const correctas = respuestas.filter(r => r.correcta).length;
    const record = {
      id: newId(), tipo: P.tipo, materia: P.mid || null, tema: P.tid || null,
      inicio: P.inicio, fin: new Date().toISOString(), duracionSeg: Math.round((Date.now() - P.t0) / 1000),
      correctas, puntos: pts(correctas, respuestas.length), respuestas
    };
    // Temas that reach the top level for the first time with this Prueba (with "Mejor", a level never goes down)
    const top5 = CFG.niveles.length, before = perf();
    userData().pruebas.push(record);
    const payload = { id: record.id, tipo: record.tipo, materia: record.materia, tema: record.tema,
      started_at: record.inicio, finished_at: record.fin, duracion_seg: record.duracionSeg,
      n_preguntas: respuestas.length, n_correctas: correctas, puntos: record.puntos,
      answers: respuestas.map((r, k) => ({ question_id: r.id, posicion: k + 1, opcion: r.opcion, correcta: r.correcta, tiempo_ms: r.ms, answered_at: r.at })) };
    save(keyPend(state.uid), load(keyPend(state.uid), []).concat([{ record, payload }]));
    sendPending();
    const after = perf(), nuevoNivel5 = [];
    for (const m of BANK.materias) for (const x of m.temas) {
      const k = m.id + '|' + x.id;
      if (level(before[k]) < top5 && level(after[k]) >= top5) nuevoNivel5.push(x.name);
    }
    // The message (app's voice, 8 Nov 2026): one line from the band of the result, chosen once here; a Tema reaching
    // «Dominado» for the first time uses «nivel5» instead. The chivo: «Festejo» from mascotaFelizDesde or with nivel5.
    const share = correctas / respuestas.length;
    const band = share >= CFG.mascotaFelizDesde ? 'feliz' : share >= CFG.mensajeAltoDesde ? 'alto' : share >= CFG.mensajeMedioDesde ? 'medio' : 'bajo';
    const mensaje = nuevoNivel5.length ? t('textos.nivel5', { tema: nuevoNivel5[0] }) : say('textos.resumen.' + band).texto;
    const festejo = band === 'feliz' || nuevoNivel5.length > 0;
    go('resultado', { resultado: record, nuevoNivel5, mensaje, festejo, prueba: null });
  }

  // End of Prueba (8 Nov 2026): the back of the card. Band with the launching icon; label, «¡Terminaste la prueba!»,
  // the score, «+N puntos», the message with no label; «Mis respuestas» and «Otra prueba». The chivo beside the card.
  // Time is recorded, not shown.
  const pickOf = R => ({ tipo: R.tipo, mid: R.materia, tid: R.tema });
  function resultLabel(R) {
    if (R.tipo === 'grado') return t('textos.introGrado');
    const m = materia(R.materia);
    if (R.tipo === 'materia') return t('textos.introMateria', { materia: m.name });
    const x = tema(R.materia, R.tema);
    return t('textos.introTemaSub', { materia: m.name, n: temaNum(R.tema) }) + (x ? ' · ' + x.name : '');
  }
  function viewResultado() {
    const R = state.resultado, n = R.respuestas.length;
    head({});
    app.innerHTML = `
      <section class="page rpage"><div class="rwrap">
        <div class="gcard${prevView === 'pregunta' ? ' flip' : ''}" style="${cardStyle(pickOf(R))}">
          <div class="gband sm" aria-hidden="true">${launchIcon(pickOf(R))}</div>
          <div class="gbody">
            <p class="glbl">${esc(resultLabel(R))}</p>
            <h2>${esc(t('textos.resultadoTitulo'))}</h2>
            <div class="score3"><span class="sbig">${esc(t('textos.resultadoCorrectas', { c: R.correctas, n }))}</span><span class="gchip">${esc(t('textos.resultadoPuntos', { p: R.puntos }))}</span></div>
            <p class="ssub">${esc(t('textos.resultadoCorrectasSub'))}</p>
            ${state.mensaje ? `<p class="smsg">${esc(state.mensaje)}</p>` : ''}
            <span class="grow"></span>
            <div class="gacts"><button class="b b-sec" id="mis">${esc(t('textos.misRespuestas'))}</button><button class="b b-pri" id="again">${esc(t('textos.otraPrueba'))}</button></div>
          </div>
        </div>
        <img class="rchivo" src="img/chivo-${state.festejo ? 'festejo' : 'saludo'}.svg" alt="" aria-hidden="true">
      </div></section>`;
    document.getElementById('again').onclick = () => go('intro', { pick: pickOf(R) });
    document.getElementById('mis').onclick = () => go('respuestas');
  }

  // «Mis respuestas» (8 Nov 2026): its own screen, on the calm tint. Ten rows, all closed: number, ✓/✗, the stem on
  // one line. Location line: only the parts that change within that type of Prueba (no Subtema). An open row: the full
  // stem, «Respuesta correcta» with the correct option (every row), «Explicación». One row open at a time.
  function locLine(R, q) {
    const x = tema(q.materia, q.tema), tn = esc(x ? x.name : q.tema);
    if (R.tipo === 'grado') return `${micon(q.materia)}<span>${esc(materia(q.materia).name)} › ${tn}</span>`;
    if (R.tipo === 'materia') return `<span>${esc(t('textos.temaN', { n: temaNum(q.tema) }))} · ${tn}</span>`;
    return '';
  }
  function viewRespuestas() {
    const R = state.resultado;
    if (!R) return go('home');
    head({ back: ['back', 'textos.volver', () => go('resultado')], title: t('textos.misRespuestas'), pill: true });
    const rows = R.respuestas.map((r, k) => {
      const q = Q(r.id); if (!q) return '';
      const mk = r.correcta ? '<span class="mk ok" aria-hidden="true">✓</span>' : '<span class="mk no2" aria-hidden="true">✗</span>';
      const loc = locLine(R, q);
      return `<li style="--mt:var(--${q.materia.toLowerCase()}-t)">
        <button class="rrow" data-row="${k}" aria-expanded="false" aria-controls="ar-${k}"><span class="no">${k + 1}</span>${mk}<span class="rst"><span class="sr">${esc(t(r.correcta ? 'textos.correcto' : 'textos.incorrecto'))} </span>${fmt(q.stem)}</span><span class="chev" aria-hidden="true">›</span>${loc ? `<span class="rloc">${loc}</span>` : ''}</button>
        <div class="ropen" id="ar-${k}" hidden>
          <p class="qlbl">${esc(t('textos.respuestaCorrecta'))}</p>
          <div class="rans"><span class="mk ok" aria-hidden="true">✓</span> ${fmt(q.options[q.correct])}</div>
          <p class="qlbl">${esc(t('textos.explicacion'))}</p>
          <p class="qexp">${fmt(q.feedback)}</p>
        </div></li>`;
    }).join('');
    app.innerHTML = `<section class="apage"><ol class="rlist">${rows}</ol></section>`;
    // Only one row open at a time; no row opens by itself; no re-render, so the scroll stays put
    app.querySelectorAll('.rrow').forEach(b => b.onclick = () => {
      const open = b.getAttribute('aria-expanded') === 'true';
      app.querySelectorAll('.rrow').forEach(o => { o.setAttribute('aria-expanded', 'false'); document.getElementById(o.getAttribute('aria-controls')).hidden = true; });
      if (!open) { b.setAttribute('aria-expanded', 'true'); document.getElementById(b.getAttribute('aria-controls')).hidden = false; }
    });
  }

  /* ---------- Progreso (v0.3 step 4, 8 Nov 2026): «Mapa de conocimientos» ----------
     Segmented tabs: Todo 5to and each Materia. Level colour scale of the Materia (8 Nov 2026): levels 1 to 4 are light
     tints of the Materia colour with navy text, level 5 «Dominado» the full Materia text tone with white text.
     Not started (no question answered): white with a dashed outline, «Aún no». Not active yet: a faint outline.
     No points on the maps (4 Nov 2026), no mascot, no Subtemas (hidden from students since 8 Nov 2026). */
  const started = x => !!(x && x.a);
  const lvOf = x => started(x) ? level(x) : 0;                           // 0 = not started
  const pctOf = x => x && x.n ? Math.floor(x.c / x.n * 100) : 0;          // rounded down, so «80 %» always means Dominado
  const LVMAX = () => CFG.niveles.length;
  // The Materia's scale as CSS variables: --t text tone, --v1…--v4 tints, --ns/--nb not-started card, --rb not-started row
  const MSCALE = id => { const k = id.toLowerCase();
    return `--t:var(--${k}-t);--v1:var(--${k}-v1);--v2:var(--${k}-v2);--v3:var(--${k}-v3);--v4:var(--${k}-v4);--ns:var(--${k}-ns);--nb:var(--${k}-nb);--rb:var(--${k}-rb)`; };
  // One segmented-control button; the Materia buttons carry a small square in the Materia fill
  const segBtn = (attr, val, on, label, mid) => `<button data-${attr}="${val}" aria-pressed="${on}">${mid ? `<i class="mdot" style="background:var(--${mid.toLowerCase()})" aria-hidden="true"></i>` : ''}${esc(label)}</button>`;
  const mapTabs = cur => `<div class="segrow"><div class="seg" role="group" aria-label="${esc(t('textos.mapaTodoTitulo'))}">`
    + segBtn('mat', 'ALL', cur === 'ALL', t('textos.mapaTodoTab'))
    + BANK.materias.map(x => segBtn('mat', x.id, x.id === cur, x.name, x.id)).join('') + `</div></div>`;
  const bindMapTabs = () => app.querySelectorAll('[data-mat]').forEach(b => b.onclick = () => { state.mapMateria = b.dataset.mat; render(); window.scrollTo(0, 0); });

  // Todo 5to: four Materia columns (white cards), each with the Materia icon, name and «›» (opens that Materia's map)
  // and 12 named rows coloured by level; a one-line key under the map.
  function viewMapaTodo(S) {
    head({ title: t('textos.mapaTodoTitulo'), pill: true });
    const cols = BANK.materias.map(m => {
      const rows = temaSlots(m).map(({ n, tema: x }) => {
        if (!x) return `<li class="mtr off"><b>${n}</b><span>${esc(t('textos.temaN', { n }))}</span></li>`;
        const lv = lvOf(S[m.id + '|' + x.id]), sr = lv === 0 ? t('textos.mapaAunNo') : lv === LVMAX() ? t('textos.mapaDominado') : '';
        const ti = temaIcon(m.id, x.id);
        return `<li class="mtr lv${lv}" title="${esc(x.name)}">${ti ? `<span class="mti">${ti}</span><span class="sr">${esc(t('textos.temaN', { n }))} · </span>` : `<b>${n}</b>`}<span>${esc(x.name)}</span>${sr ? `<span class="sr"> · ${esc(sr)}</span>` : ''}</li>`;
      }).join('');
      return `<section class="mcol" style="${MSCALE(m.id)}">
          <button class="mch" data-go="${m.id}"><span class="mchi">${micon(m.id)}</span><b>${esc(m.name)}</b><span class="ar2" aria-hidden="true">›</span></button>
          <ol class="mrows">${rows}</ol></section>`;
    }).join('');
    const sw = n => `<i class="sw4 lv${n}" aria-hidden="true"></i>`;
    app.innerHTML = `
      <section class="page mapw">
        ${mapTabs('ALL')}
        <div class="mcols">${cols}</div>
        <p class="mkey" style="${MSCALE('CIE')}">${sw(0)}<span>${esc(t('textos.mapaAunNo'))}</span><span class="gap4"></span><span>${esc(t('textos.mapaPorPracticar'))}</span>${[1, 2, 3, 4, 5].map(sw).join('')}<span>${esc(t('textos.mapaDominado'))}</span></p>
      </section>`;
    bindMapTabs();
    app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { state.mapMateria = b.dataset.go; render(); window.scrollTo(0, 0); });
  }

  // One Materia (deep Materia background): 12 Tema cards (4 × 3) coloured by level, with the Tema icon (or none until
  // drawn) and «TEMA N», the name, and a bar filled to the exact percentage with the number; «✓ Dominado» from level 5.
  // Not started: dashed card with «Aún no». One explanation line under the map.
  function viewProgreso() {
    const S = perf();
    if (!state.mapMateria) state.mapMateria = 'ALL';
    if (state.mapMateria === 'ALL') return viewMapaTodo(S);
    const m = materia(state.mapMateria);
    head({ title: t('textos.mapaTitulo', { materia: m.name }), pill: true });
    const cards = temaSlots(m).map(({ n, tema: x }) => {
      if (!x) return `<div class="tc4 off"><span class="tch">${esc(t('textos.temaN', { n }))}</span></div>`;
      const s = S[m.id + '|' + x.id], lv = lvOf(s), p = pctOf(s);
      const hd = `<span class="tch">${temaIcon(m.id, x.id) || ''}<span>${esc(t('textos.temaN', { n }))}</span>`
        + (lv === LVMAX() ? `<span class="dom">✓ ${esc(t('textos.mapaDominado'))}</span>` : '') + `</span><b class="tcn">${esc(x.name)}</b>`;
      return lv === 0 ? `<div class="tc4 lv0">${hd}<span class="tcno">${esc(t('textos.mapaAunNo'))}</span></div>`
        : `<div class="tc4 lv${lv}">${hd}<span class="tcb"><span class="trk" aria-hidden="true"><i style="width:${p}%"></i></span><b>${p} %</b></span></div>`;
    }).join('');
    app.innerHTML = `
      <section class="page mapw">
        ${mapTabs(m.id)}
        <div class="tcards" style="${MSCALE(m.id)}">${cards}</div>
        <p class="mnote">${esc(t('textos.mapaNota', { p: Math.round(CFG.niveles[LVMAX() - 1].desde * 100) }))}</p>
      </section>`;
    bindMapTabs();
  }

  /* ---------- Tabla (v0.3 step 4, 8 Nov 2026; board logic from v0.2 step 5, 4 Nov 2026) ----------
     Two views in one segmented control: «Posiciones» (default) and «Mi práctica». Score = points (every correct answer,
     repeats included). Only students who opted in appear; the database function tabla_posiciones returns only rank,
     nickname and points. «Posiciones»: period and Materia filters in one row, the list (medal circles for ranks 1 to 3,
     own row in yellow), the switch card at the side. «Mi práctica»: points this week and last week, bars per week. */
  let tablaCache = {};
  const TPER = [['semana', 'textos.tablaSemana'], ['mes', 'textos.tablaMes'], ['siempre', 'textos.tablaSiempre']];
  async function loadTabla(key, per, mat) {
    tablaCache[key] = { loading: true };
    try {
      const c = client(); if (!c) throw noNet();
      const { data, error } = await c.rpc('tabla_posiciones', { p_periodo: per, p_materia: mat, p_top_n: CFG.tablaTop,
        p_inicio_semana: CFG.inicioSemana, p_zona: CFG.zonaHoraria, p_pts_correcta: CFG.puntosPorCorrecta });
      if (error) throw error;
      tablaCache[key] = { rows: data || [] };
    } catch (e) { tablaCache[key] = { error: true }; }
    if (state.view === 'tabla') render();
  }
  // Weeks in the settings' time zone: the date (YYYY-MM-DD) of the first day of the week a moment falls in
  const weekKey = d => {
    const [y, m, dd] = new Intl.DateTimeFormat('en-CA', { timeZone: CFG.zonaHoraria, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d).split('-').map(Number);
    const u = new Date(Date.UTC(y, m - 1, dd)), dow = u.getUTCDay();
    u.setUTCDate(u.getUTCDate() - (CFG.inicioSemana === 'domingo' ? dow : (dow + 6) % 7));
    return u.toISOString().slice(0, 10);
  };
  const addDays = (k, n) => { const u = new Date(k + 'T00:00:00Z'); u.setUTCDate(u.getUTCDate() + n); return u.toISOString().slice(0, 10); };
  // «Mi práctica»: the student's own points and Pruebas per week, from the Pruebas already loaded after login
  function semanas() {
    const cur = weekKey(new Date()), by = {};
    for (const p of userData().pruebas) { const k = weekKey(new Date(p.fin)); (by[k] = by[k] || { p: 0, n: 0 }); by[k].p += p.puntos; by[k].n++; }
    return Array.from({ length: CFG.progresoSemanas }, (_, i) => { const k = addDays(cur, -7 * (CFG.progresoSemanas - 1 - i)); return { k, cur: k === cur, ...(by[k] || { p: 0, n: 0 }) }; });
  }
  // Week label: the date the week starts, day above month (fits eight bars on a phone)
  const dayMonth = k => { const d = new Date(k + 'T00:00:00Z'), f = o => new Intl.DateTimeFormat('es-VE', { ...o, timeZone: 'UTC' }).format(d).replace('.', '');
    return `<b>${f({ day: 'numeric' })}</b><span>${esc(f({ month: 'short' }))}</span>`; };

  function tablaPos() {
    const per = state.tPer || 'semana', mat = state.tMat || null, key = per + '|' + (mat || 'ALL');
    const T0 = tablaCache[key];
    if (!T0) loadTabla(key, per, mat);
    let list;
    if (!T0 || T0.loading) list = `<ol class="brd4" aria-busy="true">${'<li class="ph"><span class="rk4"></span><span class="nk"></span></li>'.repeat(3)}</ol>`;
    else if (T0.error) list = `<p class="error">${esc(t('textos.errorConexion'))}</p>`;
    else {
      const rows = T0.rows;
      const ranked = rows.filter(r => r.rango !== null && !(r.soy_yo && rows.indexOf(r) >= CFG.tablaTop));
      const own = rows.filter(r => r.soy_yo && (r.rango === null || rows.indexOf(r) >= CFG.tablaTop));
      const li = r => `<li class="${r.soy_yo ? 'me' : ''}"><span class="rk4${r.rango >= 1 && r.rango <= 3 ? ' md' + r.rango : ''}">${r.rango === null ? '–' : r.rango}</span>`
        + `<span class="nk">${esc(r.soy_yo ? t('textos.tablaTu', { apodo: r.apodo }) : r.apodo)}</span><b class="pp">${esc(t('textos.puntosTotales', { n: r.puntos }))}</b></li>`;
      list = (ranked.length ? '' : `<p class="tnote4">${esc(t('textos.tablaVacia'))}</p>`)
        + (rows.length ? `<ol class="brd4">${ranked.map(li).join('')}${own.length && ranked.length ? '<li class="gap" aria-hidden="true">⋮</li>' : ''}${own.map(li).join('')}</ol>` : '');
    }
    const on = !!state.enTabla;
    return `
        <div class="segrow frow4">
          <div class="seg" role="group" aria-label="${esc(t('textos.tablaPosiciones'))}">${TPER.map(([k, l]) => segBtn('per', k, k === per, t(l))).join('')}</div>
          <div class="seg" role="group" aria-label="${esc(t('textos.tablaPosiciones'))}">${segBtn('tm', 'ALL', !mat, t('textos.tipoGrado'))}${BANK.materias.map(x => segBtn('tm', x.id, x.id === mat, x.name, x.id)).join('')}</div>
        </div>
        <div class="tgrid4">
          <div class="pcard4">${list}${per === 'semana' ? `<p class="tnote4">${esc(t('textos.tablaReinicio'))}</p>` : ''}</div>
          <div class="pcard4 swcard">
            <div class="crow"><b>${esc(t('textos.tablaSwitch'))}</b>${toggle('swt4', on, t('textos.tablaSwitch'))}</div>
            <p>${esc(t(on ? 'textos.tablaDentroNota' : 'textos.tablaFueraNota'))}</p>
            <p class="error" id="swerr" role="alert"></p>
          </div>
        </div>`;
  }
  function tablaPractica() {
    const W = semanas(), maxP = Math.max(1, ...W.map(w => w.p)), last = W[W.length - 1], prev = W[W.length - 2];
    const bars = W.map(w => `<div class="wk4${w.cur ? ' cur' : ''}${w.p ? '' : ' zero'}"><b class="wv">${w.p}</b>`
      + `<span class="bt4"><i style="height:${w.p ? Math.max(2, Math.round(w.p / maxP * 100)) : 0}%"></i></span>`
      + `<span class="wd">${w.cur ? `<b>${esc(t('textos.progresoSemanaActual'))}</b><span>&nbsp;</span>` : dayMonth(w.k)}</span>`
      + `<span class="wn">${esc(t(w.n === 1 ? 'textos.progresoPrueba' : 'textos.progresoPruebas', { n: w.n }))}</span></div>`).join('');
    return `
        <div class="pgrid4">
          <div class="pnums">
            <div class="pnum"><b>${last.p}</b><span>${esc(t('textos.progresoEstaSemana'))}</span></div>
            <div class="pnum dim"><b>${prev.p}</b><span>${esc(t('textos.progresoSemanaPasada'))}</span></div>
          </div>
          <div class="pcard4 chart4">
            <h2>${esc(t('textos.progresoTitulo'))}</h2>
            <div class="bars4">${bars}</div>
            <p class="tnote4">${esc(t('textos.progresoNota'))}</p>
          </div>
        </div>`;
  }
  function viewTabla() {
    head({ title: t('textos.tablaTitulo'), pill: true });
    const vw = state.tView || 'pos';
    app.innerHTML = `
      <section class="page tpage">
        <div class="segrow"><div class="seg" role="group" aria-label="${esc(t('textos.tablaTitulo'))}">${segBtn('tv', 'pos', vw === 'pos', t('textos.tablaPosiciones'))}${segBtn('tv', 'prac', vw === 'prac', t('textos.tablaPractica'))}</div></div>
        ${vw === 'pos' ? tablaPos() : tablaPractica()}
      </section>`;
    app.querySelectorAll('[data-tv]').forEach(b => b.onclick = () => { state.tView = b.dataset.tv; render(); });
    app.querySelectorAll('[data-per]').forEach(b => b.onclick = () => { state.tPer = b.dataset.per; render(); });
    app.querySelectorAll('[data-tm]').forEach(b => b.onclick = () => { state.tMat = b.dataset.tm === 'ALL' ? null : b.dataset.tm; render(); });
    const sw = document.getElementById('swt4');
    if (sw) sw.onclick = async () => {
      sw.disabled = true;
      const ok = await setEnTabla(!state.enTabla);
      if (!ok) { sw.disabled = false; document.getElementById('swerr').textContent = t('textos.errorConexion'); return; }
      render(); const s2 = document.getElementById('swt4'); if (s2) s2.focus();
    };
  }

  const VIEWS = { tabla: viewTabla, login: viewLogin, apodo: viewApodo, config: viewConfig, ayuda: viewAyuda, home: viewHome, materia: viewMateria, intro: viewIntro, pregunta: viewPregunta, resultado: viewResultado, respuestas: viewRespuestas, progreso: viewProgreso };
  function render() {
    if (!state.uid) state.view = 'login';                                  // not signed in
    else if (!state.user && state.view !== 'login') state.view = 'apodo';  // signed in, no nickname yet
    if (!VIEWS[state.view]) state.view = 'home';
    if ((state.view === 'resultado' || state.view === 'respuestas') && !state.resultado) state.view = 'home';
    if (state.view === 'pregunta' && !state.prueba) state.view = 'home';
    if (state.view === 'intro' && !state.pick) state.view = 'home';
    // Surfaces (8 Nov 2026): reading screens on the soft Materia tint; inside a Materia the deep Materia tone;
    // every other screen on the deep grade colour. The landscape shows on the deep surfaces only.
    const v = state.view;
    const read = v === 'pregunta' && state.prueba ? Q(state.prueba.items[state.prueba.i].id).materia
      : v === 'respuestas' && state.resultado ? (state.resultado.materia || 'ALL') : null;
    const deep = v === 'materia' ? state.materia : v === 'intro' && state.pick ? state.pick.mid || null
      : v === 'resultado' && state.resultado ? state.resultado.materia || null
      : v === 'progreso' && state.mapMateria && state.mapMateria !== 'ALL' ? state.mapMateria : null;
    document.body.classList.toggle('s-login', v === 'login');   // full-bleed split screen
    document.body.classList.toggle('s-read', !!read);
    document.body.classList.toggle('v-preg', v === 'pregunta');   // 9 Nov 2026: information area aligned with the question card
    document.body.classList.toggle('tinted', !!(read || deep));
    const tone = read && read !== 'ALL' ? read : deep;
    document.body.setAttribute('style', (tone ? '--mc:' + MCOLOR[tone] + ';' : '') + (deep ? MDEEP(deep) : ''));
    HEAD = null;
    VIEWS[v]();
    prevView = v;
    renderRail();
    renderTop();
  }

  /* ---------- after answering, the next tap anywhere moves on ----------
     Nothing advances by itself: the student must tap or click.
     Buttons and links keep their own action (thumbs, Salir, Continuar).
     The tap that answered the question never counts as the next tap. */
  function advance() {
    const P = state.prueba; if (!P) return;
    if (P.i === P.items.length - 1) finish();
    else { P.i++; P.qStart = Date.now(); go('pregunta'); }
  }
  document.addEventListener('click', e => {
    if (state.view !== 'pregunta' || !state.prueba || state.prueba.quit) return;
    const it = state.prueba.items[state.prueba.i];
    if (!it.checked || Date.now() - (it.checkedAt || 0) < 350) return;
    if (e.target.closest('button, a, input')) return;
    sfx('clic'); advance();
  });
  // Click sound for every button (tiles, Continuar, tabs, thumbs, Salir…). Answer options play their own sound;
  // the speaker button plays its own tick when sound is turned back on.
  document.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || b.disabled || b.matches('.qo, #snd')) return;
    sfx('clic');
  }, true);

  /* ---------- start ---------- */
  async function start(saved) {
    try {
      const get = f => fetch(f).then(r => { if (!r.ok) throw new Error(f); return r.json(); });
      const [b, tx, aj] = await Promise.all([get('questions.json'), get('textos.json'), get('ajustes.json')]);
      CFG = aj; T = tx;
      // Temas included (settings): keep only those Temas and their questions
      const inc = new Set(aj.temasIncluidos);
      b.materias.forEach(m => { m.temas = m.temas.filter(x => inc.has(x.id)); });
      b.questions = b.questions.filter(q => inc.has(q.tema));
      BANK = b;
    } catch (e) {
      document.getElementById('loading').textContent = 'No se pudieron cargar las preguntas. Revisa tu conexión y vuelve a abrir la página.';
      return;
    }
    // A session saved on this device goes straight in (login is remembered)
    try {
      const c = client();
      const { data } = c ? await c.auth.getSession() : { data: null };
      if (data && data.session && data.session.user) { await enterAs(data.session.user); return; }
    } catch (e) { /* no connection or no saved session: show the login */ }
    render();
  }
  start();
})();
</script>
</body>
</html>
